# [AUTO-VERSION] v0.1.0 | 19/09/2026 22:17 | plage mode Manuel 24->30C (plafond reel des vannes Bosch)
# Loads default set of integrations. Do not remove.
default_config:
homeassistant:
  packages: !include_dir_named packages

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# ==========================================
# BROWSER MOD - popup automatique sur la tablette
# ==========================================
# ⚠️ Nécessite l'intégration custom "Browser Mod" installée via HACS
# (voir instructions données dans la conversation). Sans elle installée,
# cette ligne seule ne fait rien de particulier, mais laissez-la : c'est
# elle qui active le composant une fois Browser Mod téléchargé + HA
# redémarré. Sert à afficher/fermer une popup plein écran sur la tablette
# pendant le compte à rebours avant armement de l'alarme ("Je pars").
browser_mod:

# ==========================================
# BOUTON IMPULSIONNEL - VITESSE CLIMATISATION
# ==========================================
# Ce bouton virtuel simule un appui sur la touche "Speed"
template:
  - button:
      - name: "Clim Salon Vitesse"
        icon: mdi:fan
        press:
          - action: remote.send_command
            target:
              device_id: 3c0dab21c8ba8fbc22b611816ce926c4
            data:
              num_repeats: 1
              device: Eurom_salon
              command: Speed
  - sensor:
      - name: "Présence Ordre Haut"
        unique_id: presence_ordre_haut
        icon: mdi:sort
        state: >-
          {%- set g_home = is_state('person.greg', 'home') -%}
          {%- set s_home = is_state('person.sandrine', 'home') -%}
          {%- set g_eta = states('sensor.trajet_greg_waze_trajet_greg_vers_maison') -%}
          {%- set s_eta = states('sensor.trajet_sandrine_waze_trajet_sandrine_vers_maison') -%}
          {%- set g_eta_entity = states.sensor.trajet_greg_waze_trajet_greg_vers_maison -%}
          {%- set s_eta_entity = states.sensor.trajet_sandrine_waze_trajet_sandrine_vers_maison -%}
          {%- set g_eta_age = ((now() - g_eta_entity.last_updated).total_seconds()) if g_eta_entity else 999999 -%}
          {%- set s_eta_age = ((now() - s_eta_entity.last_updated).total_seconds()) if s_eta_entity else 999999 -%}
          {%- set g_eta_ok = (g_eta not in ['unknown','unavailable','none','']) and (g_eta_age < 1800) -%}
          {%- set s_eta_ok = (s_eta not in ['unknown','unavailable','none','']) and (s_eta_age < 1800) -%}
          {%- set g_sec = (g_eta | float(0) * 60) | round(0) | int if g_eta_ok else -1 -%}
          {%- set s_sec = (s_eta | float(0) * 60) | round(0) | int if s_eta_ok else -1 -%}
          {%- set g_prio = 0 if g_home else (1 if (g_eta_ok and g_sec < 60) else (2 if (g_eta_ok and g_sec < 120) else (3 if g_eta_ok else 4))) -%}
          {%- set s_prio = 0 if s_home else (1 if (s_eta_ok and s_sec < 60) else (2 if (s_eta_ok and s_sec < 120) else (3 if s_eta_ok else 4))) -%}
          {{ 'gregory' if g_prio <= s_prio else 'sandrine' }}
      - name: "Semaine Matteo"
        unique_id: semaine_matteo
        # Garde alternée : Matteo chez Gregory les semaines ISO paires, du
        # vendredi soir au dimanche soir. Le vendredi soir, c'est toujours
        # Gregory qui va le chercher. Le dimanche soir, ça alterne toutes les
        # 2 semaines "présentes" : ancrage confirmé le 06/09/2026 (semaine 36,
        # multiple de 4) = Elodie est venue le chercher. Donc semaine % 4 == 0
        # -> Elodie vient le chercher ; semaine % 4 == 2 -> Gregory le reconduit.
        icon: >-
          {{ 'mdi:account-child' if (now().strftime('%V') | int) % 2 == 0 else 'mdi:account-child-outline' }}
        state: >-
          {{ 'Présent' if (now().strftime('%V') | int) % 2 == 0 else 'Absent' }}
        attributes:
          numero_semaine: "{{ now().strftime('%V') | int }}"
          dimanche: >-
            {% set semaine = now().strftime('%V') | int %}
            {% if semaine % 2 == 0 %}
              {{ 'Elodie vient le chercher' if semaine % 4 == 0 else 'Gregory le reconduit' }}
            {% else %}
              -
            {% endif %}
          resume: >-
            {% set semaine = now().strftime('%V') | int %}
            {% if semaine % 2 == 0 %}
              {% set handoff = 'Elodie vient le chercher' if semaine % 4 == 0 else 'Gregory le reconduit' %}
              Matteo est là ce week-end — vendredi soir, Gregory va le chercher. Dimanche soir : {{ handoff }}.
            {% else %}
              Matteo n'est pas là ce week-end.
            {% endif %}

# ==========================================
# FLUX ACTUALITÉS (RSS News Card) - Sudinfo / RTL Info / RTBF
# ==========================================
# Chaque capteur télécharge un flux RSS, le convertit en JSON (attribut
# "articles"), et alimente la carte custom:rss-news-card du dashboard Accueil.
# Nécessite jq sur l'hôte (présent par défaut sur la plupart des HAOS/Supervised).
command_line:
  - sensor:
      name: "Actu RTBF"
      unique_id: actu_rtbf
      icon: "mdi:rss"
      scan_interval: 900
      command_timeout: 30
      command: >-
        curl -skL "https://rss.rtbf.be/article/rss/rtbf_flux.xml" -A "Mozilla/5.0" | tr -d '\n' | sed 's/<item>/\n<item>/' | sed '1d' | sed 's/<!\[CDATA\[//g; s/\]\]>//g' | sed 's/<\/item>/\n/g' | grep '<item>' | head -8 | while read -r item; do
          title=$(echo "$item" | sed 's/.*<title>\([^<]*\)<\/title>.*/\1/' | sed 's/^ *//;s/ *$//');
          link=$(echo "$item" | sed 's/.*<link>\([^<]*\)<\/link>.*/\1/');
          desc=$(echo "$item" | grep -oP '(?<=<description>).*?(?=</description>)' | sed 's/&lt;/</g; s/&gt;/>/g' | sed 's/.*<p>\([^<]*\)<\/p>.*/\1/' | sed 's/<[^>]*>//g' | sed 's/&amp;nbsp;/ /g; s/&nbsp;/ /g; s/&amp;/\&/g; s/The post.*//; s/^ *//;s/ *$//' | sed 's/  */ /g');
          pub=$(echo "$item" | sed 's/.*<pubDate>\([^<]*\)<\/pubDate>.*/\1/' | awk '{
            split("Jan Feb Mar Apr May Jun Jul Aug Sep Oct Nov Dec", m)
            for(i=1;i<=12;i++) month[m[i]]=sprintf("%02d",i)
            printf "%s-%s-%sT%s+02:00", $4, month[$3], $2, $5
          }');
          img=$(echo "$item" | grep -o 'enclosure url="[^"]*"' | sed 's/enclosure url="//;s/"$//' | head -1);
          if [ -z "$img" ]; then
            img=$(echo "$item" | grep -o 'media:content[^>]*url="[^"]*"' | grep -o 'url="[^"]*"' | sed 's/url="//;s/"$//' | head -1);
          fi;
          if [ -z "$img" ]; then
            img=$(echo "$item" | grep -oE '<img[^>]+src="[^"]+"' | head -1 | cut -d'"' -f2);
          fi;
          jq -n --arg t "$title" --arg l "$link" --arg d "$desc" --arg p "$pub" --arg i "$img" \
            '{title:$t, link:$l, description:$d, pubDate:$p, image:$i}';
        done | jq -sc '{"articles": .}'
      value_template: "{{ value_json.articles | count }} articles"
      json_attributes:
        - articles
  - sensor:
      name: "Actu Sudinfo"
      unique_id: actu_sudinfo
      icon: "mdi:rss"
      scan_interval: 900
      command_timeout: 30
      command: >-
        curl -skL "https://news.google.com/rss/search?q=site:sudinfo.be+when:2d&hl=fr-BE&gl=BE&ceid=BE:fr" -A "Mozilla/5.0" | tr -d '\n' | sed 's/<item>/\n<item>/' | sed '1d' | sed 's/<!\[CDATA\[//g; s/\]\]>//g' | sed 's/<\/item>/\n/g' | grep '<item>' | head -8 | while read -r item; do
          title=$(echo "$item" | sed 's/.*<title>\([^<]*\)<\/title>.*/\1/' | sed 's/^ *//;s/ *$//');
          link=$(echo "$item" | sed 's/.*<link>\([^<]*\)<\/link>.*/\1/');
          desc=$(echo "$item" | grep -oP '(?<=<description>).*?(?=</description>)' | sed 's/&lt;/</g; s/&gt;/>/g' | sed 's/.*<p>\([^<]*\)<\/p>.*/\1/' | sed 's/<[^>]*>//g' | sed 's/&amp;nbsp;/ /g; s/&nbsp;/ /g; s/&amp;/\&/g; s/The post.*//; s/^ *//;s/ *$//' | sed 's/  */ /g');
          pub=$(echo "$item" | sed 's/.*<pubDate>\([^<]*\)<\/pubDate>.*/\1/' | awk '{
            split("Jan Feb Mar Apr May Jun Jul Aug Sep Oct Nov Dec", m)
            for(i=1;i<=12;i++) month[m[i]]=sprintf("%02d",i)
            printf "%s-%s-%sT%s+02:00", $4, month[$3], $2, $5
          }');
          img=$(echo "$item" | grep -o 'enclosure url="[^"]*"' | sed 's/enclosure url="//;s/"$//' | head -1);
          if [ -z "$img" ]; then
            img=$(echo "$item" | grep -o 'media:content[^>]*url="[^"]*"' | grep -o 'url="[^"]*"' | sed 's/url="//;s/"$//' | head -1);
          fi;
          if [ -z "$img" ]; then
            img=$(echo "$item" | grep -oE '<img[^>]+src="[^"]+"' | head -1 | cut -d'"' -f2);
          fi;
          jq -n --arg t "$title" --arg l "$link" --arg d "$desc" --arg p "$pub" --arg i "$img" \
            '{title:$t, link:$l, description:$d, pubDate:$p, image:$i}';
        done | jq -sc '{"articles": .}'
      value_template: "{{ value_json.articles | count }} articles"
      json_attributes:
        - articles
  - sensor:
      name: "Actu RTL Info"
      unique_id: actu_rtl_info
      icon: "mdi:rss"
      scan_interval: 900
      command_timeout: 30
      command: >-
        curl -skL "https://news.google.com/rss/search?q=site:rtl.be+when:2d&hl=fr-BE&gl=BE&ceid=BE:fr" -A "Mozilla/5.0" | tr -d '\n' | sed 's/<item>/\n<item>/' | sed '1d' | sed 's/<!\[CDATA\[//g; s/\]\]>//g' | sed 's/<\/item>/\n/g' | grep '<item>' | head -8 | while read -r item; do
          title=$(echo "$item" | sed 's/.*<title>\([^<]*\)<\/title>.*/\1/' | sed 's/^ *//;s/ *$//');
          link=$(echo "$item" | sed 's/.*<link>\([^<]*\)<\/link>.*/\1/');
          desc=$(echo "$item" | grep -oP '(?<=<description>).*?(?=</description>)' | sed 's/&lt;/</g; s/&gt;/>/g' | sed 's/.*<p>\([^<]*\)<\/p>.*/\1/' | sed 's/<[^>]*>//g' | sed 's/&amp;nbsp;/ /g; s/&nbsp;/ /g; s/&amp;/\&/g; s/The post.*//; s/^ *//;s/ *$//' | sed 's/  */ /g');
          pub=$(echo "$item" | sed 's/.*<pubDate>\([^<]*\)<\/pubDate>.*/\1/' | awk '{
            split("Jan Feb Mar Apr May Jun Jul Aug Sep Oct Nov Dec", m)
            for(i=1;i<=12;i++) month[m[i]]=sprintf("%02d",i)
            printf "%s-%s-%sT%s+02:00", $4, month[$3], $2, $5
          }');
          img=$(echo "$item" | grep -o 'enclosure url="[^"]*"' | sed 's/enclosure url="//;s/"$//' | head -1);
          if [ -z "$img" ]; then
            img=$(echo "$item" | grep -o 'media:content[^>]*url="[^"]*"' | grep -o 'url="[^"]*"' | sed 's/url="//;s/"$//' | head -1);
          fi;
          if [ -z "$img" ]; then
            img=$(echo "$item" | grep -oE '<img[^>]+src="[^"]+"' | head -1 | cut -d'"' -f2);
