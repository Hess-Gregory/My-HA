  simulation_presence:
    name: "Simulation de présence"
    icon: mdi:motion-sensor

# ==========================================
# MINUTERIE - DÉLAI AVANT ARMEMENT ALARME
# ==========================================
timer:
  compte_a_rebours_depart:
    name: "Départ - armement alarme"
    duration: "00:01:00"
