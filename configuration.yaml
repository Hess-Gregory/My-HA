# ==========================================
# SIMULATION DE PRÉSENCE - interrupteur manuel
# ==========================================
# Ce booléen pilote la rotation de lumières "simulation de présence" :
# quand il passe sur "on", une automation (voir automations.yaml)
# arme l'alarme, passe le chauffage en mode éco, et démarre le script de rotation.
# Quand il repasse sur "off", tout s'arrête et les lumières concernées s'éteignent.
input_boolean:
  simulation_presence:
    name: "Simulation de présence"
    icon: mdi:motion-sensor

# ==========================================
# MINUTERIE - DÉLAI AVANT ARMEMENT ALARME ("Je pars")
# ==========================================
# Quand on appuie sur "Je pars", cette minuterie de 60s démarre au lieu
# d'armer l'alarme tout de suite. Elle est affichée en compte à rebours sur
# le dashboard Accueil. Une fois à zéro (event timer.finished), l'automation
# "je_pars_armement_alarme_differe" (automations.yaml) envoie la commande
# d'armement — qui s'ajoute ensuite à la temporisation de sortie propre à la
# centrale Ajax. Si on revient avant la fin (script "Retour"), la minuterie
# est annulée et l'alarme ne s'arme pas.
timer:
  compte_a_rebours_depart:
    name: "Départ - armement alarme"
    duration: "00:01:00"
    icon: mdi:timer-alert

# ==========================================
# ANNIVERSAIRES - dates de naissance pour l'onglet "Anniversaires" du
# dashboard Calendrier (14_calendrier.yaml)
# ==========================================
# "initial" ne fixe la date qu'à la toute première création de l'aide (donc
# au premier démarrage après cet ajout) — si tu modifies ensuite une date
# depuis l'interface HA, elle ne sera plus jamais écrasée par ce fichier.
input_datetime:
  anniversaire_gregory:
    name: "Anniversaire Grégory"
    has_date: true
    has_time: false
    icon: mdi:cake-variant
    initial: "1981-09-21"
  anniversaire_sandrine:
    name: "Anniversaire Sandrine"
    has_date: true
    has_time: false
    icon: mdi:cake-variant
    initial: "1985-03-13"
  anniversaire_matteo:
    name: "Anniversaire Matteo"
    has_date: true
    has_time: false
    icon: mdi:cake-variant
    initial: "2013-11-13"
  anniversaire_hugo:
    name: "Anniversaire Hugo"
    has_date: true
    has_time: false
    icon: mdi:cake-variant
    initial: "2024-06-05"

# ==========================================
# LOGGER - réduction du bruit dans le journal
# ==========================================
# Niveau général "warning". Trois intégrations sont réduites au silence parce
# qu'elles répètent des messages non bloquants qui n'appellent aucune action :
#   - flightradar24 : erreurs 429 le temps que le quota API se libère.
#   - bticino_intercom + pybticino.websocket : le websocket vers le cloud
#     Legrand tombe (code 1006), le coordinateur le déclare périmé après 300 s
#     de silence, force une reconnexion, que le serveur rejette parfois. La
#     boucle s'auto-entretient toutes les 30 s et représentait à elle seule
#     ~75 % du volume du journal. Aucun impact fonctionnel : les 15 entités du
#     visiophone (serrure, éclairage, caméras, compteur d'appels) fonctionnent
#     normalement. Bug de l'intégration custom v2.0.2, à remonter en amont.
# Passer en "critical" plutôt qu'en "error" : ces messages sont déjà émis en
# warning/error, donc seul "critical" les fait réellement taire.
logger:
  default: warning
  logs:
    custom_components.flightradar24: critical
    custom_components.bticino_intercom: critical
    pybticino.websocket: critical
 
# ==========================================
# RECORDER - allègement de la base de données d'historique
# ==========================================
# Contexte : au 19/09/2026 la base atteignait 997 Mo pour 11 jours d'historique
# (~90 Mo/jour, ~200 000 changements d'état par jour), ce qui pesait sur la
# réactivité de l'interface — chaque graphe d'historique interroge ce volume —
# et sur la durée des redémarrages.
#
# purge_keep_days: 7      -> une semaine d'historique détaillé suffit ; les
#                            statistiques long terme (Énergie) ne sont PAS
#                            concernées, elles sont conservées indéfiniment.
# commit_interval: 30     -> regroupe les écritures toutes les 30 s au lieu de
#                            toutes les secondes : moins d'I/O sur l'eMMC de la
#                            HA Green, donc moins d'usure et moins de CPU.
# auto_repack: true       -> compacte le fichier SQLite lors de la purge
#                            automatique nocturne (sinon les pages libérées
#                            restent allouées et le fichier ne rétrécit jamais).
#
# ⚠️ NE JAMAIS exclure les capteurs d'énergie du Shelly EM-50 :
#    ..._energie, ..._aujourd_hui, ..._cette_semaine, ..._ce_mois,
#    ..._heures_pleines_depuis_dernier_releve, ..._heures_creuses_depuis_dernier_releve
#    Les exclure effacerait les statistiques long terme et casserait le
#    tableau de bord Énergie ainsi que le suivi de coût bihoraire.
recorder:
  purge_keep_days: 7
  commit_interval: 30
  auto_repack: true
  exclude:
    entities:
      # Horloges : historiser l'heure n'a aucun sens (1 ligne/minute chacun).
      - sensor.time
      - sensor.date_time
      - sensor.time_date
      - sensor.time_utc
      - sensor.date_time_utc
      # Compteurs de fonctionnement, monotones et sans intérêt historique.
      - sensor.boiler_ubauptime
      - sensor.system_uptime
      - sensor.system_uptime_sec
      - sensor.system_rxreceived
      - sensor.system_txreads
      # Shelly Pro EM-50 : grandeurs électriques instantanées. On garde
      # ..._puissance (graphe utile) et tous les compteurs d'énergie ;
      # ces quatre-là représentaient ~1 800 écritures toutes les 2 h pour
      # un intérêt quasi nul.
      - sensor.buanderie_local_tech_compteur_general_maison_puissance_apparente
      - sensor.buanderie_local_tech_compteur_general_maison_courant
      - sensor.buanderie_local_tech_compteur_general_maison_tension
      - sensor.buanderie_local_tech_compteur_general_maison_facteur_de_puissance
    entity_globs:
      # Capteurs calculés du package chauffage : valeurs dérivées, recalculées
      # en permanence, reconstituables à tout moment.
      - sensor.prochain_changement_*
      - sensor.mode_horaire_*
      - sensor.ecart_*
      # FlightRadar24 : affichage temps réel uniquement.
      - sensor.flightradar24_*
      # Détections IA Reolink redondantes avec les binary_sensor _personne
      # et _vehicule déjà conservés.
      - binary_sensor.*_intrusion_area_1_*
      - binary_sensor.*_franchissement_de_ligne_*
