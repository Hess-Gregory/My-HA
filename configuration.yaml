  anniversaire_sandrine:
    name: "Anniversaire Sandrine"
    has_date: true
    has_time: false
    icon: mdi:cake-variant
    initial: "1985-03-13"

  anniversaire_matteo:
    name: "Anniversaire Matteo"
    has_date: true
    has_time: false
    icon: mdi:cake-variant
    initial: "2013-11-13"

  anniversaire_hugo:
    name: "Anniversaire Hugo"
    has_date: true
    has_time: false
    icon: mdi:cake-variant
    initial: "2024-06-05"

# ==========================================
# LOGGER
# ==========================================
logger:
  default: warning
  logs:
    custom_components.bticino_intercom: critical
    pybticino.websocket: critical

# ==========================================
# RECORDER
# ==========================================
recorder:
  purge_keep_days: 7
  commit_interval: 30
  auto_repack: true
  exclude:
    entities:
      - sensor.time
      - sensor.date_time
      - sensor.time_date
      - sensor.time_utc
      - sensor.date_time_utc
      - sensor.boiler_ubauptime
      - sensor.system_uptime
      - sensor.system_uptime_sec
      - sensor.system_rxreceived
      - sensor.system_txreads
      - sensor.buanderie_local_tech_compteur_general_maison_puissance_apparente
      - sensor.buanderie_local_tech_compteur_general_maison_courant
      - sensor.buanderie_local_tech_compteur_general_maison_tension
      - sensor.buanderie_local_tech_compteur_general_maison_facteur_de_puissance
    entity_globs:
      # Planning Matteo : gros attributs / formulaire, inutiles dans l'historique
      - sensor.planning_matteo_*
      - sensor.matteo_form_*
      - sensor.matteo_options_source
      - sensor.matteo_prochain_weekend
      - sensor.matteo_statistiques
      - input_*.matteo_*
      # Performances : entités très bavardes sans intérêt historique (≈ 20 000 écritures / jour en moins)
      - media_player.spotifyplus_*
      - calendar.*
      - sensor.salon_sam_tablette_espace_libre_du_stockage_interne
      - sensor.salon_sam_tablette_memoire_libre
      - sensor.*_distance_estimee
      - binary_sensor.browser_mod_*
      - sensor.browser_mod_*
      - camera.bticino_intercom_*
      - sensor.sw_*_puissance_poe_*
      - sensor.prochain_changement_*
      - sensor.mode_horaire_*
      - sensor.ecart_*
      - binary_sensor.*_intrusion_area_1_*
      - binary_sensor.*_franchissement_de_ligne_*
