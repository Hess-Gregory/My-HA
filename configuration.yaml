# ==========================================
# SIMULATION DE PRÉSENCE - interrupteur manuel
# ==========================================
# Ce booléen pilote la rotation de lumières "simulation de présence" :
# quand il passe sur "on", une automation (voir automations.yaml)
# arme l'alarme, passe le chauffage en mode éco, et démarre le script de rotation.
# Quand il repasse sur "off", tout s'arrête et les lumières concernées s'éteignent.
input_boolean:
  simulation_presence:
    name: "Simulation de présence"
    icon: mdi:motion-sensor

# ==========================================
# MINUTERIE - DÉLAI AVANT ARMEMENT ALARME ("Je pars")
# ==========================================
# Quand on appuie sur "Je pars", cette minuterie de 60s démarre au lieu
# d'armer l'alarme tout de suite. Elle est affichée en compte à rebours sur
# le dashboard Accueil. Une fois à zéro (event timer.finished), l'automation
# "je_pars_armement_alarme_differe" (automations.yaml) envoie la commande
# d'armement — qui s'ajoute ensuite à la temporisation de sortie propre à la
# centrale Ajax. Si on revient avant la fin (script "Retour"), la minuterie
# est annulée et l'alarme ne s'arme pas.
timer:
  compte_a_rebours_depart:
    name: "Départ - armement alarme"
    duration: "00:01:00"
    icon: mdi:timer-alert

# ==========================================
# ANNIVERSAIRES - dates de naissance pour l'onglet "Anniversaires" du
# dashboard Calendrier (14_calendrier.yaml)
# ==========================================
# "initial" ne fixe la date qu'à la toute première création de l'aide (donc
# au premier démarrage après cet ajout) — si tu modifies ensuite une date
# depuis l'interface HA, elle ne sera plus jamais écrasée par ce fichier.
input_datetime:
  anniversaire_gregory:
    name: "Anniversaire Grégory"
    has_date: true
    has_time: false
    icon: mdi:cake-variant
    initial: "1981-09-21"
  anniversaire_sandrine:
    name: "Anniversaire Sandrine"
    has_date: true
    has_time: false
    icon: mdi:cake-variant
    initial: "1985-03-13"
  anniversaire_matteo:
    name: "Anniversaire Matteo"
    has_date: true
    has_time: false
    icon: mdi:cake-variant
    initial: "2013-11-13"
  anniversaire_hugo:
    name: "Anniversaire Hugo"
    has_date: true
    has_time: false
    icon: mdi:cake-variant
    initial: "2024-06-05"

# ==========================================
# LOGGER - réduction du bruit dans le journal
# ==========================================
# On garde le niveau général à "warning" (comportement par défaut). Les deux
# intégrations qui remontent des messages répétés non bloquants (FlightRadar24
# en erreur 429 le temps que le quota API se libère, et Music Assistant en
# coupure de connexion qui se rétablit seule) émettent déjà leurs messages au
# niveau "error" — les mettre sur "error" ne changerait donc rien. On les
# passe à "critical" pour vraiment les faire taire dans le journal, sans
# toucher au reste : ce ne sont pas des pannes qui nécessitent une action.
logger:
  default: warning
  logs:
    custom_components.flightradar24: critical

# ==========================================
# RECORDER - allègement de la base de données d'historique
# ==========================================
# purge_keep_days réduit l'historique conservé à 10 jours (au lieu des 10
# jours par défaut de HA en réalité identiques, mais explicite ici pour
# pouvoir l'ajuster facilement). exclude.entity_globs empêche les capteurs
# calculés qui changent très souvent (écarts de température, prochains
# changements, mode horaire) d'être enregistrés dans l'historique long terme :
# ce sont des valeurs dérivées, pas besoin de les garder, et cela allège
# fortement la base de données et les requêtes de l'interface.
recorder:
  purge_keep_days: 10
  exclude:
    entity_globs:
      - sensor.prochain_changement_*
      - sensor.mode_horaire_*
      - sensor.ecart_*