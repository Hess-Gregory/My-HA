- type: grid
  column_span: 2
  cards:
  - type: custom:mushroom-title-card
    grid_options:
      columns: full
    alignment: center
    title: 📝 Todoist — Horaires Pro
    subtitle: Source de vérité · tâches modifiables directement depuis Home Assistant
    card_mod:
      style: "ha-card {\n  background: rgba(25, 18, 38, 0.72) !important;\n  backdrop-filter: blur(16px) !important;\n  -webkit-backdrop-filter: blur(16px) !important;\n  box-shadow: none !important;\n  padding: 12px 20px !important;\n}\nha-markdown {\n  text-align: center !important;\n  text-shadow:\n    0 1px 3px rgba(0,0,0,0.95),\n    0 2px 10px rgba(0,0,0,0.9),\n    0 0 2px rgba(0,0,0,1) !important;\n  color: #f6d68a !important;\n}\n"
  - type: todo-list
    entity: todo.horaires_pro
    title: Horaires Pro
    hide_completed: true
    hide_create: false
    hide_section_headers: false
    display_order: duedate_asc
    item_tap_action: edit
    grid_options:
      columns: 12
      rows: auto
    card_mod:
      style: "ha-card {\n  background: rgba(38, 28, 58, 0.55) !important;\n  backdrop-filter: blur(16px) !important;\n  -webkit-backdrop-filter: blur(16px) !important;\n  border: none !important;\n  border-radius: 20px !important;\n  box-shadow: none !important;\n}\n"
  - type: markdown
    content: <div style="text-align:left; opacity:0.5; font-size:11px; padding:2px 8px 4px 8px;"> {{ state_attr('sensor.horaires_pro_version', 'affichage') }} </div>
    grid_options:
      columns: 12
      rows: 1
    card_mod:
      style: "ha-card {\n  background: transparent !important;\n  border: none !important;\n  box-shadow: none !important;\n  padding: 0 !important;\n  margin-top: -6px !important;\n}\nha-markdown {\n  padding: 0 !important;\n}\n"
- type: grid
  cards:
  - type: markdown
    content: '<!-- versioning-footer -->

      <div style="text-align:center;font-size:0.72em;opacity:0.55;line-height:1.7;margin-top:10px;padding-top:8px;border-top:1px solid var(--divider-color);">

      🔧 <b>dashboard_calendrier</b> &middot; v{{ state_attr(''sensor.versions_config_ha'', ''.storage/lovelace.dashboard_calendrier'').version if state_attr(''sensor.versions_config_ha'', ''.storage/lovelace.dashboard_calendrier'') else ''0.0.0'' }} &middot; {{ as_timestamp(state_attr(''sensor.versions_config_ha'', ''.storage/lovelace.dashboard_calendrier'').last_update) | timestamp_custom(''%d/%m/%Y a %H:%M'') if state_attr(''sensor.versions_config_ha'', ''.storage/lovelace.dashboard_calendrier'') else ''non versionne'' }}<br>

      📦 <b>horaires_pro</b> &middot; v{{ state_attr(''sensor.versions_config_ha'', ''packages/horaires_pro.yaml'').version if state_attr(''sensor.versions_config_ha'', ''packages/horaires_pro.yaml'') else ''0.0.0'' }} &middot; {{ as_timestamp(state_attr(''sensor.versions_config_ha'', ''packages/horaires_pro.yaml'').last_update) | timestamp_custom(''%d/%m/%Y a %H:%M'') if state_attr(''sensor.versions_config_ha'', ''packages/horaires_pro.yaml'') else ''non versionne'' }}<br>

      📦 <b>horaires_pro_editeur</b> &middot; v{{ state_attr(''sensor.versions_config_ha'', ''packages/horaires_pro_editeur.yaml'').version if state_attr(''sensor.versions_config_ha'', ''packages/horaires_pro_editeur.yaml'') else ''0.0.0'' }} &middot; {{ as_timestamp(state_attr(''sensor.versions_config_ha'', ''packages/horaires_pro_editeur.yaml'').last_update) | timestamp_custom(''%d/%m/%Y a %H:%M'') if state_attr(''sensor.versions_config_ha'', ''packages/horaires_pro_editeur.yaml'') else ''non versionne'' }}<br>

      Conçu et maintenu par <b>Gregory</b> via Claude AI

      </div>'
