        name: '[[[ const l = (window.__hpMergedList && window.__hpMergedList(states[''input_datetime.hp_editeur_date''].state)) || []; const t = l[0]; if (!t) return ''''; return t.emoji + '' '' + t.nom + '' — '' + (t.start ? t.start + (t.end ? ''–''+t.end : '''') : ''journée entière''); ]]]'
