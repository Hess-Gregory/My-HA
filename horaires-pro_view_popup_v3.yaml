title: Horaires Pro
path: horaires-pro
icon: mdi:briefcase-clock
show_icon_and_title: true
type: sections
max_columns: 2
header:
  card:
    type: markdown
    content: '# 💼 Horaires Pro — Vue Mois

      Todoist = source de vérité · calculs métiers conservés · détail des blocs ci-dessous'
    text_only: true
    card_mod:
      style: "ha-card {\n  background: rgba(25, 18, 38, 0.72) !important;\n  backdrop-filter: blur(16px) !important;\n  -webkit-backdrop-filter: blur(16px) !important;\n  box-shadow: none !important;\n  padding: 12px 20px !important;\n}\nha-markdown {\n  text-align: center !important;\n  text-shadow:\n    0 1px 3px rgba(0,0,0,0.95),\n    0 2px 10px rgba(0,0,0,0.9),\n    0 0 2px rgba(0,0,0,1) !important;\n  color: #f6d68a !important;\n}\n"
sections:
- type: grid
  column_span: 2
  cards:
  - type: custom:mushroom-title-card
    grid_options:
      columns: full
    alignment: center
    title: 📅 Horaires Pro
    subtitle: Grille mensuelle · Gregory et Sandrine · Todoist
    card_mod:
      style: "ha-card {\n  background: rgba(25, 18, 38, 0.72) !important;\n  backdrop-filter: blur(16px) !important;\n  -webkit-backdrop-filter: blur(16px) !important;\n  box-shadow: none !important;\n  padding: 12px 20px !important;\n}\n"
  - type: custom:family-calendar-card
    locale: fr
    defaultView: Month
    startingDay: monday
    showHeader: true
    showHeaderDate: false
    showHeaderClock: false
    showNavigation: true
    swipeNavigation: true
    showWeekDayText: true
    showTime: true
    showDate: true
    showCalendarName: true
    showLocation: false
    showDescription: true
    showWeather: false
    showCurrentWeather: false
    compact: false
    fillHeight: true
    highlightWeekend: true
    weekendDays:
    - 6
    - 7
    weekendColor: rgba(130, 130, 145, 0.18)
    multiDayMode: single
    updateInterval: 60
    slotStartHour: 6
    slotEndHour: 22
    aiQuickAdd: true
    aiTaskEntity: ai_task.claude_ai_task
    defaultCalendar: calendar.horaires_pro
    theme: familial
    colorFullEvent: true
    calendars:
    - entity: calendar.horaires_pro
      name: Grégory
      color: '#66BB6A'
      icon: mdi:account-hard-hat
      titleEmoji: 🧑
      filter: '^(?!— Gregory(?: —.*)?$).*$'
    - entity: calendar.horaires_pro
      name: Sandrine
      color: '#C39BD3'
      icon: mdi:account
      titleEmoji: 👩
      filter: '^(?!— Sandrine(?: —.*)?$).*$'
    materialSymbols: true
    grid_options:
      columns: 24
      rows: auto
    card_mod:
      style: "ha-card {\n  background: rgba(38, 28, 58, 0.55) !important;\n  backdrop-filter: blur(16px) !important;\n  -webkit-backdrop-filter: blur(16px) !important;\n  border: none !important;\n  border-radius: 20px !important;\n  box-shadow: none !important;\n  overflow: hidden !important;\n  color: var(--primary-text-color) !important;\n  min-height: 620px !important;\n  height: 620px !important;\n}\n.event, .event-dots {\n  pointer-events: none !important;\n}\n"
  - type: markdown
    content: <div style="text-align:left; opacity:0.5; font-size:11px; padding:2px 8px 4px 8px;"> {{ state_attr('sensor.horaires_pro_version', 'affichage') }} </div>
    grid_options:
      columns: 12
      rows: 1
    card_mod:
      style: "ha-card {\n  background: transparent !important;\n  border: none !important;\n  box-shadow: none !important;\n  margin-top: -8px !important;\n  margin-bottom: 0 !important;\n  padding: 0 !important;\n}\nha-markdown {\n  padding: 0 !important;\n}\n"
