                                  action: fire-dom-event
                                  browser_mod:
                                    service: browser_mod.close_popup
                              - type: custom:button-card
                                name: Confirmer
                                color: red
                                tap_action:
                                  action: call-service
                                  service: script.horaires_pro_supprimer_tache
            - type: conditional
