                - type: markdown
                  content: '{% set b = state_attr(''sensor.horaires_pro_tache_selectionnee'', ''bloc'') | default({}, true) %} {% if b == {} %} ℹ️ Aucune tâche sélectionnée. {% else %} {% set d = b.date[:10] %} {% set date_fr = d[8:10] ~ ''/'' ~ d[5:7] ~ ''/'' ~ d[0:4] %} {% set eff = b.effective_minutes | int(0) %} <div style="border-left: 6px solid {{ b.couleur }}; padding: 10px 16px; border-radius: 10px; background: rgba(255,255,255,0.06);"> <h2 style="margin:0 0 6px 0;">{{ b.emoji }} {{ b.nom }} — {{ ''Grégory'' if b.personne == ''Gregory'' else ''Sandrine'' }}</h2> <p style="margin:2px 0;">📅 {{ date_fr }}{% if b.start %} · ⏰ {{ b.start }}{% if b.end %} → {{ b.end }}{% endif %}{% endif %}</p> <p style="margin:2px 0;">⏱️ Durée : {{ (b.duration_minutes / 60) | round(2) }} h{% if b.pause_minutes and b.pause_minutes > 0 %} · ☕ Pause : {{ ''%02d:%02d'' | format(b.pause_minutes // 60, b.pause_minutes % 60) }}{% endif %}{% if eff > 0 %} · ✅ Effectif : {{ (eff / 60) | round(2) }} h{% endif %}</p> </div> {% endif %}'
                - type: horizontal-stack
