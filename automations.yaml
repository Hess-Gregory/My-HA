# ==========================================================================
# AJOUTS - SIMULATION DE PRÉSENCE (bouton du dashboard Accueil)
# ==========================================================================
# ⚠️ Le chauffage n'a pas de thermostat global unique : il fonctionne par
# pièce via les input_select.mode_* (package chauffage.yaml). L'action
# ci-dessous passe donc les 5 pièces en mode "Éco" plutôt que de cibler une
# entité climate.set_preset_mode qui n'a jamais existé dans cette install.
# Le spot caméra couloir est réglé : light.e1_outdoor_se_poe_projecteur.
# ⚠️ Ce fichier utilise !secret alarm_code (défini dans secrets.yaml).
# Conséquence connue de Home Assistant : l'éditeur graphique des
# automatisations (Paramètres > Automatisations > crayon) ne supporte PAS
# les !secret et renverra une erreur 500 "Secrets not supported in this
# YAML file" si vous essayez d'ouvrir N'IMPORTE QUELLE automatisation de ce
# fichier dans cet éditeur. Ce n'est pas un bug : c'est une limitation du
# composant qui lit ce fichier directement, sans résoudre les secrets.
# → Toute modification de automations.yaml doit désormais se faire via un
#   éditeur de texte (File editor / Studio Code Server / SSH), jamais via
#   le bouton crayon de l'interface. Les automatisations elles-mêmes
#   continuent de fonctionner normalement (démarrage, activation/
#   désactivation depuis la liste), seule l'édition graphique est bloquée.
# ==========================================================================
- id: 'simulation_presence_activation'
  alias: Simulation de présence - activation
  description: >-
    Démarre la simulation de présence quand le bouton du dashboard est activé
    : arme l'alarme, passe le chauffage en éco (toutes les pièces), lance la
    rotation de lumières.
  triggers:
  - trigger: state
    entity_id: input_boolean.simulation_presence
    to: 'on'
  conditions: []
  actions:
  - action: alarm_control_panel.alarm_arm_away
    metadata: {}
    target:
      entity_id: alarm_control_panel.buanderie_local_tech_centrale_alarme_ajax
    data:
      code: !secret alarm_code
  - action: input_select.select_option
    metadata: {}
    target:
      entity_id:
        - input_select.mode_couloir
        - input_select.mode_piece_de_vie
        - input_select.mode_chambre_enfants
        - input_select.mode_chambre_adulte
        - input_select.mode_salle_de_bain
    data:
      option: Éco
  - action: script.turn_on
    metadata: {}
    target:
      entity_id: script.simulation_presence_rotation
    data: {}
  mode: single
- id: 'simulation_presence_desactivation'
  alias: Simulation de présence - désactivation
  description: >-
    Arrête la simulation de présence quand le bouton du dashboard est
    désactivé : coupe la rotation et éteint toutes les lumières utilisées.
  triggers:
  - trigger: state
    entity_id: input_boolean.simulation_presence
    to: 'off'
  conditions: []
  actions:
  - action: script.turn_off
    metadata: {}
    target:
      entity_id: script.simulation_presence_rotation
  - action: light.turn_off
    metadata: {}
    target:
      entity_id:
      - light.lustre_salon
      - light.cuisine_cuisine
      - light.spot_cuisine
      - light.evier
      - light.salon_panneau_mural
      - light.salon_ambilight_tv
      - light.lustre_salle_a_manger
      - light.e1_outdoor_se_poe_projecteur
    data: {}
  mode: single
# ==========================================================================
# AJOUT - RÉARMEMENT AUTO ZONE CAVE
# ==========================================================================
# Réarme automatiquement la zone alarme de la cave si la porte de la cave
# est fermée depuis plus de 5 minutes et que la zone est désarmée (oubli ou
# désactivation involontaire).
# ==========================================================================
- id: 'cave_rearmement_auto'
  alias: Cave - Réarmement auto si porte fermée et zone désarmée
  description: >-
    Réarme automatiquement l'alarme de la zone cave si la porte de la cave
    est fermée depuis plus de 5 minutes et que la zone est désarmée.
  triggers:
  - trigger: state
    entity_id: binary_sensor.cave_sous_sol_cave_porte
    to: 'off'
    for:
      minutes: 5
  - trigger: state
    entity_id: alarm_control_panel.buanderie_centrale_alarme_ajax_cave
    to: disarmed
    for:
      minutes: 5
  conditions:
  - condition: state
    entity_id: binary_sensor.cave_sous_sol_cave_porte
    state: 'off'
  - condition: state
    entity_id: alarm_control_panel.buanderie_centrale_alarme_ajax_cave
    state: disarmed
  actions:
  - action: alarm_control_panel.alarm_arm_away
    metadata: {}
    target:
      entity_id: alarm_control_panel.buanderie_centrale_alarme_ajax_cave
    data:
      code: !secret alarm_code
  mode: single
# ==========================================================================
# AJOUT - "JE PARS" : ARMEMENT DE L'ALARME DIFFÉRÉ DE 60 SECONDES
# ==========================================================================
# Le script "je_pars" (scripts.yaml) ne fait plus qu'un timer.start sur
# timer.compte_a_rebours_depart (60s) au lieu d'armer l'alarme tout de
# suite. Cette automation se déclenche sur l'événement timer.finished
# (PAS sur un changement d'état) : c'est important, car un timer annulé
# (timer.cancel, fait par le script "Retour" si vous revenez avant la fin)
# déclenche l'événement timer.cancelled, pas timer.finished — donc si vous
# rentrez à temps, l'alarme ne s'arme jamais toute seule.
# Ce délai HA s'ajoute à la temporisation de sortie propre à la centrale
# Ajax : la commande d'armement n'est envoyée qu'après ces 60s, puis Ajax
# applique en plus son propre délai de sortie habituel.
# ==========================================================================
- id: 'je_pars_armement_alarme_differe'
  alias: "Je pars - armement alarme après délai de 60s"
  description: >-
    Arme l'alarme et met la tablette en veille 60 secondes après le
    lancement de la scène "Je pars", une fois la minuterie
    timer.compte_a_rebours_depart arrivée à zéro.
  triggers:
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.compte_a_rebours_depart
  conditions: []
  actions:
  - action: alarm_control_panel.alarm_arm_away
    metadata: {}
    target:
      entity_id: alarm_control_panel.buanderie_local_tech_centrale_alarme_ajax
    data:
      code: !secret alarm_code
  - action: number.set_value
    metadata: {}
    target:
      entity_id: number.salon_sam_tablette_luminosite_de_l_economiseur_d_ecran
    data:
      value: 30
  - action: switch.turn_on
    metadata: {}
    target:
      entity_id: switch.salon_sam_tablette_economiseur_d_ecran
  mode: single
# ==========================================================================
# AJOUT - POPUP COMPTE À REBOURS SUR LA TABLETTE ("Je pars")
# ==========================================================================
# ⚠️ NÉCESSITE L'INTÉGRATION CUSTOM "BROWSER MOD" (via HACS), à installer :
# 1) HACS > Intégrations > "+ Explorer & télécharger des dépôts" > cherchez
#    "Browser Mod" > Télécharger, puis redémarrez Home Assistant.
# 2) `browser_mod:` a déjà été ajouté dans configuration.yaml (voir plus
#    haut) pour l'activer.
# 3) Ouvrez le dashboard Accueil DEPUIS LA TABLETTE ELLE-MÊME (pas le PC) :
#    une petite fenêtre apparaît en bas de l'écran pour "enregistrer" ce
#    navigateur — donnez-lui un nom du style "Sam Tablette" et confirmez.
# 4) Un panneau "Browser Mod" apparaît dans le menu latéral de Home
#    Assistant : ouvrez-le, retrouvez "Sam Tablette" dans la liste des
#    navigateurs enregistrés et copiez son identifiant (browser_id).
# Browser ID de la tablette confirmé et déjà en place ci-dessous :
#   browser_mod_59a39768_1e3bd7e4
#
# Fonctionnement : à l'ouverture, une popup plein écran apparaît sur la
# tablette dès que le compte à rebours démarre (script "Je pars"), avec le
# minuteur en direct. Elle se ferme automatiquement dès que la minuterie
# repasse à "idle" — que ce soit parce qu'elle est arrivée à zéro OU parce
# qu'elle a été annulée (script "Retour", si vous revenez à temps).
# ==========================================================================
- id: 'je_pars_popup_decompte_ouverture'
  alias: "Je pars - popup compte à rebours (ouverture)"
  description: >-
    Ouvre une popup plein écran sur la tablette avec le compte à rebours
    avant armement de l'alarme.
  triggers:
  - trigger: state
    entity_id: timer.compte_a_rebours_depart
    to: active
  conditions: []
  actions:
  - action: browser_mod.popup
    metadata: {}
    data:
      browser_id:
      - browser_mod_59a39768_1e3bd7e4
      dismissable: false
      size: wide
      title: 🚪 Départ en cours
      content:
        type: vertical-stack
        cards:
        - type: custom:mushroom-title-card
          title: L'alarme va s'armer
          subtitle: Vous avez le temps de sortir tranquillement
          alignment: center
          card_mod:
            style: |
              :host {
                --primary-text-color: #f6d68a !important;
                --secondary-text-color: #d9c4f0 !important;
              }
              ha-card {
                text-shadow: 0 1px 3px rgba(0,0,0,0.95) !important;
                background: rgba(25, 18, 38, 0.85) !important;
                box-shadow: none !important;
              }
        - type: entities
          entities:
          - entity: timer.compte_a_rebours_depart
            name: Temps restant
            icon: mdi:timer-alert
          card_mod:
            style: |
              ha-card { background: rgba(38, 28, 58, 0.75) !important; }
  mode: single
- id: 'je_pars_popup_decompte_fermeture'
  alias: "Je pars - popup compte à rebours (fermeture)"
  description: >-
