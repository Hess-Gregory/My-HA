simulation_presence_rotation:
  alias: "\U0001F3AD Simulation de présence - rotation"
  description: ''
  icon: mdi:motion-sensor
  mode: single
  sequence:
  - repeat:
      while:
      - condition: state
        entity_id: input_boolean.simulation_presence
        state: 'on'
      sequence:
      - variables:
          etape: '{{ range(0, 6) | random }}'
      - choose:
        - conditions: '{{ etape == 0 }}'
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.lustre_salon
          - delay:
              seconds: '{{ range(300, 1200) | random }}'
          - action: light.turn_off
            target:
              entity_id: light.lustre_salon
        - conditions: '{{ etape == 1 }}'
          sequence:
          - action: light.turn_on
            target:
              entity_id:
              - light.cuisine_cuisine
              - light.spot_cuisine
              - light.evier
          - delay:
              seconds: '{{ range(300, 1200) | random }}'
          - action: light.turn_off
            target:
              entity_id:
              - light.cuisine_cuisine
              - light.spot_cuisine
              - light.evier
        - conditions: '{{ etape == 2 }}'
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.salon_panneau_mural
            data:
              rgb_color: '{{ [[255,180,80],[180,120,255],[255,255,220],[120,200,255],[255,120,150]]
                | random }}'
              brightness: '{{ range(80, 220) | random }}'
          - delay:
              seconds: '{{ range(300, 1200) | random }}'
          - action: light.turn_off
            target:
              entity_id: light.salon_panneau_mural
        - conditions: '{{ etape == 3 }}'
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.salon_ambilight_tv
          - delay:
              seconds: '{{ range(300, 1200) | random }}'
          - action: light.turn_off
            target:
              entity_id: light.salon_ambilight_tv
        - conditions: '{{ etape == 4 }}'
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.lustre_salle_a_manger
          - delay:
              seconds: '{{ range(300, 1200) | random }}'
          - action: light.turn_off
            target:
              entity_id: light.lustre_salle_a_manger
        - conditions: '{{ etape == 5 }}'
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.e1_outdoor_se_poe_projecteur
          - delay:
              seconds: '{{ range(300, 1200) | random }}'
          - action: light.turn_off
            target:
              entity_id: light.e1_outdoor_se_poe_projecteur
      - delay:
          seconds: '{{ range(180, 900) | random }}'
claude_proposition_dashboard:
  alias: Claude - Proposition dashboard
  description: Genere une proposition de carte Lovelace via Claude AI Task, a relire
    avant de l'appliquer.
  fields:
    demande:
      name: Demande
      description: Decris ce que tu veux comme carte ou section de dashboard
      required: true
      selector:
        text:
          multiline: true
  sequence:
  - action: ai_task.generate_data
    data:
      task_name: Proposition dashboard Lovelace
      instructions: 'Tu es un expert Home Assistant Lovelace (dashboards YAML, cartes
        mushroom, card_mod). Voici la demande de l''utilisateur : {{ demande }}. Reponds
        uniquement avec le code YAML de la ou des cartes Lovelace demandees, pret
        a etre colle dans l''editeur de dashboard en mode YAML. N''ajoute aucune explication,
        aucun texte avant ou apres, uniquement le YAML.'
      entity_id: ai_task.claude_ai_task
    response_variable: resultat
  - action: persistent_notification.create
    data:
      title: Proposition dashboard - Claude
      message: '{{ resultat.data }}'
  mode: single
claude_notification_maison:
  alias: Claude - Notification maison
  description: Genere un resume chaleureux de l'etat de la maison (meteo, alarme,
    energie) via Claude AI Task, envoye en notification persistante.
  fields:
    consigne:
      name: Consigne de ton (optionnel)
      description: 'Precise le ton ou le niveau de detail si tu veux (ex: court et
        informatif, decontracte). Laisse vide pour un ton chaleureux par defaut.'
      required: false
      selector:
        text: {}
  sequence:
  - action: ai_task.generate_data
    data:
      task_name: Notification maison
      instructions: 'Tu es un assistant qui redige des notifications courtes pour
        la maison de Gregory. Donnees actuelles : meteo = {{ states(''weather.maison'')
        }}, temperature = {{ state_attr(''weather.maison'',''temperature'') }} degres,
        alarme = {{ states(''alarm_control_panel.buanderie_local_tech_centrale_alarme_ajax'')
        }}, consommation electrique aujourd''hui = {{ states(''sensor.buanderie_local_tech_compteur_general_maison_aujourd_hui'')
        }} kWh. {% if consigne %}Ton souhaite : {{ consigne }}.{% else %}Ton par defaut
        : chaleureux, naturel, familier.{% endif %} Redige un resume de 2 a 4 phrases
        maximum en francais, sans jargon technique ni nom d''entite, pret a etre lu
        tel quel comme notification.'
      entity_id: ai_task.claude_ai_task
    response_variable: resultat
  - action: persistent_notification.create
    data:
      title: Resume maison - Claude
      message: '{{ resultat.data }}'
  mode: single
