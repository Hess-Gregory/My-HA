four_favori:
  alias: "\U0001F373 Four – Lancer un favori"
  icon: mdi:star
  mode: single
  fields:
    program:
      required: true
      selector:
        text: {}
    temperature:
      selector:
        number:
          min: 0
          max: 250
    duree:
      selector:
        number:
          min: 0
          max: 1440
    prechauffage:
      selector:
        boolean: {}
    program2:
      selector:
        text: {}
    temperature2:
      selector:
        number:
          min: 0
          max: 250
    duree2:
      selector:
        number:
          min: 0
          max: 1440
    nom:
      selector:
        text: {}
    retourner:
      selector:
        boolean: {}
  sequence:
  - action: input_text.set_value
    target:
      entity_id: input_text.four_recette_en_cours
    data:
      value: '{{ (nom | default('''')) | replace(''|'',''/'') }}|{{ 1 if (retourner
        | default(false)) in [true,''true'',''1'',1] else 0 }}|{{ duree | int(0) }}'
  - action: script.four_preparer
    data:
      program: '{{ program }}'
      temperature: '{{ temperature | int(0) }}'
      duree: '{{ duree | int(0) }}'
      prechauffage: '{{ prechauffage | default(false) }}'
  - if:
    - condition: template
      value_template: '{{ program2 is defined and program2 | string | length > 3 }}'
    then:
    - action: script.four_demarrer
    - action: persistent_notification.create
      data:
        notification_id: four
        title: "\U0001F373 Recette en 2 étapes"
        message: Étape 1 lancée ({{ duree }} min). L'étape 2 démarrera automatiquement.
    - delay:
        seconds: 20
    - wait_for_trigger:
      - trigger: state
        entity_id: sensor.four_etat
        to: finished
      timeout:
        minutes: '{{ duree | int(0) + 30 }}'
      continue_on_timeout: false
    - action: notify.mobile_app_samsung_greg
      continue_on_error: true
      data:
        title: "\U0001F373 Étape 1 terminée"
        message: Passage à l'étape 2 dès que le four est prêt (vidange de la vapeur
          en cours)…
        data:
          tag: four
          channel: Four
    - repeat:
        sequence:
        - wait_template: '{{ states(''sensor.four_etat'') in [''ready'',''inactive'']
            }}'
          timeout:
            seconds: 90
          continue_on_timeout: true
        - delay:
            seconds: 5
        - action: script.four_preparer
          data:
            program: '{{ program2 }}'
            temperature: '{{ temperature2 | int(0) }}'
            duree: '{{ duree2 | int(0) }}'
          continue_on_error: true
        - action: script.four_demarrer
          continue_on_error: true
        - delay:
            seconds: 15
        until:
        - condition: template
          value_template: '{{ states(''sensor.four_etat'') in [''run'',''delayedstart'']
            or repeat.index >= 20 }}'
    - if:
      - condition: template
        value_template: '{{ states(''sensor.four_etat'') in [''run'',''delayedstart'']
          }}'
      then:
      - action: notify.mobile_app_samsung_greg
        continue_on_error: true
        data:
          title: "\U0001F373 Étape 2 lancée"
          message: 'Fin de cuisson : {{ duree2 }} min.'
          data:
            tag: four
            channel: Four
      else:
      - action: notify.mobile_app_samsung_greg
        continue_on_error: true
        data:
          title: ⚠️ Étape 2 non lancée
          message: 'Le four n''a pas accepté l''étape 2 : lancez-la sur le four ({{
            program2 | replace(''heating_mode_'','''') | replace(''_'','' '') }},
            {{ temperature2 }} °C, {{ duree2 }} min).'
          data:
            tag: four
            channel: Four
            importance: high
            priority: high
      - action: persistent_notification.create
        data:
          notification_id: four
          title: ⚠️ Étape 2 non lancée
          message: 'Lancez l''étape 2 sur le four : {{ program2 }}, {{ temperature2
            }} °C, {{ duree2 }} min.'
four_fav_copier:
  alias: "\U0001F373 Four – Copier une recette en favori"
  icon: mdi:star-plus
  mode: single
  fields:
    valeur:
      required: true
      selector:
