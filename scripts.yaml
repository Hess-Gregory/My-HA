four_regler:
  alias: Four – Régler température / durée
  icon: mdi:tune-vertical
  mode: queued
  fields:
    cible: {}
    delta: {}
    valeur: {}
  sequence:
  - variables:
      num: '{{ ''number.cuisine_four_temperature_de_consigne'' if cible == ''temp''
        else ''number.cuisine_four_duree'' }}'
      hlp: '{{ ''input_number.four_temp_voulue'' if cible == ''temp'' else ''input_number.four_duree_voulue''
        }}'
      optk: '{{ ''cooking_oven_option_setpoint_temperature'' if cible == ''temp''
        else ''b_s_h_common_option_duration'' }}'
      enmarche: '{{ states(''sensor.four_etat'') in [''run'',''pause'',''delayedstart'']
        }}'
  - variables:
      base: '{% set a = states[num] %}{% set b = states[hlp] %}{% set aok = a is not
        none and is_number(a.state) %}{% if cible == ''duree'' and enmarche and not
        aok %}{% set fin = states(''sensor.four_heure_de_fin_de_programme'') %}{%
        set p = states(''sensor.four_progression_du_programme'') | float(0) %}{% if
        as_timestamp(fin, 0) > 0 %}{% set rest = as_timestamp(fin) - as_timestamp(now())
        %}{{ ((rest / (1 - p / 100)) if p < 99 else rest) | round(0) }}{% else %}{{
        b.state | float(0) if b is not none else 0 }}{% endif %}{% elif not aok %}{{
        b.state | float(0) if b is not none else 0 }}{% elif b is not none and b.last_changed
        > a.last_changed %}{{ b.state | float(0) }}{% else %}{{ a.state | float(0)
        }}{% endif %}'
      lo: '{{ 30 if cible == ''temp'' else 60 }}'
      hi: '{{ 250 if cible == ''temp'' else 86400 }}'
  - variables:
      nv: '{% if valeur is defined and valeur not in ['''', none] %}{% set v = valeur
        | float(0) %}{% else %}{% set v = base | float(0) + (delta | default(0) |
        float(0)) %}{% endif %}{{ ([[v, lo | float] | max, hi | float] | min) | int
        }}'
      pa: '{% set s = states(''select.four_programme_actif'') %}{% set d = states(''input_text.four_dernier_programme'')
        %}{{ s if s.startswith(''cooking_oven_program_'') else d }}'
      ps: '{{ states(''select.four_programme_selectionne'') }}'
  - if:
    - condition: template
      value_template: '{{ states(hlp) | float(-1) == nv | float }}'
    then:
    - action: input_number.set_value
      target:
        entity_id: '{{ hlp }}'
      data:
        value: '{{ lo }}'
  - action: input_number.set_value
    target:
      entity_id: '{{ hlp }}'
    data:
      value: '{{ nv }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ enmarche and pa.startswith(''cooking_oven_program_'')
          }}'
      sequence:
      - action: home_connect.set_program_and_options
        data:
          device_id: ca5d9d9c8f568dd6ce741eb1036c0fc9
          affects_to: active_program
          program: '{{ pa }}'
          oven_options: '{{ {optk: nv | int} }}'
        continue_on_error: true
    - conditions:
      - condition: template
        value_template: '{{ is_number(states(num)) }}'
      sequence:
      - action: number.set_value
        target:
          entity_id: '{{ num }}'
        data:
          value: '{{ nv }}'
        continue_on_error: true
    - conditions:
      - condition: template
        value_template: '{{ ps.startswith(''cooking_oven_program_'') }}'
      sequence:
      - action: home_connect.set_program_and_options
        data:
          device_id: ca5d9d9c8f568dd6ce741eb1036c0fc9
          affects_to: selected_program
          program: '{{ ps }}'
          oven_options: '{{ {optk: nv | int} }}'
        continue_on_error: true
