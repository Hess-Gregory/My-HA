four_preparer:
  alias: "\U0001F373 Four – Préparer un réglage"
  icon: mdi:stove
  mode: single
  description: Allume le four si besoin, sélectionne le programme puis règle température,
    durée et préchauffage rapide. Ne démarre pas la cuisson (voir script.four_demarrer).
  fields:
    program:
      description: Clé du programme (ex. heating_mode_hot_air) ou clé complète
      required: true
      selector:
        text: {}
    temperature:
      description: °C
      selector:
        number:
          min: 30
          max: 250
    duree:
      description: minutes
      selector:
        number:
          min: 0
          max: 1440
    prechauffage:
      description: Préchauffage rapide
      selector:
        boolean: {}
  sequence:
  - if:
    - condition: template
      value_template: '{{ temperature is defined and temperature not in ['''', none]
        }}'
    then:
    - action: input_number.set_value
      target:
        entity_id: input_number.four_temp_voulue
      data:
        value: '{{ temperature }}'
  - if:
    - condition: template
      value_template: '{{ duree is defined and duree not in ['''', none] }}'
    then:
    - action: input_number.set_value
      target:
        entity_id: input_number.four_duree_voulue
      data:
        value: '{{ (duree | float(0) * 60) | int }}'
  - variables:
      prog: '{{ program if program.startswith(''cooking_oven_program_'') else ''cooking_oven_program_''
        ~ program }}'
      opts: '{% set o = dict() %}{% if temperature is defined and temperature | int(0)
        > 0 %}{% set o = dict(o, cooking_oven_option_setpoint_temperature=temperature
        | int) %}{% endif %}{% if duree is defined and duree | int(0) > 0 %}{% set
        o = dict(o, b_s_h_common_option_duration=(duree | int) * 60) %}{% endif %}{%
        if prechauffage is defined and prechauffage in [true,''true'',''True'',1,''1'']
        %}{% set o = dict(o, cooking_oven_option_fast_pre_heat=true) %}{% endif %}{{
        o }}'
  - if:
    - condition: state
      entity_id: switch.four_alimentation
      state: 'off'
    then:
    - action: switch.turn_on
      target:
        entity_id: switch.four_alimentation
    - wait_template: '{{ states(''sensor.four_etat'') in [''ready'',''run'',''pause'']
        }}'
      timeout:
        seconds: 25
      continue_on_timeout: true
    - delay:
        seconds: 2
  - action: home_connect.set_program_and_options
    data:
      device_id: ca5d9d9c8f568dd6ce741eb1036c0fc9
      affects_to: selected_program
      program: '{{ prog }}'
      oven_options: '{{ opts }}'
    continue_on_error: true
  - delay:
      seconds: 3
  - if:
    - condition: template
      value_template: '{{ states(''select.four_programme_selectionne'') != prog }}'
    then:
    - action: select.select_option
      target:
        entity_id: select.four_programme_selectionne
      data:
        option: '{{ prog }}'
      continue_on_error: true
    - delay:
        seconds: 3
    - action: home_connect.set_program_and_options
      data:
        device_id: ca5d9d9c8f568dd6ce741eb1036c0fc9
        affects_to: selected_program
        program: '{{ prog }}'
        oven_options: '{{ opts }}'
      continue_on_error: true
four_demarrer:
  alias: "\U0001F373 Four – Démarrer le programme choisi"
  icon: mdi:play
  mode: single
  sequence:
  - variables:
      prog: '{% set s = states(''select.four_programme_selectionne'') %}{% set d =
        states(''input_text.four_dernier_programme'') %}{{ s if s.startswith(''cooking_oven_program_'')
        else (d if d.startswith(''cooking_oven_program_'') else '''') }}'
  - if:
    - condition: template
      value_template: '{{ prog == '''' }}'
    then:
    - action: persistent_notification.create
      data:
        notification_id: four
        title: Four
        message: Choisissez d’abord un programme (ou une recette) avant de démarrer.
    - stop: Aucun programme choisi
  - if:
    - condition: state
      entity_id: switch.four_alimentation
      state: 'off'
    then:
    - action: switch.turn_on
      target:
        entity_id: switch.four_alimentation
    - wait_template: '{{ states(''sensor.four_etat'') in [''ready'',''run'',''pause'']
        }}'
      timeout:
        seconds: 25
      continue_on_timeout: true
    - delay:
        seconds: 2
  - variables:
      opts: '{% set n_t = states(''number.cuisine_four_temperature_de_consigne'')
        %}{% set n_d = states(''number.cuisine_four_duree'') %}{% set t = n_t | int(0)
        if is_number(n_t) else states(''input_number.four_temp_voulue'') | int(0)
        %}{% set d = n_d | int(0) if is_number(n_d) else states(''input_number.four_duree_voulue'')
        | int(0) %}{% set o = dict() %}{% if t > 0 %}{% set o = dict(o, cooking_oven_option_setpoint_temperature=t)
        %}{% endif %}{% if d > 0 %}{% set o = dict(o, b_s_h_common_option_duration=d)
        %}{% endif %}{{ o }}'
  - action: home_connect.set_program_and_options
    data:
      device_id: ca5d9d9c8f568dd6ce741eb1036c0fc9
      affects_to: active_program
      program: '{{ prog }}'
      oven_options: '{{ opts }}'
    continue_on_error: true
  - wait_template: '{{ states(''sensor.four_etat'') in [''run'',''delayedstart'']
      }}'
    timeout:
      seconds: 12
    continue_on_timeout: true
  - if:
    - condition: template
      value_template: '{{ states(''sensor.four_etat'') not in [''run'',''delayedstart'']
        }}'
    then:
    - action: select.select_option
      target:
        entity_id: select.four_programme_actif
      data:
        option: '{{ prog }}'
      continue_on_error: true
four_fav_ajouter:
  alias: "\U0001F373 Four – Enregistrer le réglage en favori"
  icon: mdi:star-plus
  mode: single
  sequence:
  - variables:
      nom: '{{ states(''input_text.four_favori_nom'') | trim | replace(''|'',''/'')
        }}'
      prog: '{{ states(''select.four_programme_selectionne'') | replace(''cooking_oven_program_'','''')
        }}'
      temp: '{{ states(''number.cuisine_four_temperature_de_consigne'') | int(0) }}'
      dur: '{{ (states(''number.cuisine_four_duree'') | int(0) / 60) | round(0) |
        int }}'
      pre: '{{ 1 if is_state(''switch.cuisine_four_prechauffage_rapide'',''on'') else
        0 }}'
      slot: '{% set ns = namespace(s='''') %}{% for i in range(1,17) %}{% if ns.s
        == '''' and states(''input_text.four_favori_'' ~ i) in ['''', ''unknown'']
        %}{% set ns.s = i %}{% endif %}{% endfor %}{{ ns.s }}'
  - if:
    - condition: template
      value_template: '{{ nom in ['''',''unknown''] or prog in ['''',''unknown'',''unavailable'']
        }}'
    then:
    - action: persistent_notification.create
      data:
        notification_id: four_favori
        title: Four – favori
        message: Donnez un nom et choisissez un programme avant d’enregistrer.
    - stop: incomplet
  - if:
    - condition: template
      value_template: '{{ slot == '''' }}'
    then:
    - action: persistent_notification.create
      data:
        notification_id: four_favori
        title: Four – favori
        message: 'Les 16 favoris sont pris : supprimez-en un d’abord.'
    - stop: plein
  - action: input_text.set_value
    target:
      entity_id: input_text.four_favori_{{ slot }}
    data:
      value: '{{ nom }}|{{ prog }}|{{ temp }}|{{ dur }}|{{ pre }}'
  - action: input_text.set_value
    target:
      entity_id: input_text.four_favori_nom
    data:
      value: ''
four_fav_supprimer:
