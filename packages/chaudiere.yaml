# [AUTO-VERSION] v0.0.2 | 19/09/2026 21:53 | recorder allege, bticino silencieux, speedtest 30min
# ============================================================================
# PACKAGE "CHAUDIERE" — Junkers ZWB 28-3 CE via passerelle EMS-ESP (BBQKees)
# ----------------------------------------------------------------------------
# À placer dans /config/packages/chaudiere.yaml
#
# Reconstruit le 19/09/2026 après la perte du package d'origine (le fichier
# avait été écrasé par une copie de chauffage.yaml, puis supprimé).
#
# Toutes les entités référencées ici ont été VÉRIFIÉES comme existantes et
# alimentées sur l'installation au moment de la reconstruction :
#   sensor.boiler_servicecodenumber   (0 = aucun défaut)
#   sensor.boiler_maintenancemessage  (H00 = aucun entretien demandé)
#   number.boiler_maintenancetime     (2300 h — compteur avant entretien)
#   sensor.boiler_burnworkmin         (minutes de fonctionnement brûleur)
#   sensor.boiler_burnstarts          (nombre d'allumages brûleur)
#
# NON RECONSTRUIT, volontairement :
#   - L'alerte "pression d'eau basse" de l'ancien package. Aucun des 66
#     capteurs EMS-ESP de l'installation ne remonte la pression d'eau : la
#     Junkers ZWB 28-3 ne l'expose pas sur le bus EMS. L'automation d'origine
#     n'avait donc déjà plus de source de données. Pour surveiller la pression
#     il faut un manomètre connecté séparé.
#   - Le verrouillage par code PIN à 4 chiffres (scripts chaudiere_pin_*,
#     chaudiere_verrouiller_maintenant, chaudiere_verifier_code_technicien).
#     Son fonctionnement exact n'est pas reconstituable sans le fichier
#     d'origine : voir la procédure de récupération git fournie à part.
#
# L'alerte d'entretien légal/constructeur ("Chaudière - Alerte entretien légal
# & constructeur", contact Ets. Dubois) n'est PAS ici : elle vit toujours dans
# automations.yaml et fonctionne. Ne pas la dupliquer.
# ============================================================================

# ----------------------------------------------------------------------------
# 1. MÉMOIRE DES DÉFAUTS
# ----------------------------------------------------------------------------
input_text:
  chaudiere_dernier_code_defaut:
    name: "Chaudière - Dernier code défaut"
    icon: mdi:alert-circle-outline
    max: 255
    initial: "Aucun défaut enregistré"

  chaudiere_historique_defauts:
    name: "Chaudière - Historique des défauts"
    icon: mdi:history
    max: 255
    initial: ""

input_datetime:
  chaudiere_dernier_defaut_horodatage:
    name: "Chaudière - Horodatage du dernier défaut"
    has_date: true
    has_time: true
    icon: mdi:clock-alert-outline

# ----------------------------------------------------------------------------
# 2. CAPTEURS DE SYNTHÈSE
# ----------------------------------------------------------------------------
template:
  - sensor:
      # État lisible de la chaudière : OK, entretien demandé, ou code défaut.
      - name: "Chaudière État"
        unique_id: chaudiere_etat
        icon: >-
          {% set code = states('sensor.boiler_servicecodenumber') | int(0) %}
          {% set msg = states('sensor.boiler_maintenancemessage') %}
          {% if code != 0 %} mdi:alert-circle
          {% elif msg not in ['H00', 'unknown', 'unavailable', ''] %} mdi:wrench-clock
          {% else %} mdi:check-circle
          {% endif %}
        state: >-
          {% set code = states('sensor.boiler_servicecodenumber') | int(0) %}
          {% set msg = states('sensor.boiler_maintenancemessage') %}
          {% if code != 0 %}
            Défaut {{ code }}
          {% elif msg not in ['H00', 'unknown', 'unavailable', ''] %}
            Entretien demandé ({{ msg }})
          {% else %}
            OK
          {% endif %}
        attributes:
          code_defaut: "{{ states('sensor.boiler_servicecodenumber') | int(0) }}"
          message_entretien: "{{ states('sensor.boiler_maintenancemessage') }}"
          detail: >-
            {% set code = states('sensor.boiler_servicecodenumber') | int(0) %}
            {% set msg = states('sensor.boiler_maintenancemessage') %}
            {% if code != 0 %}
              La chaudière signale le code défaut {{ code }}. Relève-le sur
              l'afficheur de la chaudière et contacte Ets. Dubois si le
              symptôme persiste après un reset.
            {% elif msg not in ['H00', 'unknown', 'unavailable', ''] %}
              La chaudière demande un entretien (message {{ msg }}).
            {% else %}
              Aucun défaut ni demande d'entretien en cours.
            {% endif %}

      # Heures de fonctionnement du brûleur, plus lisible que les minutes.
      - name: "Chaudière Heures Brûleur"
        unique_id: chaudiere_heures_bruleur
        icon: mdi:fire-circle
        unit_of_measurement: "h"
        state_class: total_increasing
        state: >-
          {{ (states('sensor.boiler_burnworkmin') | float(0) / 60) | round(0) }}
        attributes:
          allumages: "{{ states('sensor.boiler_burnstarts') | int(0) }}"
          minutes_par_allumage: >-
            {% set st = states('sensor.boiler_burnstarts') | int(0) %}
            {% set mn = states('sensor.boiler_burnworkmin') | float(0) %}
            {{ (mn / st) | round(1) if st > 0 else 0 }}

      # Compteur d'heures avant le prochain entretien programmé dans la
      # chaudière (number.boiler_maintenancetime).
      - name: "Chaudière Heures Avant Entretien"
        unique_id: chaudiere_heures_avant_entretien
        icon: mdi:wrench-clock
        unit_of_measurement: "h"
        state: "{{ states('number.boiler_maintenancetime') | int(0) }}"

# ----------------------------------------------------------------------------
# 3. ALERTES
# ----------------------------------------------------------------------------
automation:
  # --------------------------------------------------------------------------
  # Un code défaut apparaît : notification immédiate + enregistrement.
  # --------------------------------------------------------------------------
  - id: chaudiere_alerte_code_defaut_ems_esp
    alias: "Chaudière - Alerte code défaut EMS-ESP"
    description: >-
      Notifie dès que sensor.boiler_servicecodenumber passe à une valeur non
      nulle, et mémorise le code avec son horodatage.
    triggers:
      - trigger: numeric_state
        entity_id: sensor.boiler_servicecodenumber
        above: 0
        for: "00:01:00"
    conditions: []
    actions:
      - action: input_text.set_value
        target:
          entity_id: input_text.chaudiere_dernier_code_defaut
        data:
          value: >-
            Code {{ states('sensor.boiler_servicecodenumber') }} le
            {{ now().strftime('%d/%m/%Y a %H:%M') }}
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.chaudiere_dernier_defaut_horodatage
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.chaudiere_historique_defauts
        data:
          # On garde les 255 derniers caractères : les entrées les plus
          # anciennes sont tronquées automatiquement.
          value: >-
            {{ (now().strftime('%d/%m %H:%M') ~ ' code '
               ~ states('sensor.boiler_servicecodenumber') ~ ' | '
               ~ states('input_text.chaudiere_historique_defauts'))[:255] }}
      - action: notify.mobile_app_smartphone_greg
        data:
          title: "Chaudière : code défaut {{ states('sensor.boiler_servicecodenumber') }}"
          message: >-
            La Junkers signale le code défaut
            {{ states('sensor.boiler_servicecodenumber') }}.
            Température départ : {{ states('sensor.boiler_curflowtemp') }} °C.
            Vérifie l'afficheur de la chaudière.
          data:
            tag: chaudiere_defaut
            importance: high
      - action: persistent_notification.create
        data:
          title: "Chaudière : code défaut"
          message: >-
            Code {{ states('sensor.boiler_servicecodenumber') }} détecté le
            {{ now().strftime('%d/%m/%Y a %H:%M') }}.
            Contact entretien : Ets. Dubois, +32 (0)4 343 25 59.
          notification_id: chaudiere_code_defaut
    mode: single

  # --------------------------------------------------------------------------
  # Le défaut disparaît : on prévient et on efface la notification.
  # --------------------------------------------------------------------------
  - id: chaudiere_retour_normal_code_defaut
    alias: "Chaudière - Retour à la normale (code défaut effacé)"
    description: >-
      Se déclenche quand le code défaut repasse à 0, ferme la notification
      persistante et confirme le retour à la normale.
    triggers:
      - trigger: numeric_state
        entity_id: sensor.boiler_servicecodenumber
        below: 1
        for: "00:02:00"
    conditions:
      - condition: template
        value_template: >-
          {{ states('input_text.chaudiere_dernier_code_defaut')
             != 'Aucun défaut enregistré' }}
    actions:
      - action: persistent_notification.dismiss
        data:
          notification_id: chaudiere_code_defaut
      - action: notify.mobile_app_smartphone_greg
        data:
          title: "Chaudière : défaut résolu"
          message: >-
            Le code défaut a disparu. Dernier défaut enregistré :
            {{ states('input_text.chaudiere_dernier_code_defaut') }}.
          data:
            tag: chaudiere_defaut
    mode: single

  # --------------------------------------------------------------------------
  # Demande d'entretien de la chaudière (message autre que H00).
  # --------------------------------------------------------------------------
  - id: chaudiere_alerte_message_entretien
    alias: "Chaudière - Demande d'entretien (message EMS)"
    description: >-
      Rappel quotidien à 9h tant que la chaudière affiche un message
      d'entretien différent de H00.
    triggers:
      - trigger: time
        at: "09:00:00"
    conditions:
      - condition: template
        value_template: >-
          {{ states('sensor.boiler_maintenancemessage')
             not in ['H00', 'unknown', 'unavailable', ''] }}
    actions:
      - action: notify.mobile_app_smartphone_greg
        data:
          title: "Chaudière : entretien demandé"
          message: >-
            La chaudière affiche le message
            {{ states('sensor.boiler_maintenancemessage') }}.
            Compteur avant entretien :
            {{ states('number.boiler_maintenancetime') }} h.
            Contact : Ets. Dubois, +32 (0)4 343 25 59.
          data:
            tag: chaudiere_entretien_ems
    mode: single

  # --------------------------------------------------------------------------
  # Filet de sécurité : la passerelle EMS-ESP ne répond plus.
  # --------------------------------------------------------------------------
  - id: chaudiere_alerte_passerelle_injoignable
    alias: "Chaudière - Passerelle EMS-ESP injoignable"
    description: >-
      Prévient si les capteurs de la chaudière deviennent indisponibles plus
      de 30 minutes : passerelle EMS-ESP débranchée, MQTT coupé ou problème
      réseau sur le VLAN Home.
    triggers:
      - trigger: state
        entity_id: sensor.boiler_curflowtemp
        to:
          - "unavailable"
          - "unknown"
        for: "00:30:00"
    conditions: []
    actions:
      - action: notify.mobile_app_smartphone_greg
        data:
          title: "Chaudière : passerelle injoignable"
          message: >-
            Les capteurs EMS-ESP ne répondent plus depuis 30 minutes.
            Vérifie la passerelle BBQKees (192.168.0.10) et le broker MQTT.
          data:
            tag: chaudiere_passerelle
    mode: single
