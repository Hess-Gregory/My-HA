# 🎚️ Console DMX : chaque projecteur garde SON programme (couleur, intensité, flash, effet).
# On sélectionne des projecteurs, on règle, puis ALLUMÉ / BLACKOUT : seuls les projecteurs sélectionnés reçoivent le réglage.
# Ex. : Lustre 1 + 3 en bleu fixe, puis Lustre 2 seul en strobe blanc -> les deux tournent en même temps.
# LIBÉRER rend les projecteurs sélectionnés (ou tous si aucun) au set musical.
input_boolean:
  strobe_actif: {name: Console DMX active, icon: 'mdi:play-circle'}
  sono_micro: {name: Tempo par le micro de la tablette, icon: 'mdi:microphone'}
  dmx_lc: {name: Lustre SAM 1, icon: 'mdi:lightbulb'}
  dmx_ld: {name: Lustre SAM 2, icon: 'mdi:lightbulb'}
  dmx_lg: {name: Lustre SAM 3, icon: 'mdi:lightbulb'}
  dmx_vit_g: {name: Vitrine gauche, icon: 'mdi:wall-sconce-flat'}
  dmx_vit_d: {name: Vitrine droite, icon: 'mdi:wall-sconce-flat'}
  dmx_panneau: {name: Panneau mural, icon: 'mdi:led-strip-variant'}
  dmx_ambilight: {name: Ambilight, icon: 'mdi:television-ambient-light'}
  dmx_dj_g: {name: Spot DJ gauche, icon: 'mdi:spotlight-beam'}
  dmx_dj_d: {name: Spot DJ droite, icon: 'mdi:spotlight-beam'}
input_number:
  strobe_intensite: {name: Intensité console, icon: 'mdi:brightness-7', min: 5, max: 100, step: 5, initial: 60, mode: slider, unit_of_measurement: '%'}
  dmx_flash: {name: 'Flash (0 = fixe, 100 = très rapide)', icon: 'mdi:flash', min: 0, max: 100, step: 5, initial: 0, mode: slider, unit_of_measurement: '%'}
  dmx_duree: {name: 'Strobe : durée du flash', icon: 'mdi:timer-outline', min: 0, max: 100, step: 5, initial: 20, mode: slider, unit_of_measurement: '%'}
  dmx_splash: {name: 'Strobe : splash (extinction en fondu)', icon: 'mdi:water-outline', min: 0, max: 100, step: 5, initial: 0, mode: slider, unit_of_measurement: '%'}
  dmx_aura: {name: 'Strobe : aura (fond entre les flashs)', icon: 'mdi:blur', min: 0, max: 100, step: 5, initial: 0, mode: slider, unit_of_measurement: '%'}
  dmx_rouge: {name: Rouge, icon: 'mdi:alpha-r-circle', min: 0, max: 100, step: 5, mode: slider, unit_of_measurement: '%'}
  dmx_jaune: {name: Jaune, icon: 'mdi:alpha-j-circle', min: 0, max: 100, step: 5, mode: slider, unit_of_measurement: '%'}
  dmx_bleu: {name: Bleu, icon: 'mdi:alpha-b-circle', min: 0, max: 100, step: 5, mode: slider, unit_of_measurement: '%'}
input_select:
  strobe_mode:
    name: Effet spécial console
    icon: mdi:auto-fix
    options: [Aucun (couleur + flash), 🫁 Pulse (respiration), 🏃 Chase (de projecteur en projecteur), 🌈 Arc-en-ciel, 💥 Rafales, 🌩️ Éclairs, 🥁 Strobe sync tempo, 📈 Ramp up (accélère), 📉 Ramp down (ralentit)]
template:
- sensor:
  - name: Console DMX couleur
    unique_id: console_dmx_couleur
    icon: mdi:palette
    state: '{% set r = states(''input_number.dmx_rouge'') | float(0) / 100 %}{% set y = states(''input_number.dmx_jaune'') | float(0) / 100 %}{% set b = states(''input_number.dmx_bleu'') | float(0) / 100 %}{% set C = [[1,1,1],[1,0,0],[1,1,0],[0,0.15,1],[1,0.5,0],[0.5,0,0.5],[0,0.8,0.15],[0.2,0.094,0]]
      %}{% set w = [(1-r)*(1-y)*(1-b), r*(1-y)*(1-b), (1-r)*y*(1-b), (1-r)*(1-y)*b, r*y*(1-b), r*(1-y)*b, (1-r)*y*b, r*y*b] %}{% set ns = namespace(o=[]) %}{% for ch in range(3) %}{% set t = namespace(v=0) %}{% for i in range(8) %}{% set t.v = t.v + w[i] * C[i][ch] %}{% endfor %}{% set ns.o = ns.o + [t.v]
      %}{% endfor %}{% set mx = [ns.o | max, 0.01] | max %}{{ ns.o | map(''multiply'', 255 / mx) | map(''round'', 0) | map(''int'') | list | join('','') }}'
    attributes: {hex: '{% set c = (this.state | default(''255,255,255'')).split('','') %}#{% for v in c %}{{ ''%02x'' % (v | int(255)) }}{% endfor %}'}
script:
  dmx_moteur:
    alias: '🎚️ Console DMX : moteur d''un projecteur'
    mode: parallel
    max: 20
    fields:
      k: {}
      ent: {}
    sequence:
    - variables: {snap: '{{ ''S'' ~ states(''input_text.'' ~ k) }}'}
    - {condition: template, value_template: '{{ snap not in [''S'', ''Sunknown'', ''Sunavailable''] }}'}
    - variables: {p: '{{ snap[1:] | from_json }}'}
    - choose:
      - conditions: '{{ p.m == ''off'' }}'
        sequence:
        - action: light.turn_off
          continue_on_error: true
          target: {entity_id: '{{ ent }}'}
          data: {transition: 0}
      - conditions: '{{ p.e == ''fixe'' and p.f == 0 }}'
        sequence:
        - action: light.turn_on
          continue_on_error: true
          target: {entity_id: '{{ ent }}'}
          data: {rgb_color: '{{ p.c }}', brightness: '{{ p.b }}', transition: 0.2}
      - conditions: '{{ p.e == ''pulse'' }}'
        sequence:
        - repeat:
            while: &id001
            - &id002 {condition: template, value_template: '{{ (''S'' ~ states(''input_text.'' ~ k)) == snap }}'}
            sequence:
            - action: light.turn_on
              continue_on_error: true
              target: {entity_id: '{{ ent }}'}
              data: {rgb_color: '{{ p.c }}', brightness: '{{ p.b }}', transition: '{{ (p.per / 2) | round(2) }}'}
            - delay: {seconds: '{{ (p.per / 2) | round(2) }}'}
            - action: light.turn_on
              continue_on_error: true
              target: {entity_id: '{{ ent }}'}
              data: {rgb_color: '{{ p.c }}', brightness: '{{ [ (p.b * 0.08) | int, 1 ] | max }}', transition: '{{ (p.per / 2) | round(2) }}'}
            - delay: {seconds: '{{ (p.per / 2) | round(2) }}'}
      - conditions: '{{ p.e == ''chase'' }}'
        sequence:
        - repeat:
            while: *id001
            sequence:
            - variables: {slot: '{{ ((as_timestamp(now()) / p.per) | int) % p.n }}'}
            - action: light.turn_on
              continue_on_error: true
              target: {entity_id: '{{ ent }}'}
              data: {rgb_color: '{{ p.c }}', brightness: '{{ p.b if slot == p.i else 1 }}', transition: 0}
            - delay: {seconds: '{{ [ p.per - (as_timestamp(now()) % p.per), 0.05 ] | max | round(2) }}'}
      - conditions: '{{ p.e == ''rainbow'' }}'
        sequence:
        - repeat:
            while: *id001
            sequence:
            - action: light.turn_on
              continue_on_error: true
              target: {entity_id: '{{ ent }}'}
              data: {hs_color: '{{ [ ((as_timestamp(now()) * 40 + p.i * 360 / p.n) % 360) | round(0), 100 ] }}', brightness: '{{ p.b }}', transition: '{{ [p.per, 0.3] | max | round(2) }}'}
            - delay: {seconds: '{{ [p.per, 0.3] | max | round(2) }}'}
      default:
      - repeat:
          while:
          - *id002
          - {condition: template, value_template: '{{ repeat.index < 100000 }}'}
          sequence:
          - variables: {q: '{% if p.e == ''rafales'' %}{{ 0.15 if repeat.index % 6 else 1.2 }}{% elif p.e == ''eclairs'' %}{{ (range(3, 26) | random) / 10 }}{% elif p.e == ''sync'' %}{{ 60 / ([states(''input_number.sono_tempo'') | float(128), 40] | max) }}{% elif p.e == ''rampup'' %}{{ p.per * (2.5 - 2 * (repeat.index % 8) / 7) }}{% elif p.e == ''rampdown'' %}{{ p.per * (0.5 + 2 * (repeat.index % 8) / 7) }}{% else %}{{ p.per }}{% endif %}'}
          - variables: {on: '{{ [ q * (0.1 + 0.8 * (p.d | default(20)) / 100), 0.05 ] | max | round(2) }}'}
          - variables: {off: '{{ [ q - on, 0.05 ] | max | round(2) }}'}
          - action: light.turn_on
            continue_on_error: true
            target: {entity_id: '{{ ent }}'}
            data: {rgb_color: '{{ p.c }}', brightness: '{{ p.b }}', transition: 0}
          - delay: {seconds: '{{ on }}'}
          - action: light.turn_on
            continue_on_error: true
            target: {entity_id: '{{ ent }}'}
            data: {brightness: '{{ [ (p.b * (p.a | default(0)) / 100) | int, 1 ] | max }}', transition: '{{ (off * (p.s | default(0)) / 100) | round(2) }}'}
          - delay: {seconds: '{{ off }}'}
  dmx_couleur:
    alias: '🎨 Console DMX : couleur prédéfinie'
    mode: restart
    fields:
      nom: {}
    sequence:
    - variables:
        pre:
          Blanc: [0, 0, 0]
          Rouge: [100, 0, 0]
          Orange: [100, 100, 0]
          Ambre: [100, 70, 0]
          Jaune: [0, 100, 0]
          Vert: [0, 100, 100]
          Turquoise: [0, 45, 100]
          Bleu: [0, 0, 100]
          Violet: [100, 0, 100]
          UV: [45, 0, 100]
          Magenta: [100, 0, 55]
          Rose: [45, 0, 0]
    - action: input_number.set_value
      target: {entity_id: input_number.dmx_rouge}
      data: {value: '{{ pre[nom][0] }}'}
    - action: input_number.set_value
      target: {entity_id: input_number.dmx_jaune}
      data: {value: '{{ pre[nom][1] }}'}
    - action: input_number.set_value
      target: {entity_id: input_number.dmx_bleu}
      data: {value: '{{ pre[nom][2] }}'}
  dmx_mode:
    alias: '🎚️ Console DMX : ALLUMÉ / BLACKOUT / LIBÉRER (projecteurs sélectionnés)'
    mode: queued
    fields:
      mode: {}
    sequence:
    - choose:
      - conditions: '{{ mode in [''allume'',''blackout''] }}'
        sequence:
        - variables:
            mp: {dmx_lc: light.salle_a_manger_lc, dmx_ld: light.salle_a_manger_ld, dmx_lg: light.salle_a_manger_lg, dmx_vit_g: light.salle_a_manger_vit_g, dmx_vit_d: light.salle_a_manger_vit_d, dmx_panneau: light.salon_panneau_mural, dmx_ambilight: light.salon_ambilight_tv, dmx_dj_g: light.coin_dj_sono_gauche,
              dmx_dj_d: light.coin_dj_sono_droite}
            sel: '{% set ns = namespace(l=[]) %}{% for k in [''dmx_lc'', ''dmx_ld'', ''dmx_lg'', ''dmx_vit_g'', ''dmx_vit_d'', ''dmx_panneau'', ''dmx_ambilight'', ''dmx_dj_g'', ''dmx_dj_d''] %}{% if is_state(''input_boolean.'' ~ k, ''on'') %}{% set ns.l = ns.l + [k] %}{% endif %}{% endfor %}{{ ns.l }}'
            em: {Aucun (couleur + flash): fixe, 🫁 Pulse (respiration): pulse, 🏃 Chase (de projecteur en projecteur): chase, 🌈 Arc-en-ciel: rainbow, 💥 Rafales: rafales, 🌩️ Éclairs: eclairs, 🥁 Strobe sync tempo: sync, 📈 Ramp up (accélère): rampup, 📉 Ramp down (ralentit): rampdown}
            col: '{% set r = states(''input_number.dmx_rouge'') | float(0) / 100 %}{% set y = states(''input_number.dmx_jaune'') | float(0) / 100 %}{% set b = states(''input_number.dmx_bleu'') | float(0) / 100 %}{% set C = [[1,1,1],[1,0,0],[1,1,0],[0,0.15,1],[1,0.5,0],[0.5,0,0.5],[0,0.8,0.15],[0.2,0.094,0]]
              %}{% set w = [(1-r)*(1-y)*(1-b), r*(1-y)*(1-b), (1-r)*y*(1-b), (1-r)*(1-y)*b, r*y*(1-b), r*(1-y)*b, (1-r)*y*b, r*y*b] %}{% set ns = namespace(o=[]) %}{% for ch in range(3) %}{% set t = namespace(v=0) %}{% for i in range(8) %}{% set t.v = t.v + w[i] * C[i][ch] %}{% endfor %}{% set ns.o =
              ns.o + [t.v] %}{% endfor %}{% set mx = [ns.o | max, 0.01] | max %}{{ ns.o | map(''multiply'', 255 / mx) | map(''round'', 0) | map(''int'') | list }}'
            bri: '{{ [ (255 * (states(''input_number.strobe_intensite'') | float(60)) / 100) | int, 1 ] | max }}'
            fl: '{{ states(''input_number.dmx_flash'') | float(0) }}'
            sd: '{{ states(''input_number.dmx_duree'') | int(20) }}'
            ss: '{{ states(''input_number.dmx_splash'') | int(0) }}'
            sa: '{{ states(''input_number.dmx_aura'') | int(0) }}'
            eff: '{{ em.get(states(''input_select.strobe_mode''), ''fixe'') }}'
            per: '{% set f = states(''input_number.dmx_flash'') | float(0) %}{{ ((1 / (0.5 + f / 100 * 4.5)) if f > 0 else 1) | round(3) }}'
            ts: '{{ now().timestamp() | round(3) }}'
        - {condition: template, value_template: '{{ sel | length > 0 }}'}
        - repeat:
            for_each: '{{ sel }}'
            sequence:
            - variables: {i: '{% set ns = namespace(i=0) %}{% for x in sel %}{% if x == repeat.item %}{% set ns.i = loop.index0 %}{% endif %}{% endfor %}{{ ns.i }}'}
            - action: input_text.set_value
              target: {entity_id: 'input_text.{{ repeat.item }}'}
              data: {value: '{% if mode == ''blackout'' %}{{ {''m'':''off'',''t'':ts} | to_json }}{% else %}{{ {''m'':''on'',''c'':col,''b'':bri,''f'':fl,''d'':sd,''s'':ss,''a'':sa,''e'':eff,''per'':per,''i'':i,''n'':sel|length,''t'':ts} | to_json }}{% endif %}'}
            - action: script.turn_on
              target: {entity_id: script.dmx_moteur}
              data:
                variables: {k: '{{ repeat.item }}', ent: '{{ mp[repeat.item] }}'}
        - action: input_boolean.turn_on
          target: {entity_id: input_boolean.strobe_actif}
      default:
      - variables:
          sel: '{% set ns = namespace(l=[]) %}{% for k in [''dmx_lc'', ''dmx_ld'', ''dmx_lg'', ''dmx_vit_g'', ''dmx_vit_d'', ''dmx_panneau'', ''dmx_ambilight'', ''dmx_dj_g'', ''dmx_dj_d''] %}{% if is_state(''input_boolean.'' ~ k, ''on'') %}{% set ns.l = ns.l + [k] %}{% endif %}{% endfor %}{{ ns.l }}'
          ks: [dmx_lc, dmx_ld, dmx_lg, dmx_vit_g, dmx_vit_d, dmx_panneau, dmx_ambilight, dmx_dj_g, dmx_dj_d]
      - variables: {cible: '{{ sel if sel | length > 0 else ks }}'}
      - repeat:
          for_each: '{{ cible }}'
          sequence:
          - action: input_text.set_value
            target: {entity_id: 'input_text.{{ repeat.item }}'}
            data: {value: ''}
      - if:
        - {condition: template, value_template: '{{ not states(''input_select.sono_lumieres'').startswith(''—'') }}'}
        then:
        - action: script.turn_on
          target: {entity_id: script.sono_lumieres}
input_text:
  dmx_lc: {name: Programme console · Lustre SAM 1, max: 255, initial: ''}
  dmx_ld: {name: Programme console · Lustre SAM 2, max: 255, initial: ''}
  dmx_lg: {name: Programme console · Lustre SAM 3, max: 255, initial: ''}
  dmx_vit_g: {name: Programme console · Vitrine gauche, max: 255, initial: ''}
  dmx_vit_d: {name: Programme console · Vitrine droite, max: 255, initial: ''}
  dmx_panneau: {name: Programme console · Panneau mural, max: 255, initial: ''}
  dmx_ambilight: {name: Programme console · Ambilight, max: 255, initial: ''}
  dmx_dj_g: {name: Programme console · Spot DJ gauche, max: 255, initial: ''}
  dmx_dj_d: {name: Programme console · Spot DJ droite, max: 255, initial: ''}
