# [AUTO-VERSION] v0.3.1 | 08/10/2026 23:35 | console DMX, la selection ne touche plus les lampes, envoi seulement sur ALLUME/BLACKOUT
# 🎚️ Console DMX : sélection lampe par lampe, couleur (palette + mélange rouge / jaune / bleu),
# intensité, flash de 0 (fixe) à 100 (très rapide), effets spéciaux.
# Les réglages ne partent vers les lampes qu'au clic sur ALLUMÉ ou BLACKOUT (comme un GO de console).
input_boolean:
  strobe_actif: {name: Console DMX active, icon: 'mdi:play-circle'}
  dmx_blackout: {name: Console DMX · blackout, icon: 'mdi:checkbox-blank'}
  dmx_lc: {name: Lustre SAM 1, icon: 'mdi:lightbulb'}
  dmx_ld: {name: Lustre SAM 2, icon: 'mdi:lightbulb'}
  dmx_lg: {name: Lustre SAM 3, icon: 'mdi:lightbulb'}
  dmx_vit_g: {name: Vitrine gauche, icon: 'mdi:wall-sconce-flat'}
  dmx_vit_d: {name: Vitrine droite, icon: 'mdi:wall-sconce-flat'}
  dmx_panneau: {name: Panneau mural, icon: 'mdi:led-strip-variant'}
  dmx_ambilight: {name: Ambilight, icon: 'mdi:television-ambient-light'}
  dmx_dj_g: {name: Spot DJ gauche, icon: 'mdi:spotlight-beam'}
  dmx_dj_d: {name: Spot DJ droite, icon: 'mdi:spotlight-beam'}
input_number:
  strobe_intensite: {name: Intensité console, icon: 'mdi:brightness-7', min: 5, max: 100, step: 5, initial: 60, mode: slider, unit_of_measurement: '%'}
  dmx_flash: {name: 'Flash (0 = fixe, 100 = très rapide)', icon: 'mdi:flash', min: 0, max: 100, step: 5, initial: 0, mode: slider, unit_of_measurement: '%'}
  dmx_rouge: {name: Rouge, icon: 'mdi:alpha-r-circle', min: 0, max: 100, step: 5, mode: slider, unit_of_measurement: '%'}
  dmx_jaune: {name: Jaune, icon: 'mdi:alpha-j-circle', min: 0, max: 100, step: 5, mode: slider, unit_of_measurement: '%'}
  dmx_bleu: {name: Bleu, icon: 'mdi:alpha-b-circle', min: 0, max: 100, step: 5, mode: slider, unit_of_measurement: '%'}
input_select:
  strobe_mode:
    name: Effet spécial console
    icon: mdi:auto-fix
    options: [Aucun (couleur + flash), 🫁 Pulse (respiration), 🏃 Chase (de projecteur en projecteur), 🌈 Arc-en-ciel, 💥 Rafales, 🌩️ Éclairs, 🥁 Strobe sync tempo]
template:
- sensor:
  - name: Console DMX couleur
    unique_id: console_dmx_couleur
    icon: mdi:palette
    state: '{% set r = states(''input_number.dmx_rouge'') | float(0) / 100 %}{% set y = states(''input_number.dmx_jaune'') | float(0) / 100 %}{% set b = states(''input_number.dmx_bleu'') | float(0) / 100 %}{% set C = [[1,1,1],[1,0,0],[1,1,0],[0,0.15,1],[1,0.5,0],[0.5,0,0.5],[0,0.8,0.15],[0.2,0.094,0]]
      %}{% set w = [(1-r)*(1-y)*(1-b), r*(1-y)*(1-b), (1-r)*y*(1-b), (1-r)*(1-y)*b, r*y*(1-b), r*(1-y)*b, (1-r)*y*b, r*y*b] %}{% set ns = namespace(o=[]) %}{% for ch in range(3) %}{% set t = namespace(v=0) %}{% for i in range(8) %}{% set t.v = t.v + w[i] * C[i][ch] %}{% endfor %}{% set ns.o = ns.o + [t.v]
      %}{% endfor %}{% set mx = [ns.o | max, 0.01] | max %}{{ ns.o | map(''multiply'', 255 / mx) | map(''round'', 0) | map(''int'') | list | join('','') }}'
    attributes: {hex: '{% set c = (this.state | default(''255,255,255'')).split('','') %}#{% for v in c %}{{ ''%02x'' % (v | int(255)) }}{% endfor %}'}
script:
  strobe_lumieres:
    alias: 🎚️ Console DMX (projecteurs sélectionnés)
    icon: mdi:tune-vertical
    mode: restart
    sequence:
    - variables: {ents: '{% set m = {''input_boolean.dmx_lc'':''light.salle_a_manger_lc'',''input_boolean.dmx_ld'':''light.salle_a_manger_ld'',''input_boolean.dmx_lg'':''light.salle_a_manger_lg'',''input_boolean.dmx_vit_g'':''light.salle_a_manger_vit_g'',''input_boolean.dmx_vit_d'':''light.salle_a_manger_vit_d'',''input_boolean.dmx_panneau'':''light.salon_panneau_mural'',''input_boolean.dmx_ambilight'':''light.salon_ambilight_tv'',''input_boolean.dmx_dj_g'':''light.coin_dj_sono_gauche'',''input_boolean.dmx_dj_d'':''light.coin_dj_sono_droite''}
          %}{% set ns = namespace(l=[]) %}{% if true %}{% for b in m %}{% if is_state(b,''on'') %}{% set ns.l = ns.l + [m[b]] %}{% endif %}{% endfor %}{% endif %}{{ ns.l }}', eff: '{{ states(''input_select.strobe_mode'') }}', rgb: '{% set r = states(''input_number.dmx_rouge'') | float(0) / 100 %}{% set
          y = states(''input_number.dmx_jaune'') | float(0) / 100 %}{% set b = states(''input_number.dmx_bleu'') | float(0) / 100 %}{% set C = [[1,1,1],[1,0,0],[1,1,0],[0,0.15,1],[1,0.5,0],[0.5,0,0.5],[0,0.8,0.15],[0.2,0.094,0]] %}{% set w = [(1-r)*(1-y)*(1-b), r*(1-y)*(1-b), (1-r)*y*(1-b), (1-r)*(1-y)*b,
          r*y*(1-b), r*(1-y)*b, (1-r)*y*b, r*y*b] %}{% set ns = namespace(o=[]) %}{% for ch in range(3) %}{% set t = namespace(v=0) %}{% for i in range(8) %}{% set t.v = t.v + w[i] * C[i][ch] %}{% endfor %}{% set ns.o = ns.o + [t.v] %}{% endfor %}{% set mx = [ns.o | max, 0.01] | max %}{{ ns.o | map(''multiply'',
          255 / mx) | map(''round'', 0) | map(''int'') | list }}', bri: '{{ [ (255 * (states(''input_number.strobe_intensite'') | float(60)) / 100) | int, 1 ] | max }}', flash: '{{ states(''input_number.dmx_flash'') | float(0) }}', period: '{% if ''sync'' in states(''input_select.strobe_mode'') %}{{ 60
          / ([states(''input_number.sono_tempo'') | float(128), 40] | max) }}{% else %}{% set f = states(''input_number.dmx_flash'') | float(0) %}{{ (1 / (0.5 + f / 100 * 4.5)) if f > 0 else 1 }}{% endif %}'}
    - {condition: template, value_template: '{{ ents | length > 0 }}'}
    - choose:
      - conditions:
        - {condition: state, entity_id: input_boolean.dmx_blackout, state: 'on'}
        sequence:
        - action: light.turn_off
          continue_on_error: true
          target: {entity_id: '{{ ents }}'}
          data: {transition: 0}
      - conditions:
        - {condition: template, value_template: '{{ eff.startswith(''Aucun'') and flash == 0 }}'}
        sequence:
        - action: light.turn_on
          continue_on_error: true
          target: {entity_id: '{{ ents }}'}
          data: {rgb_color: '{{ rgb }}', brightness: '{{ bri }}', transition: 0.2}
      - conditions:
        - {condition: template, value_template: '{{ ''Pulse'' in eff }}'}
        sequence:
        - repeat:
            while: &id001
            - &id002 {condition: template, value_template: '{{ is_state(''input_boolean.strobe_actif'',''on'') and is_state(''input_boolean.dmx_blackout'',''off'') }}'}
            sequence:
            - action: light.turn_on
              continue_on_error: true
              target: {entity_id: '{{ ents }}'}
              data: {rgb_color: '{{ rgb }}', brightness: '{{ bri }}', transition: '{{ (period / 2) | round(2) }}'}
            - delay: {seconds: '{{ (period / 2) | round(2) }}'}
            - action: light.turn_on
              continue_on_error: true
              target: {entity_id: '{{ ents }}'}
              data: {rgb_color: '{{ rgb }}', brightness: '{{ [ (bri * 0.08) | int, 1 ] | max }}', transition: '{{ (period / 2) | round(2) }}'}
            - delay: {seconds: '{{ (period / 2) | round(2) }}'}
      - conditions:
        - {condition: template, value_template: '{{ ''Chase'' in eff }}'}
        sequence:
        - action: light.turn_on
          continue_on_error: true
          target: {entity_id: '{{ ents }}'}
          data: {rgb_color: '{{ rgb }}', brightness: 1, transition: 0}
        - repeat:
            while: *id001
            sequence:
            - variables: {cur: '{{ ents[(repeat.index - 1) % (ents | length)] }}', prev: '{{ ents[(repeat.index - 2) % (ents | length)] }}'}
            - action: light.turn_on
              continue_on_error: true
              target: {entity_id: '{{ cur }}'}
              data: {rgb_color: '{{ rgb }}', brightness: '{{ bri }}', transition: 0}
            - if:
              - {condition: template, value_template: '{{ ents | length > 1 }}'}
              then:
              - action: light.turn_on
                continue_on_error: true
                target: {entity_id: '{{ prev }}'}
                data: {brightness: 1, transition: 0}
            - delay: {seconds: '{{ [period, 0.15] | max | round(2) }}'}
      - conditions:
        - {condition: template, value_template: '{{ ''Arc-en-ciel'' in eff }}'}
        sequence:
        - repeat:
            while: *id001
            sequence:
            - repeat:
                for_each: '{{ range(ents | length) | list }}'
                sequence:
                - action: light.turn_on
                  continue_on_error: true
                  target: {entity_id: '{{ ents[repeat.item] }}'}
                  data: {hs_color: '{{ [ ((as_timestamp(now()) * 40 + repeat.item * 360 / (ents | length)) % 360) | round(0), 100 ] }}', brightness: '{{ bri }}', transition: '{{ [period, 0.3] | max | round(2) }}'}
            - delay: {seconds: '{{ [period, 0.3] | max | round(2) }}'}
      default:
      - repeat:
          while:
          - *id002
          - {condition: template, value_template: '{{ repeat.index < 100000 }}'}
          sequence:
          - variables: {p: '{% if ''Rafales'' in eff %}{{ 0.15 if repeat.index % 6 else 1.2 }}{% elif ''Éclairs'' in eff %}{{ (range(3, 26) | random) / 10 }}{% else %}{{ period }}{% endif %}'}
          - action: light.turn_on
            continue_on_error: true
            target: {entity_id: '{{ ents }}'}
            data: {rgb_color: '{{ rgb }}', brightness: '{{ bri }}', transition: 0}
          - delay: {seconds: '{{ [ [p / 2, 0.12] | min, 0.05 ] | max | round(2) }}'}
          - action: light.turn_on
            continue_on_error: true
            target: {entity_id: '{{ ents }}'}
            data: {brightness: 1, transition: 0}
          - if:
            - {condition: template, value_template: '{{ ''Éclairs'' in eff and (range(0,3) | random) == 0 }}'}
            then:
            - delay: {seconds: 0.08}
            - action: light.turn_on
              continue_on_error: true
              target: {entity_id: '{{ ents }}'}
              data: {rgb_color: '{{ rgb }}', brightness: '{{ bri }}', transition: 0}
            - delay: {seconds: 0.08}
            - action: light.turn_on
              continue_on_error: true
              target: {entity_id: '{{ ents }}'}
              data: {brightness: 1, transition: 0}
          - delay: {seconds: '{{ [ p - [p / 2, 0.12] | min, 0.05 ] | max | round(2) }}'}
  dmx_couleur:
    alias: '🎨 Console DMX : couleur prédéfinie'
    mode: restart
    fields:
      nom: {}
    sequence:
    - variables:
        pre:
          Blanc: [0, 0, 0]
          Rouge: [100, 0, 0]
          Orange: [100, 100, 0]
          Ambre: [100, 70, 0]
          Jaune: [0, 100, 0]
          Vert: [0, 100, 100]
          Turquoise: [0, 45, 100]
          Bleu: [0, 0, 100]
          Violet: [100, 0, 100]
          UV: [45, 0, 100]
          Magenta: [100, 0, 55]
          Rose: [45, 0, 0]
    - action: input_number.set_value
      target: {entity_id: input_number.dmx_rouge}
      data: {value: '{{ pre[nom][0] }}'}
    - action: input_number.set_value
      target: {entity_id: input_number.dmx_jaune}
      data: {value: '{{ pre[nom][1] }}'}
    - action: input_number.set_value
      target: {entity_id: input_number.dmx_bleu}
      data: {value: '{{ pre[nom][2] }}'}
  dmx_mode:
    alias: '🎚️ Console DMX : allumé / blackout / libérer'
    mode: restart
    fields:
      mode: {}
    sequence:
    - choose:
      - conditions: '{{ mode == ''allume'' }}'
        sequence:
        - action: input_boolean.turn_off
          target: {entity_id: input_boolean.dmx_blackout}
        - action: input_boolean.turn_on
          target: {entity_id: input_boolean.strobe_actif}
        - action: script.turn_on
          target: {entity_id: script.strobe_lumieres}
      - conditions: '{{ mode == ''blackout'' }}'
        sequence:
        - action: input_boolean.turn_on
          target:
            entity_id: [input_boolean.dmx_blackout, input_boolean.strobe_actif]
        - action: script.turn_on
          target: {entity_id: script.strobe_lumieres}
      default:
      - action: input_boolean.turn_off
        target:
          entity_id: [input_boolean.strobe_actif, input_boolean.dmx_blackout]
automation:
- id: strobe_marche_arret
  alias: '🎚️ Console DMX : libérer les projecteurs'
  mode: restart
  triggers:
  - {trigger: state, entity_id: input_boolean.strobe_actif, to: 'off'}
  actions:
  - action: script.turn_off
    target: {entity_id: script.strobe_lumieres}
  - if:
    - {condition: template, value_template: '{{ not states(''input_select.sono_lumieres'').startswith(''—'') }}'}
    then:
    - action: script.turn_on
      target: {entity_id: script.sono_lumieres}
