# ⚡ Strobe façon console light jockey : choix des projecteurs, couleur, intensité, vitesse et modes prédéfinis
# Pendant le strobe, la boucle « Lumières sono » laisse les projecteurs choisis au strobe.
input_boolean:
  strobe_actif: {name: Strobe actif, icon: 'mdi:flash'}
  strobe_lustre: {name: Strobe · Lustre SAM, icon: 'mdi:ceiling-light-multiple'}
  strobe_vitrines: {name: Strobe · Vitrines, icon: 'mdi:wall-sconce-flat'}
  strobe_panneau: {name: Strobe · Panneau mural, icon: 'mdi:led-strip-variant'}
  strobe_ambilight: {name: Strobe · Ambilight, icon: 'mdi:television-ambient-light'}
  strobe_dj: {name: Strobe · Spots DJ, icon: 'mdi:spotlight-beam'}
input_number:
  strobe_intensite: {name: Intensité strobe, icon: 'mdi:brightness-7', min: 10, max: 100, step: 5, initial: 60, mode: slider, unit_of_measurement: '%'}
  strobe_vitesse: {name: Vitesse strobe, icon: 'mdi:speedometer', min: 0.5, max: 5, step: 0.5, initial: 2, mode: slider, unit_of_measurement: flash/s}
input_select:
  strobe_mode:
    name: Mode strobe
    icon: mdi:flash-auto
    options: [🎚️ Manuel (curseur vitesse), 🥁 Sync tempo (1 flash par temps), 🐢 Lent, ⚡ Rapide, 💥 Rafales, 🌩️ Éclairs (aléatoire)]
  strobe_couleur:
    name: Couleur strobe
    icon: mdi:palette
    options: [Blanc, Blanc chaud, Rouge, Bleu, UV, Vert, Magenta]
script:
  strobe_lumieres:
    alias: ⚡ Strobe (boucle)
    icon: mdi:flash
    mode: restart
    sequence:
    - variables:
        cols:
          Blanc: [255, 255, 255]
          Blanc chaud: [255, 190, 110]
          Rouge: [255, 0, 0]
          Bleu: [0, 40, 255]
          UV: [70, 0, 255]
          Vert: [40, 255, 0]
          Magenta: [255, 0, 170]
    - repeat:
        while:
        - {condition: state, entity_id: input_boolean.strobe_actif, state: 'on'}
        - {condition: template, value_template: '{{ repeat.index < 100000 }}'}
        sequence:
        - variables: {ents: '{% set m = {''input_boolean.strobe_lustre'':[''light.salle_a_manger_lc'',''light.salle_a_manger_ld'',''light.salle_a_manger_lg''],''input_boolean.strobe_vitrines'':[''light.salle_a_manger_vit_g'',''light.salle_a_manger_vit_d''],''input_boolean.strobe_panneau'':[''light.salon_panneau_mural''],''input_boolean.strobe_ambilight'':[''light.salon_ambilight_tv''],''input_boolean.strobe_dj'':[''light.coin_dj_sono_gauche'',''light.coin_dj_sono_droite'']}
              %}{% set ns = namespace(l=[]) %}{% if true %}{% for b in m %}{% if is_state(b,''on'') %}{% set ns.l = ns.l + m[b] %}{% endif %}{% endfor %}{% endif %}{{ ns.l }}', mode: '{{ states(''input_select.strobe_mode'') }}', rgb: '{{ cols.get(states(''input_select.strobe_couleur''),
              [255,255,255]) }}', bri: '{{ [ (255 * (states(''input_number.strobe_intensite'') | float(60)) / 100) | int, 1 ] | max }}', period: '{% set m = states(''input_select.strobe_mode'') %}{% if ''Sync'' in m %}{{ 60 / ([states(''input_number.sono_tempo'')
              | float(128), 40] | max) }}{% elif ''Lent'' in m %}1.0{% elif ''Rapide'' in m %}0.25{% elif ''Rafales'' in m %}{{ 0.15 if repeat.index % 6 else 1.2 }}{% elif ''Éclairs'' in m %}{{ (range(3, 26) | random) / 10 }}{% else %}{{ 1 / ([states(''input_number.strobe_vitesse'')
              | float(2), 0.5] | max) }}{% endif %}'}
        - {condition: template, value_template: '{{ ents | length > 0 }}'}
        - action: light.turn_on
          continue_on_error: true
          target: {entity_id: '{{ ents }}'}
          data: {rgb_color: '{{ rgb }}', brightness: '{{ bri }}', transition: 0}
        - delay: {seconds: '{{ [ [period / 2, 0.12] | min, 0.05 ] | max | round(2) }}'}
        - action: light.turn_on
          continue_on_error: true
          target: {entity_id: '{{ ents }}'}
          data: {brightness: 1, transition: 0}
        - if:
          - {condition: template, value_template: '{{ ''Éclairs'' in mode and (range(0,3) | random) == 0 }}'}
          then:
          - delay: {seconds: 0.08}
          - action: light.turn_on
            continue_on_error: true
            target: {entity_id: '{{ ents }}'}
            data: {rgb_color: '{{ rgb }}', brightness: '{{ bri }}', transition: 0}
          - delay: {seconds: 0.08}
          - action: light.turn_on
            continue_on_error: true
            target: {entity_id: '{{ ents }}'}
            data: {brightness: 1, transition: 0}
        - delay: {seconds: '{{ [ period - [period / 2, 0.12] | min, 0.05 ] | max | round(2) }}'}
automation:
- id: strobe_marche_arret
  alias: '⚡ Strobe : marche / arrêt instantané'
  mode: restart
  triggers:
  - {trigger: state, entity_id: input_boolean.strobe_actif}
  actions:
  - choose:
    - conditions:
      - {condition: state, entity_id: input_boolean.strobe_actif, state: 'on'}
      sequence:
      - action: script.turn_on
        target: {entity_id: script.strobe_lumieres}
    default:
    - action: script.turn_off
      target: {entity_id: script.strobe_lumieres}
    - if:
      - {condition: template, value_template: '{{ not states(''input_select.sono_lumieres'').startswith(''—'') }}'}
      then:
      - action: script.turn_on
        target: {entity_id: script.sono_lumieres}
      else:
      - action: light.turn_on
        continue_on_error: true
        target: {entity_id: '{% set m = {''input_boolean.strobe_lustre'':[''light.salle_a_manger_lc'',''light.salle_a_manger_ld'',''light.salle_a_manger_lg''],''input_boolean.strobe_vitrines'':[''light.salle_a_manger_vit_g'',''light.salle_a_manger_vit_d''],''input_boolean.strobe_panneau'':[''light.salon_panneau_mural''],''input_boolean.strobe_ambilight'':[''light.salon_ambilight_tv''],''input_boolean.strobe_dj'':[''light.coin_dj_sono_gauche'',''light.coin_dj_sono_droite'']}
            %}{% set ns = namespace(l=[]) %}{% if true %}{% for b in m %}{% if is_state(b,''on'') %}{% set ns.l = ns.l + m[b] %}{% endif %}{% endfor %}{% endif %}{{ ns.l }}'}
        data: {brightness: 1}
- id: strobe_reglage_instantane
  alias: '⚡ Strobe : appliquer un réglage tout de suite'
  mode: restart
  triggers:
  - trigger: state
    entity_id: [input_select.strobe_mode, input_select.strobe_couleur, input_boolean.strobe_lustre, input_boolean.strobe_vitrines, input_boolean.strobe_panneau, input_boolean.strobe_ambilight, input_boolean.strobe_dj]
  conditions:
  - {condition: state, entity_id: input_boolean.strobe_actif, state: 'on'}
  actions:
  - action: script.turn_on
    target: {entity_id: script.strobe_lumieres}
