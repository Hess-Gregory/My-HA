# [AUTO-VERSION] v0.0.1 | 17/09/2026 14:01 | initialisation du versionning par fichier
# ============================================================
# HORAIRES PRO — ÉDITEUR (Chantier A complet : Créer + Modifier +
# Supprimer, avec panneau de détail structuré et coloré)
# ============================================================
# VERSION 2 — réécrit en réponse à :
#   "le popup [natif] fonctionne, mais je n'ai pas les informations
#   sur le fait si c'est journée normal, congé onva etc, ça manque
#   de détail... fait moi ça correctement bien structuré, bien
#   détaillé, avec la couleur dédiée etc, un bouton fermer, bouton
#   modifier... et revoie aussi côté création d'événement, il n'y a
#   pas beaucoup de choix de durée, il faudrait mettre une durée
#   personnalisée."
#
# POURQUOI ON NE PEUT PAS AMÉLIORER LE POPUP NATIF DE
# family-calendar-card :
#   - Ce popup ("Voir") est un template FIXE de la carte tierce :
#     il n'affiche que le nom du calendrier, la date/heure, et
#     éventuellement location/description SI non vides — aucune
#     couleur par type, aucun bouton personnalisé n'est possible
#     via la config YAML (vérifié dans le code source de la carte).
#   - Le type réel (Jour normal, Congé ONVA, ...) vient du LABEL
#     Todoist de la tâche. L'entité calendar.horaires_pro (issue de
#     l'intégration Todoist) n'expose PAS les labels dans l'objet
#     événement du calendrier — seulement summary/description/
#     location/start/end. Beaucoup de tâches (créées à la main dans
#     l'app Todoist) n'ont même pas de description. Résultat : même
#     avec showDescription activé, le popup natif reste pauvre.
#
# SOLUTION RETENUE : un panneau "Détails & Édition" séparé, sous le
# calendrier, dans l'onglet Horaires Pro. Il ne remplace pas le clic
# sur le calendrier (qui reste tel quel, limitation acceptée), mais
# offre un vrai flux complet :
#   1. On choisit Personne + Date -> la liste des tâches de ce jour
#      s'affiche (jusqu'à 4), construites depuis les capteurs de
#      blocs (qui EUX connaissent le vrai type/couleur/emoji, car
#      calculés à partir des labels Todoist bruts).
#   2. On sélectionne une tâche -> panneau "Détails" structuré et
#      coloré (bordure de la couleur du type, emoji, nom du type,
#      personne, date, horaires, pause, durée effective) avec
#      3 boutons : Fermer / Modifier / Supprimer (avec confirmation).
#   3. "Modifier" charge la tâche dans le même formulaire que la
#      création (pré-rempli) -> Enregistrer (PATCH Todoist) ou
#      Annuler.
#   4. Quand rien n'est sélectionné, le formulaire de CRÉATION est
#      affiché par défaut, avec une durée 100% libre (texte : "7h30",
#      "07:30", "450", "45min") + des boutons de préréglage rapide
#      (qui ne font que pré-remplir le champ texte — on garde la
#      liberté totale de taper autre chose).
#
# Tout passe par l'API Todoist (POST création, POST modification,
# DELETE suppression sur /api/v1/tasks/{id}) via rest_command, avec
# le même token que les capteurs REST existants (voir
# horaires_pro.yaml). Le champ "content" n'est JAMAIS réécrit lors
# d'une modification, pour ne pas effacer un texte personnalisé
# ("— Gregory — Travail" etc.) que tu aurais ajouté à la main dans
# Todoist.
#
# IMPORTANT : le endpoint de modification (POST /api/v1/tasks/{id})
# n'a pas encore été testé en conditions réelles au moment de
# l'écriture de ce fichier — à vérifier au premier "Enregistrer".
# S'il échoue, le message d'erreur apparaîtra dans
# input_text.hp_editeur_resultat et dans les logs HA.
# ============================================================

