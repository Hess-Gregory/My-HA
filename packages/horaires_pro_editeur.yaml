input_boolean:
  hp_editeur_mode_edition:
    name: "Horaires Pro — Mode édition actif"
    icon: mdi:pencil

  hp_a_une_selection:
    name: "Horaires Pro — Une tâche est sélectionnée"
    icon: mdi:checkbox-marked-circle-outline
    initial: false
    # Reflet, en input_boolean, de "hp_selection_id != ''" — utilisé
    # pour la visibilité des panneaux du dashboard : le composant
    # `conditional` de ce HA n'accepte pas les conditions de type
    # `template` ("Conditions are invalid"), donc on ne peut tester
    # que des égalités d'état simples (state/numeric_state). Ce
    # booléen est mis à jour explicitement par les scripts
    # ci-dessous à chaque sélection/désélection/suppression.

rest_command:
  # ------------------------------------------------------------
  # CRÉATION (POST sur la collection /tasks)
  # ------------------------------------------------------------
  horaires_pro_todoist_create_task:
    url: "https://api.todoist.com/api/v1/tasks"
    method: POST
    headers:
      Authorization: !secret todoist_api_token
      Content-Type: application/json
    content_type: "application/json"
    payload: >-
      {{ {
        "content": content,
        "description": description,
        "project_id": "6hWVvMpjWrXvrCRm",
        "labels": [label],
        "due_datetime": due_datetime,
        "duration": duration | int,
        "duration_unit": "minute"
      } | tojson }}

  # ------------------------------------------------------------
  # MODIFICATION (POST sur la ressource /tasks/{id})
  # "content" n'est jamais envoyé : on ne touche pas au texte de
  # la tâche, seulement à son type (label), sa description
  # structurée, sa date/heure et sa durée.
  # ------------------------------------------------------------
  horaires_pro_todoist_update_task:
    url: "https://api.todoist.com/api/v1/tasks/{{ task_id }}"
    method: POST
    headers:
      Authorization: !secret todoist_api_token
      Content-Type: application/json
    content_type: "application/json"
    payload: >-
      {{ {
        "description": description,
        "labels": [label],
        "due_datetime": due_datetime,
        "duration": duration | int,
        "duration_unit": "minute"
      } | tojson }}

  # ------------------------------------------------------------
  # SUPPRESSION
  # ------------------------------------------------------------
  horaires_pro_todoist_delete_task:
    url: "https://api.todoist.com/api/v1/tasks/{{ task_id }}"
    method: DELETE
    headers:
      Authorization: !secret todoist_api_token

template:
  - sensor:
      # ========================================================
      # TÂCHES DU JOUR (pour la personne + la date choisies dans
      # le formulaire) — sert à retrouver une tâche à sélectionner
      # sans devoir cliquer sur le calendrier.
      # ========================================================

      - name: "Horaires Pro Taches Du Jour"
        unique_id: horaires_pro_taches_du_jour
        icon: mdi:calendar-search
        state: >-
          {% set p = states('input_select.hp_editeur_personne') %}
          {% set blocs = state_attr('sensor.horaires_pro_blocs_gregory', 'blocs')
             if p == 'Grégory'
             else state_attr('sensor.horaires_pro_blocs_sandrine', 'blocs') %}
          {% set blocs = blocs | default([], true) %}
          {% set d = states('input_datetime.hp_editeur_date') %}
          {{ blocs | selectattr('date', 'match', '^' ~ d) | list | length }}
        attributes:
          liste: >-
            {% set p = states('input_select.hp_editeur_personne') %}
            {% set blocs = state_attr('sensor.horaires_pro_blocs_gregory', 'blocs')
               if p == 'Grégory'
               else state_attr('sensor.horaires_pro_blocs_sandrine', 'blocs') %}
            {% set blocs = blocs | default([], true) %}
            {% set d = states('input_datetime.hp_editeur_date') %}
            {% set trouves = blocs | selectattr('date', 'match', '^' ~ d) | list %}
            {{ trouves | sort(attribute='start') }}

      # ========================================================
      # TÂCHE SÉLECTIONNÉE (détail complet pour l'affichage et
      # comme source pour le chargement en édition)
      # ========================================================

      - name: "Horaires Pro Tache Selectionnee"
        unique_id: horaires_pro_tache_selectionnee
        icon: mdi:calendar-text
        state: >-
          {% set sel = states('input_text.hp_selection_id') %}
          {{ 'trouvee' if sel not in ['', 'unknown', 'unavailable'] else 'aucune' }}
        attributes:
          bloc: >-
            {% set sel = states('input_text.hp_selection_id') %}
            {% set g = state_attr('sensor.horaires_pro_blocs_gregory', 'blocs') | default([], true) %}
            {% set s = state_attr('sensor.horaires_pro_blocs_sandrine', 'blocs') | default([], true) %}
            {% set tous = g + s %}
            {% set trouve = tous | selectattr('id', 'equalto', sel) | list %}
            {{ trouve[0] if trouve | length > 0 else {} }}

script:
  # ==============================================================
  # CRÉATION
  # ==============================================================
  horaires_pro_creer_tache:
    alias: "Horaires Pro - Créer une tâche"
    icon: mdi:calendar-plus
    sequence:
      - variables:
          labels_gregory:
            "Jour normal": "G_Jour_Normal"
            "Journée réduite": "G_Journee_Reduite"
            "Heures supplémentaires prestées": "G_Heures_Supp_Prestees"
            "Heures supplémentaires déduites": "G_Heures_Supp_Deduites"
            "Congé ONVA": "G_Vac_ONVA"
            "ADV mensuel": "G_ADV_Mois"
            "ADV samedi": "G_ADV_Samedi"
            "ADV 13ᵉ mois": "G_ADV_13eme_mois"
            "Jour férié": "G_Jour_Ferie"
            "Récupération jour férié": "G_Recup_Jour_Ferie"
            "Chômage technique": "G_Chomage_Technique"
            "Maladie": "G_Maladie"
            "Maladie enfant": "G_Maladie_Enfant"
            "Visite médicale": "G_Visite_Medicale"
            "Formation": "G_Formation"
            "Syndicat": "G_Syndicat"
            "Réunion": "G_Meeting"
            "Jour impérieux": "G_Jour_Imperieux"
            "Absence justifiée": "G_Absence_Justifiee"
            "Absence injustifiée": "G_Absence_Injustifiee"
            "Congé sans solde": "G_Conge_Sans_Solde"
            "Repos weekend": "G_Repos_Weekend"
            "Grève": "G_Greve"
          labels_sandrine:
            "Jour normal": "S_Jour_Normal"
            "Journée réduite": "S_Journee_Reduite"
            "Congé ONVA": "S_Vac_ONVA"
            "ADV mensuel": "S_ADV_Mois"
            "ADV 13ᵉ mois": "S_ADV_13eme_mois"
            "CSU": "S_CSU"
            "Jour férié": "S_Jour_Ferie"
            "Récupération jour férié": "S_Recup_Jour_Ferie"
            "Heure chaleur": "S_Chaleur"
            "Maladie": "S_Maladie"
            "Maladie enfant": "S_Maladie_Enfant"
            "Visite médicale": "S_Visite_Medicale"
            "Formation": "S_Formation"
            "Syndicat": "S_Syndicat"
            "Jour impérieux": "S_Jour_Imperieux"
            "Absence justifiée": "S_Absence_Justifiee"
            "Absence injustifiée": "S_Absence_Injustifiee"
            "Repos weekend": "S_Repos_Weekend"
            "Grève": "S_Greve"
          personne: "{{ states('input_select.hp_editeur_personne') }}"
          type_nom: >-
            {{ states('input_select.hp_editeur_type_gregory')
               if personne == 'Grégory'
               else states('input_select.hp_editeur_type_sandrine') }}
          label_code: >-
            {{ (labels_gregory if personne == 'Grégory' else labels_sandrine).get(type_nom, '') }}
          prefix: "{{ '— Gregory' if personne == 'Grégory' else '— Sandrine' }}"
          date: "{{ states('input_datetime.hp_editeur_date') }}"
          heure: "{{ states('input_datetime.hp_editeur_heure') }}"
          duree: "{{ states('input_text.hp_editeur_duree') }}"
          pause: "{{ states('input_text.hp_editeur_pause') }}"
          duree_min: >-
            {% set d = duree | trim | lower | replace(' ', '') %}
            {% if 'h' in d %}
              {% set parts = d.split('h') %}
              {{ (parts[0] | int(0)) * 60 + ((parts[1] if parts[1] else '0') | int(0)) }}
            {% elif ':' in d %}
              {% set parts = d.split(':') %}
              {{ (parts[0] | int(0)) * 60 + (parts[1] | int(0)) }}
            {% elif 'min' in d %}
              {{ d | replace('min', '') | int(0) }}
            {% else %}
              {{ d | int(0) }}
            {% endif %}
          pause_min: >-
            {% set p = (pause | default('00:00', true)) | trim | lower | replace(' ', '') %}
            {% if p == '' %}
              0
            {% elif 'h' in p %}
              {% set parts = p.split('h') %}
              {{ (parts[0] | int(0)) * 60 + ((parts[1] if parts[1] else '0') | int(0)) }}
            {% elif ':' in p %}
              {% set parts = p.split(':') %}
              {{ (parts[0] | int(0)) * 60 + (parts[1] | int(0)) }}
            {% elif 'min' in p %}
              {{ p | replace('min', '') | int(0) }}
            {% else %}
              {{ p | int(0) }}
            {% endif %}
          pause_hhmm: "{{ '%02d:%02d' | format(pause_min | int // 60, pause_min | int % 60) }}"
          due_datetime_utc: >-
            {{ as_datetime(date ~ ' ' ~ heure)
               | as_timestamp
               | timestamp_custom('%Y-%m-%dT%H:%M:%SZ', true) }}
      - if:
          - condition: template
            value_template: "{{ label_code == '' }}"
        then:
          - service: input_text.set_value
            target:
              entity_id: input_text.hp_editeur_resultat
            data:
              value: "❌ Erreur : type '{{ type_nom }}' introuvable pour {{ personne }}."
        else:
          - service: rest_command.horaires_pro_todoist_create_task
            data:
              content: "{{ prefix }}"
              description: "Type: {{ type_nom }}\nPause: {{ pause_hhmm }}"
              label: "{{ label_code }}"
              due_datetime: "{{ due_datetime_utc }}"
              duration: "{{ duree_min }}"
          - delay: "00:00:02"
          - service: homeassistant.update_entity
            target:
              entity_id:
                - sensor.horaires_pro_taches
                - sensor.horaires_pro_projet
          - service: input_text.set_value
            target:
              entity_id: input_text.hp_editeur_resultat
            data:
              value: >-
                ✅ Tâche créée : {{ prefix }} — {{ type_nom }} — {{ date }}
                {{ heure[:5] }} ({{ duree }})

  # ==============================================================
  # CHARGER UNE TÂCHE EXISTANTE DANS LE FORMULAIRE (bouton "Modifier")
  # ==============================================================
  horaires_pro_charger_pour_edition:
    alias: "Horaires Pro - Charger la tâche sélectionnée pour édition"
    icon: mdi:pencil
    sequence:
      - variables:
          bloc: "{{ state_attr('sensor.horaires_pro_tache_selectionnee', 'bloc') | default({}, true) }}"
      - if:
          - condition: template
            value_template: "{{ bloc == {} }}"
        then:
          - stop: "Aucune tâche sélectionnée"
      - service: input_select.select_option
        target:
          entity_id: input_select.hp_editeur_personne
        data:
          option: "{{ 'Grégory' if bloc.personne == 'Gregory' else 'Sandrine' }}"
      - choose:
          - conditions: "{{ bloc.personne == 'Gregory' }}"
            sequence:
              - service: input_select.select_option
                target:
                  entity_id: input_select.hp_editeur_type_gregory
                data:
                  option: "{{ bloc.nom }}"
        default:
          - service: input_select.select_option
            target:
              entity_id: input_select.hp_editeur_type_sandrine
            data:
              option: "{{ bloc.nom }}"
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.hp_editeur_date
        data:
          date: "{{ bloc.date[:10] }}"
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.hp_editeur_heure
        data:
          time: "{{ bloc.start if bloc.start else '00:00' }}"
      - service: input_text.set_value
        target:
          entity_id: input_text.hp_editeur_duree
        data:
          value: >-
            {{ '%02d:%02d' | format((bloc.duration_minutes | int(0)) // 60, (bloc.duration_minutes | int(0)) % 60) }}
      - service: input_text.set_value
        target:
          entity_id: input_text.hp_editeur_pause
        data:
          value: >-
            {{ '%02d:%02d' | format((bloc.pause_minutes | int(0)) // 60, (bloc.pause_minutes | int(0)) % 60) }}
      - service: input_text.set_value
        target:
          entity_id: input_text.hp_editeur_task_id_en_cours
        data:
          value: "{{ bloc.id }}"
      - service: input_text.set_value
        target:
          entity_id: input_text.hp_editeur_resultat
        data:
          value: ""
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.hp_editeur_mode_edition

  # ==============================================================
  # ENREGISTRER LES MODIFICATIONS (bouton "Enregistrer")
  # ==============================================================
  horaires_pro_modifier_tache:
    alias: "Horaires Pro - Enregistrer les modifications"
    icon: mdi:content-save
    sequence:
      - variables:
          labels_gregory:
            "Jour normal": "G_Jour_Normal"
            "Journée réduite": "G_Journee_Reduite"
            "Heures supplémentaires prestées": "G_Heures_Supp_Prestees"
            "Heures supplémentaires déduites": "G_Heures_Supp_Deduites"
            "Congé ONVA": "G_Vac_ONVA"
            "ADV mensuel": "G_ADV_Mois"
            "ADV samedi": "G_ADV_Samedi"
            "ADV 13ᵉ mois": "G_ADV_13eme_mois"
            "Jour férié": "G_Jour_Ferie"
            "Récupération jour férié": "G_Recup_Jour_Ferie"
            "Chômage technique": "G_Chomage_Technique"
            "Maladie": "G_Maladie"
            "Maladie enfant": "G_Maladie_Enfant"
            "Visite médicale": "G_Visite_Medicale"
