            {% endif %}
          pause_min: >-
            {% set p = (pause | default('00:00', true)) | trim | lower | replace(' ', '') %}
            {% if p == '' %}
              0
            {% elif 'h' in p %}
              {% set parts = p.split('h') %}
              {{ (parts[0] | int(0)) * 60 + ((parts[1] if parts[1] else '0') | int(0)) }}
            {% elif ':' in p %}
              {% set parts = p.split(':') %}
              {{ (parts[0] | int(0)) * 60 + (parts[1] | int(0)) }}
            {% elif 'min' in p %}
              {{ p | replace('min', '') | int(0) }}
            {% else %}
              {{ p | int(0) }}
            {% endif %}
          pause_hhmm: "{{ '%02d:%02d' | format(pause_min | int // 60, pause_min | int % 60) }}"
          due_datetime_utc: >-
            {{ as_datetime(date ~ ' ' ~ heure)
               | as_timestamp
               | timestamp_custom('%Y-%m-%dT%H:%M:%SZ', true) }}
      - if:
          - condition: template
            value_template: "{{ label_code == '' or task_id == '' }}"
        then:
          - service: input_text.set_value
            target:
              entity_id: input_text.hp_editeur_resultat
            data:
              value: "❌ Erreur : type ou identifiant de tâche manquant, modification annulée."
        else:
          - service: rest_command.horaires_pro_todoist_update_task
            data:
              task_id: "{{ task_id }}"
              description: "Type: {{ type_nom }}\nPause: {{ pause_hhmm }}"
              label: "{{ label_code }}"
              due_datetime: "{{ due_datetime_utc }}"
              duration: "{{ duree_min }}"
          - delay: "00:00:02"
          - service: homeassistant.update_entity
            target:
              entity_id:
                - sensor.horaires_pro_taches
                - sensor.horaires_pro_projet
          - service: input_text.set_value
            target:
              entity_id: input_text.hp_editeur_resultat
            data:
              value: >-
                ✅ Tâche modifiée : {{ type_nom }} — {{ date }} {{ heure[:5] }}
                ({{ duree }})
          - service: input_boolean.turn_off
            target:
              entity_id: input_boolean.hp_editeur_mode_edition
          - service: input_text.set_value
            target:
              entity_id: input_text.hp_editeur_task_id_en_cours
            data:
              value: ""

  # ==============================================================
  # ANNULER L'ÉDITION (sans enregistrer)
  # ==============================================================
  horaires_pro_annuler_edition:
    alias: "Horaires Pro - Annuler l'édition"
    icon: mdi:close
    sequence:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.hp_editeur_mode_edition
      - service: input_text.set_value
        target:
          entity_id: input_text.hp_editeur_task_id_en_cours
        data:
          value: ""

  # ==============================================================
  # FERMER LE PANNEAU DE DÉTAIL (retour au formulaire de création)
  # ==============================================================
  horaires_pro_fermer_selection:
    alias: "Horaires Pro - Fermer la sélection"
    icon: mdi:close-circle
    sequence:
      - service: input_text.set_value
        target:
          entity_id: input_text.hp_selection_id
        data:
          value: ""
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.hp_editeur_mode_edition
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.hp_a_une_selection
      - service: input_text.set_value
        target:
          entity_id: input_text.hp_editeur_task_id_en_cours
        data:
          value: ""

  # ==============================================================
  # SÉLECTIONNER UNE TÂCHE DE LA LISTE DU JOUR (0 = première, etc.)
  # ==============================================================
  horaires_pro_selectionner_tache_par_index:
    alias: "Horaires Pro - Sélectionner une tâche du jour"
    icon: mdi:cursor-default-click
    fields:
      index:
        description: "Position dans la liste des tâches du jour (0 = première)"
        example: 0
    sequence:
      - variables:
          liste: "{{ state_attr('sensor.horaires_pro_taches_du_jour', 'liste') | default([], true) }}"
      - if:
          - condition: template
            value_template: "{{ index | int(0) < (liste | length) }}"
        then:
          - service: input_text.set_value
            target:
              entity_id: input_text.hp_selection_id
            data:
              value: "{{ liste[index | int(0)].id }}"
          - service: input_boolean.turn_off
            target:
              entity_id: input_boolean.hp_editeur_mode_edition
          - service: input_boolean.turn_on
            target:
              entity_id: input_boolean.hp_a_une_selection

  # ==============================================================
  # SUPPRIMER LA TÂCHE SÉLECTIONNÉE
  # ==============================================================
  horaires_pro_supprimer_tache:
    alias: "Horaires Pro - Supprimer la tâche sélectionnée"
    icon: mdi:delete
    sequence:
      - variables:
          task_id: "{{ states('input_text.hp_selection_id') }}"
      - if:
          - condition: template
            value_template: "{{ task_id == '' }}"
        then:
          - stop: "Aucune tâche sélectionnée"
      - service: rest_command.horaires_pro_todoist_delete_task
        data:
          task_id: "{{ task_id }}"
      - delay: "00:00:01"
      - service: homeassistant.update_entity
        target:
          entity_id:
            - sensor.horaires_pro_taches
            - sensor.horaires_pro_projet
      - service: input_text.set_value
        target:
          entity_id: input_text.hp_selection_id
        data:
          value: ""
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.hp_editeur_mode_edition
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.hp_a_une_selection
      - service: input_text.set_value
        target:
          entity_id: input_text.hp_editeur_task_id_en_cours
        data:
          value: ""