  hp_selection_id:
    name: "Horaires Pro — ID de la tâche sélectionnée"
    icon: mdi:identifier
    initial: ""

  hp_editeur_task_id_en_cours:
    name: "Horaires Pro — ID de la tâche en cours d'édition"
