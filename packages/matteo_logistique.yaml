input_number:
  banque_trajets_gregory:
    name: "Banque de Trajets — Grégory"
    icon: mdi:car-multiple
    min: -20
    max: 20
    step: 1
    unit_of_measurement: "trajets"
    mode: box

  banque_trajets_maman:
    name: "Banque de Trajets — Maman"
    icon: mdi:car-multiple
    min: -20
    max: 20
    step: 1
    unit_of_measurement: "trajets"
    mode: box

template:
  - sensor:
      - name: "Planning Matteo Engine"
        unique_id: sensor_planning_matteo_engine
        state: "OK"
        icon: mdi:calendar-sync
        attributes:
          weekends: >
            {% set ref_friday = as_datetime('2026-09-18').date() %}
            {% set today = now().date() %}
            
            {% set days_since_friday = (today.weekday() - 4) % 7 %}
            {% set current_friday = today - timedelta(days=days_since_friday) %}

            {% set start_friday_history = current_friday - timedelta(weeks=104) %}
            {% set start_friday_view = current_friday - timedelta(weeks=2) %}
            {% set end_friday = current_friday + timedelta(weeks=52) %}

            {% set overrides = states('input_text.matteo_planning_overrides') | from_json if states('input_text.matteo_planning_overrides') not in ['unknown', 'unavailable', ''] else {} %}
            {% set feries_fixes = ['01-01', '01-05', '21-07', '15-08', '01-11', '11-11', '25-12'] %}

            {% set ns = namespace(ui_items=[], perm_shift=0) %}

            {% for week_idx in range(0, 157) %}
              {% set fri = start_friday_history + timedelta(weeks=week_idx) %}
              
              {% if fri <= end_friday %}
                {% set sun = fri + timedelta(days=2) %}
                {% set fri_str = fri.strftime('%Y-%m-%d') %}
                {% set id_str = fri.strftime('%d%m') %}

                {% set ov_date = overrides.get(fri_str, {}) %}
                {% if ov_date.get('type_action') == 'Changement Permanent (Date pivot)' %}
                  {% set ns.perm_shift = ns.perm_shift + 1 %}
                {% endif %}

                {% if fri >= start_friday_view %}
                  {% set weeks_diff = ((fri - ref_friday).days // 7) %}
                  {% set default_is_papa = ((weeks_diff + ns.perm_shift) % 2 == 0) %}

                  {% if ov_date.get('type_action') == 'Exceptionnel Ponctuel (Inverser ce week-end / Jour)' %}
                    {% set is_papa = (ov_date.get('gardien_force') == 'Papa') %}
                  {% else %}
                    {% set is_papa = default_is_papa %}
                  {% endif %}

                  {% set is_ferie = (fri.strftime('%m-%d') in feries_fixes) or (sun.strftime('%m-%d') in feries_fixes) %}
                  {% set base_type = "Weekend (Papa)" if is_papa else "Weekend (Maman)" %}
                  {% set type_g = base_type ~ " (🎉 Férié)" if is_ferie else base_type %}

                  {% if is_papa %}
                    {% set default_aller = "Grégory" %}
                    {% set default_code_a = "A" %}
                    {% set default_retour = "Élodie / Olivier" %}
                    {% set default_code_r = "B" %}
                  {% else %}
                    {% set default_aller = "Aucun" %}
                    {% set default_code_a = "E" %}
                    {% set default_retour = "Aucun (Chez Maman)" %}
                    {% set default_code_r = "E" %}
                  {% endif %}

                  {% set aller_final = ov_date.get('acteur_aller', default_aller) %}
                  {% set retour_final = ov_date.get('acteur_retour', default_retour) %}
                  {% set code_a_final = ov_date.get('code_aller', default_code_a) %}
                  {% set code_r_final = ov_date.get('code_retour', default_code_r) %}

                  {% set item = {
                    "id": id_str,
                    "date_key": fri_str,
                    "date": "du " ~ fri.strftime('%d/%m') ~ " au " ~ sun.strftime('%d/%m'),
                    "type_garde": type_g,
                    "aller": aller_final,
                    "code_aller": code_a_final,
                    "retour": retour_final,
                    "code_retour": code_r_final,
                    "raison": ov_date.get('motif', 'Aucune'),
                    "is_past": (fri < current_friday)
                  } %}
                  {% set ns.ui_items = ns.ui_items + [item] %}
                {% endif %}
              {% endif %}
            {% endfor %}

            {{ ns.ui_items | tojson }}

      - name: "Matteo Statut Garde Calculé"
        unique_id: matteo_statut_garde_calcule
        icon: mdi:home-heart
        state: >
          {% set planning = state_attr('sensor.planning_matteo_engine', 'weekends') %}
          {% set today_str = now().strftime('%Y-%m-%d') %}
          {% set ns = namespace(status="Inconnu") %}
          {% if planning %}
            {% for item in planning %}
              {% if item.date_key <= today_str %}
                {% set ns.status = item.type_garde %}
              {% endif %}
            {% endfor %}
          {% endif %}
          {{ ns.status }}

script:
  banque_trajets_ajuster:
    alias: "Matteo — Ajuster la Banque de Trajets"
    icon: mdi:car-arrow-right
    fields:
      parent:
        description: "gregory ou maman"
      action:
        description: "increment ou decrement"
    sequence:
      - service: "input_number.set_value"
        target:
          entity_id: >
            {{ 'input_number.banque_trajets_gregory' if parent == 'gregory' else 'input_number.banque_trajets_maman' }}
        data:
          value: >
            {% set ent = 'input_number.banque_trajets_gregory' if parent == 'gregory' else 'input_number.banque_trajets_maman' %}
            {% set current = states(ent) | float(0) %}
            {{ current + 1 if action == 'increment' else current - 1 }}