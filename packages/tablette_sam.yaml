# [AUTO-VERSION] v0.6.3 | 10/10/2026 22:26 | retour au fonctionnement avec l app Home Assistant (Fully en lanceur)
# Tablette Sam (Fully Kiosk + Fotoo)
automation:
  - id: tablette_sam_relance_ha_apres_fotoo
    alias: "📱 Tablette Sam : relancer Home Assistant après Fotoo"
    description: "Quand on quitte le diaporama Fotoo et que la tablette retombe sur le lanceur Fully, rouvre automatiquement l'app Home Assistant."
    mode: single
    triggers:
      - trigger: state
        entity_id: sensor.salon_sam_tablette_application_au_premier_plan
        from: com.bo.fotoo
        to: de.ozerov.fully
    actions:
      - action: fully_kiosk.start_application
        data:
          application: io.homeassistant.companion.android
          device_id: f1aa9e7a06615d6cd968ef13a161d75c

  - id: tablette_sam_carillon_porte
    alias: "🔔 Tablette Sam : carillon à l'ouverture de la porte d'entrée"
    description: "Porte d'entrée ouverte : carillon sur la tablette + HA au premier plan sur l'Accueil (zoom hall + caméra), tout en parallèle."
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.hall_dentree_porte_entree_porte
        from: "off"
        to: "on"
    actions:
      - parallel:
          - sequence:
              - action: media_player.volume_set
                continue_on_error: true
                target:
                  entity_id: media_player.salon_sam_tablette
                data:
                  volume_level: 0.9
              - action: media_player.play_media
                continue_on_error: true
                target:
                  entity_id: media_player.salon_sam_tablette
                data:
                  media_content_id: "https://eimgtny2hzy1plxerp5llx00jf5ht2x9.ui.nabu.casa/local/sons/carillon.wav"
                  media_content_type: music
          - if:
              - condition: not
                conditions:
                  - condition: state
                    entity_id: sensor.salon_sam_tablette_application_au_premier_plan
                    state: io.homeassistant.companion.android
            then:
              - action: fully_kiosk.start_application
                continue_on_error: true
                data:
                  application: io.homeassistant.companion.android
                  device_id: f1aa9e7a06615d6cd968ef13a161d75c

  - id: tablette_sam_interphone
    alias: "🔔 Tablette Sam : sonnerie interphone BTicino"
    description: "On sonne à la platine de rue : carillon fort sur la tablette + HA au premier plan (caméra rue + bouton SAS sur le plan)."
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: event.hall_dentree_bticino_intercom_greg_et_sandrine_platine_de_rue
        not_to: [unavailable, unknown]
      - trigger: state
        entity_id: binary_sensor.hall_dentree_bticino_intercom_greg_et_sandrine_platine_de_rue
        from: "off"
        to: "on"
    actions:
      - parallel:
          - sequence:
              - action: media_player.volume_set
                continue_on_error: true
                target:
                  entity_id: media_player.salon_sam_tablette
                data:
                  volume_level: 1
              - action: media_player.play_media
                continue_on_error: true
                target:
                  entity_id: media_player.salon_sam_tablette
                data:
                  media_content_id: "https://eimgtny2hzy1plxerp5llx00jf5ht2x9.ui.nabu.casa/local/sons/interphone.wav"
                  media_content_type: music
          - if:
              - condition: not
                conditions:
                  - condition: state
                    entity_id: sensor.salon_sam_tablette_application_au_premier_plan
                    state: io.homeassistant.companion.android
            then:
              - action: fully_kiosk.start_application
                continue_on_error: true
                data:
                  application: io.homeassistant.companion.android
                  device_id: f1aa9e7a06615d6cd968ef13a161d75c
      - delay: "00:00:30"
