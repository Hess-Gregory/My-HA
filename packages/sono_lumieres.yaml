# Lumières dynamiques pour la sono, calées sur le tempo (BPM) du style musical
# Tempos : Hard techno 150 / Rétro techno 135 / Années 80 120 (changement tous les 2 temps), Tech house 125 / Afro house 120 / RnB 90 (tous les 4 temps), Chill 90 (tous les 8 temps) - commandes envoyées en parallèle
# Le curseur « Tempo sono » permet d'ajuster au morceau en cours (pris en compte au changement suivant)
input_select:
  sono_lumieres:
    name: Lumières sono musicale
    icon: mdi:music-circle
    options: [— Arrêt —, 🔊 Hard techno, 🎛️ Tech house, 🥁 Afro house, 🌙 Ambiance chill, 📼 Rétro techno, 💜 RnB, 🕹️ Années 80, 🌈 Universel · Arc-en-ciel, 🔥 Universel · Feu, 🌊 Universel · Océan, 💡 Universel · Néon, 🧊 Universel · Glace, 🌿 Universel · Jungle, ✨ Universel
        · Or & blanc, 🍬 Universel · Bonbon]
    initial: — Arrêt —
input_number:
  sono_tempo: {name: Tempo sono (BPM), icon: 'mdi:metronome', min: 60, max: 180, step: 1, mode: slider, unit_of_measurement: BPM}
script:
  sono_appliquer:
    alias: '🎵 Sono : appliquer une couleur (sans attendre)'
    mode: parallel
    max: 60
    max_exceeded: silent
    fields:
      ents: {}
      rgb: {}
      bri: {}
      tr: {}
    sequence:
    - action: light.turn_on
      continue_on_error: true
      target: {entity_id: '{{ ents }}'}
      data: {rgb_color: '{{ rgb }}', brightness: '{{ bri }}', transition: '{{ tr }}'}
  sono_lumieres:
    alias: 🎵 Lumières sono musicale (boucle au tempo)
    icon: mdi:music-circle
    mode: restart
    sequence:
    - variables:
        style: '{{ states(''input_select.sono_lumieres'') }}'
        cfg:
          🔊 Hard techno:
            bpm: 150
            beats: 2
            t: 0.15
            pal:
            - [255, 0, 0]
            - [255, 255, 255]
            - [180, 0, 0]
            - [255, 40, 0]
            bri: [255, 35, 255, 80]
          🎛️ Tech house:
            bpm: 125
            beats: 4
            t: 0.5
            pal:
            - [0, 60, 255]
            - [0, 220, 200]
            - [150, 0, 255]
            - [255, 160, 80]
            bri: [220, 140, 200, 120]
          🥁 Afro house:
            bpm: 120
            beats: 4
            t: 1.0
            pal:
            - [255, 140, 0]
            - [255, 70, 0]
            - [255, 200, 40]
            - [0, 170, 70]
            - [200, 0, 120]
            bri: [200, 170, 230, 150, 180]
          🌙 Ambiance chill:
            bpm: 90
            beats: 8
            t: 4.0
            pal:
            - [0, 180, 200]
            - [100, 60, 255]
            - [0, 90, 255]
            - [255, 120, 180]
            bri: [120, 95, 110, 85]
          📼 Rétro techno:
            bpm: 135
            beats: 2
            t: 0.2
            pal:
            - [120, 255, 0]
            - [255, 240, 0]
            - [0, 255, 255]
            - [255, 0, 200]
            bri: [255, 170, 255, 170]
          💜 RnB:
            bpm: 90
            beats: 4
            t: 2.0
            pal:
            - [140, 0, 255]
            - [255, 0, 140]
            - [220, 0, 40]
            - [255, 150, 40]
            bri: [150, 125, 140, 105]
          🕹️ Années 80:
            bpm: 120
            beats: 2
            t: 0.4
            pal:
            - [255, 20, 150]
            - [0, 120, 255]
            - [160, 0, 255]
            - [255, 220, 0]
            - [0, 255, 200]
            bri: [230, 190, 230, 200, 210]
          🌈 Universel · Arc-en-ciel:
            bpm: 120
            beats: 4
            t: 0.5
            pal:
            - [255, 0, 0]
            - [255, 140, 0]
            - [255, 230, 0]
            - [0, 220, 60]
            - [0, 120, 255]
            - [150, 0, 255]
            bri: [220, 220, 220, 220, 220, 220]
          🔥 Universel · Feu:
            bpm: 120
            beats: 4
            t: 0.5
            pal:
            - [255, 30, 0]
            - [255, 100, 0]
            - [255, 170, 20]
            - [200, 0, 0]
            bri: [230, 180, 240, 160]
          🌊 Universel · Océan:
            bpm: 120
            beats: 4
            t: 0.6
            pal:
            - [0, 60, 255]
            - [0, 190, 255]
            - [0, 255, 200]
            - [0, 20, 160]
            bri: [200, 170, 220, 150]
          💡 Universel · Néon:
            bpm: 120
            beats: 4
            t: 0.3
            pal:
            - [255, 0, 200]
            - [0, 255, 255]
            - [180, 255, 0]
            - [120, 0, 255]
            bri: [240, 220, 240, 220]
          🧊 Universel · Glace:
            bpm: 120
            beats: 4
            t: 0.6
            pal:
            - [170, 220, 255]
            - [90, 160, 255]
            - [230, 245, 255]
            - [60, 90, 255]
            bri: [210, 170, 230, 160]
          🌿 Universel · Jungle:
            bpm: 120
            beats: 4
            t: 0.5
            pal:
            - [0, 255, 80]
            - [150, 255, 0]
            - [0, 170, 90]
            - [255, 200, 0]
            bri: [210, 190, 180, 200]
          ✨ Universel · Or & blanc:
            bpm: 120
            beats: 4
            t: 0.5
            pal:
            - [255, 190, 60]
            - [255, 240, 200]
            - [255, 150, 20]
            - [255, 215, 120]
            bri: [230, 200, 240, 190]
          🍬 Universel · Bonbon:
            bpm: 120
            beats: 4
            t: 0.4
            pal:
            - [255, 100, 180]
            - [120, 220, 255]
            - [200, 140, 255]
            - [255, 200, 120]
            bri: [220, 200, 220, 200]
        lights: [light.salle_a_manger_lc, light.coin_dj_sono_gauche, light.salle_a_manger_ld, light.salon_panneau_mural, light.salle_a_manger_lg, light.coin_dj_sono_droite, light.salle_a_manger_vit_g, light.salon_ambilight_tv, light.salle_a_manger_vit_d]
    - {condition: template, value_template: '{{ style in cfg }}'}
    - action: light.turn_off
      continue_on_error: true
      target:
        entity_id: [light.salon_l_salon, light.cuisine_s_cuisine_1, light.cuisine_s_cuisine_2, light.cuisine_s_cuisine_3, light.cuisine_s_cuisine_4, light.cuisine_evier]
    - action: light.turn_on
      continue_on_error: true
      target: {entity_id: light.cuisine_etagere_cafe}
      data: {brightness: 20}
    - variables: {c: '{{ cfg[style] }}', t0: '{{ as_timestamp(now()) }}', next: '{{ as_timestamp(now()) }}'}
    - repeat:
        while:
        - {condition: template, value_template: '{{ is_state(''input_select.sono_lumieres'', style) and repeat.index < 50000 }}'}
        sequence:
        - variables: {step: '{{ repeat.index }}', n: '{{ c.pal | length }}', beat: '{{ 60 / ([states(''input_number.sono_tempo'') | float(c.bpm), 40] | max) }}'}
        - parallel:
          - sequence:
            - {condition: template, value_template: '{{ 0 < n }}'}
            - variables: {grp: '{% set ns = namespace(l=[]) %}{% for j in range(lights | length) %}{% if (step + j) % n == 0 %}{% set ns.l = ns.l + [lights[j]] %}{% endif %}{% endfor %}{{ ns.l }}'}
            - {condition: template, value_template: '{{ grp | length > 0 }}'}
            - action: script.turn_on
              continue_on_error: true
              target: {entity_id: script.sono_appliquer}
              data:
                variables: {ents: '{{ grp }}', rgb: '{{ c.pal[0] }}', bri: '{{ c.bri[0] }}', tr: '{{ (beat * c.t) | round(2) }}'}
          - sequence:
            - {condition: template, value_template: '{{ 1 < n }}'}
            - variables: {grp: '{% set ns = namespace(l=[]) %}{% for j in range(lights | length) %}{% if (step + j) % n == 1 %}{% set ns.l = ns.l + [lights[j]] %}{% endif %}{% endfor %}{{ ns.l }}'}
            - {condition: template, value_template: '{{ grp | length > 0 }}'}
            - action: script.turn_on
              continue_on_error: true
              target: {entity_id: script.sono_appliquer}
              data:
                variables: {ents: '{{ grp }}', rgb: '{{ c.pal[1] }}', bri: '{{ c.bri[1] }}', tr: '{{ (beat * c.t) | round(2) }}'}
          - sequence:
            - {condition: template, value_template: '{{ 2 < n }}'}
            - variables: {grp: '{% set ns = namespace(l=[]) %}{% for j in range(lights | length) %}{% if (step + j) % n == 2 %}{% set ns.l = ns.l + [lights[j]] %}{% endif %}{% endfor %}{{ ns.l }}'}
            - {condition: template, value_template: '{{ grp | length > 0 }}'}
            - action: script.turn_on
              continue_on_error: true
              target: {entity_id: script.sono_appliquer}
              data:
                variables: {ents: '{{ grp }}', rgb: '{{ c.pal[2] }}', bri: '{{ c.bri[2] }}', tr: '{{ (beat * c.t) | round(2) }}'}
          - sequence:
            - {condition: template, value_template: '{{ 3 < n }}'}
            - variables: {grp: '{% set ns = namespace(l=[]) %}{% for j in range(lights | length) %}{% if (step + j) % n == 3 %}{% set ns.l = ns.l + [lights[j]] %}{% endif %}{% endfor %}{{ ns.l }}'}
            - {condition: template, value_template: '{{ grp | length > 0 }}'}
            - action: script.turn_on
              continue_on_error: true
              target: {entity_id: script.sono_appliquer}
              data:
                variables: {ents: '{{ grp }}', rgb: '{{ c.pal[3] }}', bri: '{{ c.bri[3] }}', tr: '{{ (beat * c.t) | round(2) }}'}
          - sequence:
            - {condition: template, value_template: '{{ 4 < n }}'}
            - variables: {grp: '{% set ns = namespace(l=[]) %}{% for j in range(lights | length) %}{% if (step + j) % n == 4 %}{% set ns.l = ns.l + [lights[j]] %}{% endif %}{% endfor %}{{ ns.l }}'}
            - {condition: template, value_template: '{{ grp | length > 0 }}'}
            - action: script.turn_on
              continue_on_error: true
              target: {entity_id: script.sono_appliquer}
              data:
                variables: {ents: '{{ grp }}', rgb: '{{ c.pal[4] }}', bri: '{{ c.bri[4] }}', tr: '{{ (beat * c.t) | round(2) }}'}
          - sequence:
            - {condition: template, value_template: '{{ 5 < n }}'}
            - variables: {grp: '{% set ns = namespace(l=[]) %}{% for j in range(lights | length) %}{% if (step + j) % n == 5 %}{% set ns.l = ns.l + [lights[j]] %}{% endif %}{% endfor %}{{ ns.l }}'}
            - {condition: template, value_template: '{{ grp | length > 0 }}'}
            - action: script.turn_on
              continue_on_error: true
              target: {entity_id: script.sono_appliquer}
              data:
                variables: {ents: '{{ grp }}', rgb: '{{ c.pal[5] }}', bri: '{{ c.bri[5] }}', tr: '{{ (beat * c.t) | round(2) }}'}
        - delay: {seconds: '{{ [ (t0 + step * c.beats * beat) - as_timestamp(now()), 0.05 ] | max | round(2) }}'}
automation:
- id: sono_lumieres_selection
  alias: '🎵 Lumières sono : lancer/arrêter selon le style choisi'
  mode: restart
  triggers:
  - {trigger: state, entity_id: input_select.sono_lumieres}
  actions:
  - choose:
    - conditions:
      - {condition: state, entity_id: input_select.sono_lumieres, state: — Arrêt —}
      sequence:
      - action: script.turn_off
        target: {entity_id: script.sono_lumieres}
    default:
    - action: input_number.set_value
      target: {entity_id: input_number.sono_tempo}
      data: {value: '{{ {''🔊 Hard techno'': 150, ''🎛️ Tech house'': 125, ''🥁 Afro house'': 120, ''🌙 Ambiance chill'': 90, ''📼 Rétro techno'': 135, ''💜 RnB'': 90, ''🕹️ Années 80'': 120, ''🌈 Universel · Arc-en-ciel'': 120, ''🔥 Universel · Feu'': 120, ''🌊 Universel
          · Océan'': 120, ''💡 Universel · Néon'': 120, ''🧊 Universel · Glace'': 120, ''🌿 Universel · Jungle'': 120, ''✨ Universel · Or & blanc'': 120, ''🍬 Universel · Bonbon'': 120}[trigger.to_state.state] }}'}
    - action: script.turn_on
      target: {entity_id: script.sono_lumieres}
