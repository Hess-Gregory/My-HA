# Lumières dynamiques pour la sono, calées sur le tempo (BPM) du style musical
# Tempos : Hard techno 150 / Rétro techno 135 / Années 80 120 (changement tous les 2 temps), Tech house 125 / Afro house 120 / RnB 90 (tous les 4 temps), Chill 90 (tous les 8 temps) - commandes envoyées en parallèle
# Le curseur « Tempo sono » permet d'ajuster au morceau en cours (pris en compte au changement suivant)
input_select:
  sono_effet:
    name: Effet sono
    icon: mdi:flash
    options: [Aucun, ⚡ Strobe blanc, 🟣 Black light (UV), 💥 Blinder (flash chaud toutes les 4), ⬛ Blackout (coupures sur le temps)]
  sono_lumieres:
    name: Lumières sono musicale
    icon: mdi:music-circle
    options: [— Arrêt —, 🔊 Hard techno, 🎛️ Tech house, 🥁 Afro house, 🌙 Ambiance chill, 📼 Rétro techno, 💜 RnB, 🕹️ Années 80, ⚡ Universel · Strobe blanc, 🔴 Universel · Bleu nuit & rouge, 🟡 Universel · Jaune & bleu ciel, 🟣 Universel · Magenta & cyan, 🟢 Universel ·
        Laser vert & UV, 🟠 Universel · Ambre & violet, ❤️ Universel · Pulse rouge, ❄️ Universel · Flash blanc & bleu, 🌈 Universel · Chase arc-en-ciel, 🔥 Universel · Feu & or, 🌊 Universel · Océan profond, 🏰 Show · Tomorrowland main stage, 🖤 Show · Afterlife (blanc
        glacial & rouge), 🧊 Show · Anyma cyber néon, 🔺 Show · Daft Punk pyramide, 💙 Show · Swedish House Mafia, 🦇 Show · Berghain (rouge sombre), 🟥 Show · Hardstyle Defqon (rouge & blanc), 🎆 Show · Coldplay bracelets, 🌅 Show · Ibiza sunset]
    initial: — Arrêt —
input_number:
  sono_intensite: {name: Intensité sono, icon: 'mdi:brightness-6', min: 10, max: 100, step: 5, initial: 50, mode: slider, unit_of_measurement: '%'}
  sono_tempo: {name: Tempo sono (BPM), icon: 'mdi:metronome', min: 60, max: 180, step: 1, mode: slider, unit_of_measurement: BPM}
script:
  sono_preparer:
    alias: '🎵 Sono : préparer la pièce (lumières blanches coupées)'
    mode: single
    max_exceeded: silent
    sequence:
    - action: light.turn_off
      continue_on_error: true
      target:
        entity_id: [light.salon_l_salon, light.cuisine_s_cuisine_1, light.cuisine_s_cuisine_2, light.cuisine_s_cuisine_3, light.cuisine_s_cuisine_4, light.cuisine_evier]
    - action: light.turn_on
      continue_on_error: true
      target: {entity_id: light.cuisine_etagere_cafe}
      data: {brightness: 20}
  sono_appliquer:
    alias: '🎵 Sono : appliquer une couleur (sans attendre)'
    mode: parallel
    max: 60
    max_exceeded: silent
    fields:
      ents: {}
      rgb: {}
      bri: {}
      tr: {}
    sequence:
    - action: light.turn_on
      continue_on_error: true
      target: {entity_id: '{{ ents }}'}
      data: {rgb_color: '{{ rgb }}', brightness: '{{ bri }}', transition: '{{ tr }}'}
  sono_lumieres:
    alias: 🎵 Lumières sono musicale (boucle au tempo)
    icon: mdi:music-circle
    mode: restart
    sequence:
    - variables:
        style: '{{ states(''input_select.sono_lumieres'') }}'
        cfg:
          🔊 Hard techno:
            bpm: 150
            beats: 2
            t: 0.15
            pal:
            - [255, 0, 0]
            - [255, 255, 255]
            - [180, 0, 0]
            - [255, 40, 0]
            bri: [255, 35, 255, 80]
          🎛️ Tech house:
            bpm: 125
            beats: 4
            t: 0.5
            pal:
            - [0, 60, 255]
            - [0, 220, 200]
            - [150, 0, 255]
            - [255, 160, 80]
            bri: [220, 140, 200, 120]
          🥁 Afro house:
            bpm: 120
            beats: 4
            t: 1.0
            pal:
            - [255, 140, 0]
            - [255, 70, 0]
            - [255, 200, 40]
            - [0, 170, 70]
            - [200, 0, 120]
            bri: [200, 170, 230, 150, 180]
          🌙 Ambiance chill:
            bpm: 90
            beats: 8
            t: 4.0
            pal:
            - [0, 180, 200]
            - [100, 60, 255]
            - [0, 90, 255]
            - [255, 120, 180]
            bri: [120, 95, 110, 85]
          📼 Rétro techno:
            bpm: 135
            beats: 2
            t: 0.2
            pal:
            - [120, 255, 0]
            - [255, 240, 0]
            - [0, 255, 255]
            - [255, 0, 200]
            bri: [255, 170, 255, 170]
          💜 RnB:
            bpm: 90
            beats: 4
            t: 2.0
            pal:
            - [140, 0, 255]
            - [255, 0, 140]
            - [220, 0, 40]
            - [255, 150, 40]
            bri: [150, 125, 140, 105]
          🕹️ Années 80:
            bpm: 120
            beats: 2
            t: 0.4
            pal:
            - [255, 20, 150]
            - [0, 120, 255]
            - [160, 0, 255]
            - [255, 220, 0]
            - [0, 255, 200]
            bri: [230, 190, 230, 200, 210]
          ⚡ Universel · Strobe blanc:
            bpm: 128
            beats: 1
            t: 0.0
            sync: true
            pal:
            - [255, 255, 255]
            - [255, 255, 255]
            bri: [255, 1]
          🔴 Universel · Bleu nuit & rouge:
            bpm: 128
            beats: 2
            t: 0.08
            pal:
            - [0, 0, 170]
            - [255, 0, 0]
            bri: [230, 255]
          🟡 Universel · Jaune & bleu ciel:
            bpm: 128
            beats: 2
            t: 0.1
            pal:
            - [255, 200, 0]
            - [80, 200, 255]
            bri: [255, 230]
          🟣 Universel · Magenta & cyan:
            bpm: 128
            beats: 2
            t: 0.08
            pal:
            - [255, 0, 170]
            - [0, 230, 255]
            bri: [255, 240]
          🟢 Universel · Laser vert & UV:
            bpm: 128
            beats: 2
            t: 0.08
            pal:
            - [60, 255, 0]
            - [70, 0, 255]
            bri: [255, 255]
          🟠 Universel · Ambre & violet:
            bpm: 128
            beats: 4
            t: 0.5
            pal:
            - [255, 110, 0]
            - [110, 0, 255]
            bri: [240, 220]
          ❤️ Universel · Pulse rouge:
            bpm: 128
            beats: 1
            t: 0.05
            sync: true
            pal:
            - [255, 0, 0]
            - [255, 0, 0]
            bri: [255, 25]
          ❄️ Universel · Flash blanc & bleu:
            bpm: 128
            beats: 1
            t: 0.0
            pal:
            - [255, 255, 255]
            - [0, 40, 255]
            - [255, 255, 255]
            - [0, 0, 110]
            bri: [255, 220, 255, 60]
          🌈 Universel · Chase arc-en-ciel:
            bpm: 128
            beats: 1
            t: 0.15
            pal:
            - [255, 0, 0]
            - [255, 140, 0]
            - [255, 230, 0]
            - [0, 220, 60]
            - [0, 120, 255]
            - [150, 0, 255]
            bri: [230, 230, 230, 230, 230, 230]
          🔥 Universel · Feu & or:
            bpm: 128
            beats: 2
            t: 0.2
            pal:
            - [255, 25, 0]
            - [255, 140, 0]
            - [255, 215, 80]
            bri: [255, 200, 240]
          🌊 Universel · Océan profond:
            bpm: 128
            beats: 4
            t: 0.8
            pal:
            - [0, 25, 190]
            - [0, 170, 255]
            - [0, 255, 200]
            bri: [220, 180, 200]
          🏰 Show · Tomorrowland main stage:
            bpm: 128
            beats: 2
            t: 0.15
            pal:
            - [255, 170, 30]
            - [230, 0, 200]
            - [90, 0, 255]
            - [255, 240, 200]
            bri: [255, 230, 220, 255]
          🖤 Show · Afterlife (blanc glacial & rouge):
            bpm: 124
            beats: 4
            t: 0.6
            pal:
            - [220, 235, 255]
            - [200, 0, 0]
            - [40, 60, 255]
            - [255, 255, 255]
            bri: [200, 150, 90, 255]
          🧊 Show · Anyma cyber néon:
            bpm: 126
            beats: 2
            t: 0.2
            pal:
            - [0, 240, 255]
            - [255, 255, 255]
            - [255, 0, 170]
            - [0, 80, 255]
            bri: [240, 255, 220, 200]
          🔺 Show · Daft Punk pyramide:
            bpm: 124
            beats: 2
            t: 0.1
            pal:
            - [255, 0, 0]
            - [0, 60, 255]
            - [255, 255, 255]
            bri: [255, 240, 255]
          💙 Show · Swedish House Mafia:
            bpm: 128
            beats: 2
            t: 0.15
            pal:
            - [0, 90, 255]
            - [255, 255, 255]
            - [0, 30, 180]
            bri: [250, 255, 200]
          🦇 Show · Berghain (rouge sombre):
            bpm: 135
            beats: 1
            t: 0.1
            sync: true
            pal:
            - [200, 0, 0]
            - [255, 0, 0]
            - [120, 0, 0]
            - [255, 255, 255]
            bri: [90, 255, 40, 180]
          🟥 Show · Hardstyle Defqon (rouge & blanc):
            bpm: 150
            beats: 1
            t: 0.0
            pal:
            - [255, 0, 0]
            - [255, 255, 255]
            bri: [255, 255]
          🎆 Show · Coldplay bracelets:
            bpm: 120
            beats: 2
            t: 0.3
            pal:
            - [255, 0, 90]
            - [255, 200, 0]
            - [0, 200, 255]
            - [140, 0, 255]
            - [0, 255, 120]
            - [255, 90, 0]
            bri: [240, 240, 240, 240, 240, 240]
          🌅 Show · Ibiza sunset:
            bpm: 118
            beats: 4
            t: 1.0
            pal:
            - [255, 90, 0]
            - [255, 40, 120]
            - [255, 170, 60]
            - [160, 0, 200]
            bri: [220, 200, 230, 180]
        lights: [light.salle_a_manger_lc, light.coin_dj_sono_gauche, light.salle_a_manger_ld, light.salon_panneau_mural, light.salle_a_manger_lg, light.coin_dj_sono_droite, light.salle_a_manger_vit_g, light.salon_ambilight_tv, light.salle_a_manger_vit_d]
    - {condition: template, value_template: '{{ style in cfg }}'}
    - action: script.turn_on
      continue_on_error: true
      target: {entity_id: script.sono_preparer}
    - variables: {c: '{{ cfg[style] }}', t0: '{{ as_timestamp(now()) }}', next: '{{ as_timestamp(now()) }}'}
    - repeat:
        while:
        - {condition: template, value_template: '{{ is_state(''input_select.sono_lumieres'', style) and repeat.index < 50000 }}'}
        sequence:
        - variables: {step: '{{ repeat.index }}', n: '{{ c.pal | length }}', beat: '{{ 60 / ([states(''input_number.sono_tempo'') | float(c.bpm), 40] | max) }}'}
        - parallel:
          - sequence:
            - {condition: template, value_template: '{{ 0 < n }}'}
            - variables: {grp: '{% set ns = namespace(l=[]) %}{% for j in range(lights | length) %}{% if ((step + (0 if c.sync is defined and c.sync else j)) % n) == 0 %}{% set ns.l = ns.l + [lights[j]] %}{% endif %}{% endfor %}{{ ns.l }}'}
            - {condition: template, value_template: '{{ grp | length > 0 }}'}
            - action: script.turn_on
              continue_on_error: true
              target: {entity_id: script.sono_appliquer}
              data:
                variables: {ents: '{{ grp }}', rgb: '{% set e = states(''input_select.sono_effet'') %}{% if ''Black light'' in e %}{{ [70,0,255] }}{% elif ''Strobe'' in e and step % 2 == 0 %}{{ [255,255,255] }}{% elif ''Blinder'' in e and step % 4 == 0 %}{{ [255,180,90]
                    }}{% else %}{{ c.pal[0] }}{% endif %}', bri: '{% set e = states(''input_select.sono_effet'') %}{% set i = states(''input_number.sono_intensite'') | float(50) / 100 %}{% if ''Blackout'' in e and step % 2 == 0 %}1{% elif (''Strobe'' in e and step
                    % 2 == 0) or (''Blinder'' in e and step % 4 == 0) %}{{ [ (255 * i) | int, 1 ] | max }}{% else %}{{ [ (c.bri[0] * i) | round(0) | int, 1 ] | max }}{% endif %}', tr: '{% set e = states(''input_select.sono_effet'') %}{% if ''Strobe'' in e or ''Blackout''
                    in e %}0{% else %}{{ (beat * c.t) | round(2) }}{% endif %}'}
          - sequence:
            - {condition: template, value_template: '{{ 1 < n }}'}
            - variables: {grp: '{% set ns = namespace(l=[]) %}{% for j in range(lights | length) %}{% if ((step + (0 if c.sync is defined and c.sync else j)) % n) == 1 %}{% set ns.l = ns.l + [lights[j]] %}{% endif %}{% endfor %}{{ ns.l }}'}
            - {condition: template, value_template: '{{ grp | length > 0 }}'}
            - action: script.turn_on
              continue_on_error: true
              target: {entity_id: script.sono_appliquer}
              data:
                variables: {ents: '{{ grp }}', rgb: '{% set e = states(''input_select.sono_effet'') %}{% if ''Black light'' in e %}{{ [70,0,255] }}{% elif ''Strobe'' in e and step % 2 == 0 %}{{ [255,255,255] }}{% elif ''Blinder'' in e and step % 4 == 0 %}{{ [255,180,90]
                    }}{% else %}{{ c.pal[1] }}{% endif %}', bri: '{% set e = states(''input_select.sono_effet'') %}{% set i = states(''input_number.sono_intensite'') | float(50) / 100 %}{% if ''Blackout'' in e and step % 2 == 0 %}1{% elif (''Strobe'' in e and step
                    % 2 == 0) or (''Blinder'' in e and step % 4 == 0) %}{{ [ (255 * i) | int, 1 ] | max }}{% else %}{{ [ (c.bri[1] * i) | round(0) | int, 1 ] | max }}{% endif %}', tr: '{% set e = states(''input_select.sono_effet'') %}{% if ''Strobe'' in e or ''Blackout''
                    in e %}0{% else %}{{ (beat * c.t) | round(2) }}{% endif %}'}
          - sequence:
            - {condition: template, value_template: '{{ 2 < n }}'}
            - variables: {grp: '{% set ns = namespace(l=[]) %}{% for j in range(lights | length) %}{% if ((step + (0 if c.sync is defined and c.sync else j)) % n) == 2 %}{% set ns.l = ns.l + [lights[j]] %}{% endif %}{% endfor %}{{ ns.l }}'}
            - {condition: template, value_template: '{{ grp | length > 0 }}'}
            - action: script.turn_on
              continue_on_error: true
              target: {entity_id: script.sono_appliquer}
              data:
                variables: {ents: '{{ grp }}', rgb: '{% set e = states(''input_select.sono_effet'') %}{% if ''Black light'' in e %}{{ [70,0,255] }}{% elif ''Strobe'' in e and step % 2 == 0 %}{{ [255,255,255] }}{% elif ''Blinder'' in e and step % 4 == 0 %}{{ [255,180,90]
                    }}{% else %}{{ c.pal[2] }}{% endif %}', bri: '{% set e = states(''input_select.sono_effet'') %}{% set i = states(''input_number.sono_intensite'') | float(50) / 100 %}{% if ''Blackout'' in e and step % 2 == 0 %}1{% elif (''Strobe'' in e and step
                    % 2 == 0) or (''Blinder'' in e and step % 4 == 0) %}{{ [ (255 * i) | int, 1 ] | max }}{% else %}{{ [ (c.bri[2] * i) | round(0) | int, 1 ] | max }}{% endif %}', tr: '{% set e = states(''input_select.sono_effet'') %}{% if ''Strobe'' in e or ''Blackout''
                    in e %}0{% else %}{{ (beat * c.t) | round(2) }}{% endif %}'}
          - sequence:
            - {condition: template, value_template: '{{ 3 < n }}'}
            - variables: {grp: '{% set ns = namespace(l=[]) %}{% for j in range(lights | length) %}{% if ((step + (0 if c.sync is defined and c.sync else j)) % n) == 3 %}{% set ns.l = ns.l + [lights[j]] %}{% endif %}{% endfor %}{{ ns.l }}'}
            - {condition: template, value_template: '{{ grp | length > 0 }}'}
            - action: script.turn_on
              continue_on_error: true
              target: {entity_id: script.sono_appliquer}
              data:
                variables: {ents: '{{ grp }}', rgb: '{% set e = states(''input_select.sono_effet'') %}{% if ''Black light'' in e %}{{ [70,0,255] }}{% elif ''Strobe'' in e and step % 2 == 0 %}{{ [255,255,255] }}{% elif ''Blinder'' in e and step % 4 == 0 %}{{ [255,180,90]
                    }}{% else %}{{ c.pal[3] }}{% endif %}', bri: '{% set e = states(''input_select.sono_effet'') %}{% set i = states(''input_number.sono_intensite'') | float(50) / 100 %}{% if ''Blackout'' in e and step % 2 == 0 %}1{% elif (''Strobe'' in e and step
                    % 2 == 0) or (''Blinder'' in e and step % 4 == 0) %}{{ [ (255 * i) | int, 1 ] | max }}{% else %}{{ [ (c.bri[3] * i) | round(0) | int, 1 ] | max }}{% endif %}', tr: '{% set e = states(''input_select.sono_effet'') %}{% if ''Strobe'' in e or ''Blackout''
                    in e %}0{% else %}{{ (beat * c.t) | round(2) }}{% endif %}'}
          - sequence:
            - {condition: template, value_template: '{{ 4 < n }}'}
            - variables: {grp: '{% set ns = namespace(l=[]) %}{% for j in range(lights | length) %}{% if ((step + (0 if c.sync is defined and c.sync else j)) % n) == 4 %}{% set ns.l = ns.l + [lights[j]] %}{% endif %}{% endfor %}{{ ns.l }}'}
            - {condition: template, value_template: '{{ grp | length > 0 }}'}
            - action: script.turn_on
              continue_on_error: true
              target: {entity_id: script.sono_appliquer}
              data:
                variables: {ents: '{{ grp }}', rgb: '{% set e = states(''input_select.sono_effet'') %}{% if ''Black light'' in e %}{{ [70,0,255] }}{% elif ''Strobe'' in e and step % 2 == 0 %}{{ [255,255,255] }}{% elif ''Blinder'' in e and step % 4 == 0 %}{{ [255,180,90]
                    }}{% else %}{{ c.pal[4] }}{% endif %}', bri: '{% set e = states(''input_select.sono_effet'') %}{% set i = states(''input_number.sono_intensite'') | float(50) / 100 %}{% if ''Blackout'' in e and step % 2 == 0 %}1{% elif (''Strobe'' in e and step
                    % 2 == 0) or (''Blinder'' in e and step % 4 == 0) %}{{ [ (255 * i) | int, 1 ] | max }}{% else %}{{ [ (c.bri[4] * i) | round(0) | int, 1 ] | max }}{% endif %}', tr: '{% set e = states(''input_select.sono_effet'') %}{% if ''Strobe'' in e or ''Blackout''
                    in e %}0{% else %}{{ (beat * c.t) | round(2) }}{% endif %}'}
          - sequence:
            - {condition: template, value_template: '{{ 5 < n }}'}
            - variables: {grp: '{% set ns = namespace(l=[]) %}{% for j in range(lights | length) %}{% if ((step + (0 if c.sync is defined and c.sync else j)) % n) == 5 %}{% set ns.l = ns.l + [lights[j]] %}{% endif %}{% endfor %}{{ ns.l }}'}
            - {condition: template, value_template: '{{ grp | length > 0 }}'}
            - action: script.turn_on
              continue_on_error: true
              target: {entity_id: script.sono_appliquer}
              data:
                variables: {ents: '{{ grp }}', rgb: '{% set e = states(''input_select.sono_effet'') %}{% if ''Black light'' in e %}{{ [70,0,255] }}{% elif ''Strobe'' in e and step % 2 == 0 %}{{ [255,255,255] }}{% elif ''Blinder'' in e and step % 4 == 0 %}{{ [255,180,90]
                    }}{% else %}{{ c.pal[5] }}{% endif %}', bri: '{% set e = states(''input_select.sono_effet'') %}{% set i = states(''input_number.sono_intensite'') | float(50) / 100 %}{% if ''Blackout'' in e and step % 2 == 0 %}1{% elif (''Strobe'' in e and step
                    % 2 == 0) or (''Blinder'' in e and step % 4 == 0) %}{{ [ (255 * i) | int, 1 ] | max }}{% else %}{{ [ (c.bri[5] * i) | round(0) | int, 1 ] | max }}{% endif %}', tr: '{% set e = states(''input_select.sono_effet'') %}{% if ''Strobe'' in e or ''Blackout''
                    in e %}0{% else %}{{ (beat * c.t) | round(2) }}{% endif %}'}
        - delay: {seconds: '{{ [ (t0 + step * c.beats * beat) - as_timestamp(now()), 0.05 ] | max | round(2) }}'}
automation:
- id: sono_lumieres_selection
  alias: '🎵 Lumières sono : lancer/arrêter selon le style choisi'
  mode: restart
  triggers:
  - {trigger: state, entity_id: input_select.sono_lumieres}
  actions:
  - choose:
    - conditions:
      - {condition: state, entity_id: input_select.sono_lumieres, state: — Arrêt —}
      sequence:
      - action: script.turn_off
        target: {entity_id: script.sono_lumieres}
    default:
    - action: input_number.set_value
      target: {entity_id: input_number.sono_tempo}
      data: {value: '{{ {''🔊 Hard techno'': 150, ''🎛️ Tech house'': 125, ''🥁 Afro house'': 120, ''🌙 Ambiance chill'': 90, ''📼 Rétro techno'': 135, ''💜 RnB'': 90, ''🕹️ Années 80'': 120, ''⚡ Universel · Strobe blanc'': 128, ''🔴 Universel · Bleu nuit & rouge'': 128,
          ''🟡 Universel · Jaune & bleu ciel'': 128, ''🟣 Universel · Magenta & cyan'': 128, ''🟢 Universel · Laser vert & UV'': 128, ''🟠 Universel · Ambre & violet'': 128, ''❤️ Universel · Pulse rouge'': 128, ''❄️ Universel · Flash blanc & bleu'': 128, ''🌈 Universel
          · Chase arc-en-ciel'': 128, ''🔥 Universel · Feu & or'': 128, ''🌊 Universel · Océan profond'': 128, ''🏰 Show · Tomorrowland main stage'': 128, ''🖤 Show · Afterlife (blanc glacial & rouge)'': 124, ''🧊 Show · Anyma cyber néon'': 126, ''🔺 Show · Daft Punk
          pyramide'': 124, ''💙 Show · Swedish House Mafia'': 128, ''🦇 Show · Berghain (rouge sombre)'': 135, ''🟥 Show · Hardstyle Defqon (rouge & blanc)'': 150, ''🎆 Show · Coldplay bracelets'': 120, ''🌅 Show · Ibiza sunset'': 118}[trigger.to_state.state] }}'}
    - action: script.turn_on
      target: {entity_id: script.sono_lumieres}
