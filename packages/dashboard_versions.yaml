# packages/dashboard_versions.yaml — Documentation
#
# ## Rôle du fichier
# Fichier d'infrastructure du système de versioning automatique (voir le README.md, section "Versioning automatique").
# Il ne contient aucune logique métier : il expose simplement le contenu de /config/versions.json (généré et mis à jour tout seul
# par le hook git post-commit) comme un capteur Home Assistant, pour que les dashboards puissent afficher la version
# de chaque fichier dont ils dépendent dans leur footer.
#
# ## Entité créée
# - `sensor.versions_config_ha` ("Versions Config HA") : capteur `command_line` qui exécute `cat /config/versions.json`.
#   - `value_template` : nombre de caractères du JSON.
#   - `json_attributes_path: "$"` : expose tout le JSON à la racine comme attributs.
#   - `json_attributes` : liste des clés extraites, une par fichier suivi. Chaque attribut est un objet {version, last_change, last_update}.
#
# ## Comment c'est utilisé
# Dans un dashboard, un footer affiche la version d'un fichier via un template du type :
# {{ state_attr('sensor.versions_config_ha', '.storage/lovelace.1_streaming').version }}
#
# ## Comment modifier
# | Je veux... | Je fais... |
# | Suivre un nouveau fichier/dashboard | Ajouter son chemin relatif à la liste json_attributes |
# | Ne plus suivre un fichier | Retirer son chemin de json_attributes |
# | Changer la source des données | Ne pas éditer ce fichier à la main — versions.json est régénéré par le hook git |
#
# ## Piège connu
# Ce fichier ne doit jamais être édité pour changer une version manuellement.
#
# [AUTO-VERSION] v0.2.0 | 20/09/2026 13:25 | ajout de packages/matteo_logistique.yaml au suivi de versioning

# Capteur consolide de versionning (package HA)
# Lit versions.json, mis a jour automatiquement par le hook git post-commit.
# Un seul capteur ("Versions Config HA"), un attribut par fichier suivi.

command_line:
  - sensor:
      name: "Versions Config HA"
      unique_id: versions_config_ha
      command: "cat /config/versions.json"
      value_template: >-
        {{ value_json | length }}
      json_attributes_path: "$"
      json_attributes:
        - ".storage/lovelace.1_accueil"
        - ".storage/lovelace.1_courses"
        - ".storage/lovelace.1_eclairage"
        - ".storage/lovelace.1_energie"
        - ".storage/lovelace.1_flight_radar"
        - ".storage/lovelace.1_ma_maison"
        - ".storage/lovelace.1_meteo_belgique"
        - ".storage/lovelace.1_mon_confort"
        - ".storage/lovelace.1_pollution"
        - ".storage/lovelace.1_reseau_infra"
        - ".storage/lovelace.1_securite"
        - ".storage/lovelace.1_streaming"
        - ".storage/lovelace.1_taches"
        - ".storage/lovelace.boite_a_outils"
        - ".storage/lovelace.dashboard_calendrier"
        - ".storage/lovelace.dashboard_transversal"
        - "packages/chaudiere.yaml"
        - "packages/chauffage.yaml"
        - "packages/matteo/matteo_calendar.yaml"
        - "packages/matteo/matteo_maintenance.yaml"
        - "packages/matteo/matteo_notifications.yaml"
        - "packages/matteo/matteo_planning_actions.yaml"
        - "packages/matteo/matteo_planning_options.yaml"
        - "packages/matteo/matteo_planning_vue.yaml"
        - "packages/dashboard_versions.yaml"
        - "packages/horaires_pro_editeur.yaml"
        - "packages/horaires_pro.yaml"
        - "packages/taches_counters.yaml"
        - "packages/taches_kanban.yaml"
        - "automations.yaml"
        - "configuration.yaml"
        - "scenes.yaml"
        - "scripts.yaml"
        - "themes/Alpine-night.yaml"
        - "themes/large-sections.yaml"
        - "themes/amethyst-glow.yaml"
        - "themes/maison.yaml"
      scan_interval: 30
