# [AUTO-VERSION] v0.1.1 | 01/11/2026 17:17 | révision HA — rappel tâches (data.items), sono DJ (séquences exclusives), localisation (précision ancienne+nouvelle position), sondes Zigbee tolérance 6 h
# =====================================================================
# Coin DJ — interrupteur « Sono DJ » (barres + table de mixage + lecteurs + enceintes Adam)
# Allume / éteint dans le bon ordre pour éviter les clacs dans les enceintes :
#   marche : barres + mixage + lecteurs, 9 s, puis enceintes Adam  (script.demarrage_mixer)
#   arrêt  : enceintes Adam + barres, 6 s, puis mixage + lecteurs  (script.1786831774432)
# État = état réel des prises de la sono (groupe Hue light.sono).
# Doc : /config/packages/coin_dj.md
# =====================================================================

template:
  - switch:
      - name: "Sono DJ"
        unique_id: sono_dj_interrupteur
        icon: mdi:speaker
        state: "{{ is_state('light.sono', 'on') }}"
        # 01/11/2026 : chaque commande annule d'abord la séquence inverse en cours,
        # sinon 2 appuis rapprochés mélangeaient marche et arrêt (prises qui
        # s'allument/s'éteignent dans le désordre, enceintes Adam seules).
        turn_on:
          - action: script.turn_off
            target: { entity_id: script.1786831774432 }
          - action: script.demarrage_mixer
        turn_off:
          - action: script.turn_off
            target: { entity_id: script.demarrage_mixer }
          - action: script.1786831774432
