# Ambiances « light jockey » pour la pièce de vie + menu déroulant
# Zones : lustre SAM (3), vitrines (2), panneau mural, Ambilight, lustre salon, spots cuisine, évier, étagère café, spots coin DJ (scènes fête seulement)
input_select:
  ambiance_piece_de_vie:
    name: Ambiance pièce de vie
    icon: mdi:palette
    options: [— Choisir une ambiance —, 📺 Ambiance TV, 🍽️ Ambiance Souper, 🕯️ Ambiance Cocooning, 🎉 Ambiance Fête, 🎄 Ambiance Noël, 🎃 Ambiance Halloween, 💕 Ambiance Saint-Valentin, 🥂 Ambiance Nouvel An,
      🌅 Lever de soleil, ☀️ Brunch lumineux, 📖 Lecture au salon, 💻 Concentration, 🧹 Plein feu ménage, 🥂 Apéro, 🕯️ Dîner aux chandelles, 🔥 Feu de cheminée, 🎲 Soirée jeux, 🍿 Cinéma noir, 🧘 Zen spa, 🌙 Veilleuse
        nuit, 🌇 Coucher de soleil, ✨ Golden hour, 🌌 Aurore boréale, 🌊 Lagon tropical, 🌲 Forêt enchantée, 🏜️ Désert Sahara, 🌸 Printemps, 🍂 Automne cuivré, 🧊 Bleu polaire, 💜 Champ de lavande, 🌠 Nuit étoilée,
      🍹 Cocktail tropical, 🪩 Club boîte de nuit, 🕺 Disco 70s, 🌴 Synthwave Miami, 🎷 Lounge jazz, 🎤 Karaoké, 🟣 Rave UV, 🎰 Casino Las Vegas, ⚽ Diables Rouges, 🇧🇪 Fête nationale, 🎂 Anniversaire, 🎭 Carnaval,
      🐣 Pâques, ☘️ Saint-Patrick, 👻 Halloween fantôme, ❄️ Noël blanc, 💍 Romantique blanc & or]
    initial: — Choisir une ambiance —
script:
  ambiance_appliquer:
    alias: 🎨 Appliquer l'ambiance choisie
    icon: mdi:play
    mode: restart
    sequence:
    - variables: {sc: '{{ states.scene | selectattr(''attributes.friendly_name'',''eq'', states(''input_select.ambiance_piece_de_vie'')) | map(attribute=''entity_id'') | first | default('''') }}'}
    - {condition: template, value_template: '{{ sc != '''' }}'}
    - action: scene.turn_on
      target: {entity_id: '{{ sc }}'}
      data: {transition: 2}
  ambiance_eteindre:
    alias: ⏹ Éteindre la pièce de vie
    icon: mdi:lightbulb-off
    sequence:
    - action: light.turn_off
      target:
        entity_id: [light.coin_dj_sono_droite, light.coin_dj_sono_gauche, light.cuisine_etagere_cafe, light.cuisine_evier, light.cuisine_s_cuisine_1, light.cuisine_s_cuisine_2, light.cuisine_s_cuisine_3,
          light.cuisine_s_cuisine_4, light.salle_a_manger_lc, light.salle_a_manger_ld, light.salle_a_manger_lg, light.salle_a_manger_vit_d, light.salle_a_manger_vit_g, light.salon_ambilight_tv, light.salon_l_salon,
          light.salon_panneau_mural]
      data: {transition: 2}
    - action: input_select.select_option
      target: {entity_id: input_select.ambiance_piece_de_vie}
      data: {option: — Choisir une ambiance —}
automation:
- id: ambiance_piece_de_vie_selection
  alias: '🎨 Ambiance pièce de vie : appliquer au choix du menu'
  mode: restart
  triggers:
  - {trigger: state, entity_id: input_select.ambiance_piece_de_vie}
  conditions:
  - {condition: template, value_template: '{{ trigger.to_state.state != ''— Choisir une ambiance —'' }}'}
  actions:
  - {action: script.ambiance_appliquer}
