  - select:
      - name: "Four – Recette"
        unique_id: four_recette
        icon: mdi:book-open-variant
        state: >-
          {% set ns = namespace(l=[]) %}
          {% set R = state_attr('sensor.four_recettes', 'recettes') %}{% set R = (R | from_json) if R is string else (R or {}) %}{% for r in R.get(states('input_select.four_recette_categorie'), []) %}{% set ns.l = ns.l + [r[0]] %}{% endfor %}
          {% set s = states('input_text.four_recette_choisie') %}
          {{ s if s in ns.l else (ns.l[0] if ns.l else '—') }}
        options: >-
          {% set ns = namespace(l=[]) %}
          {% set R = state_attr('sensor.four_recettes', 'recettes') %}{% set R = (R | from_json) if R is string else (R or {}) %}{% for r in R.get(states('input_select.four_recette_categorie'), []) %}{% set ns.l = ns.l + [r[0]] %}{% endfor %}
          {{ ns.l if ns.l else ['—'] }}
        select_option:
          - action: input_text.set_value
            target:
              entity_id: input_text.four_recette_choisie
            data:
              value: "{{ option }}"

  # --- Carnet de cuisson : chaque cuisson terminée (≥ 3 min) est mémorisée (20 dernières)
  - triggers:
      - trigger: state
        entity_id: sensor.four_etat
        to: run
        id: debut
      - trigger: state
        entity_id: sensor.four_temperature_actuelle_de_la_cavite_du_four
        id: temp
      - trigger: state
        entity_id: sensor.four_etat
        from: run
        to:
          - finished
          - inactive
          - ready
        id: fin
    actions:
      - variables:
          cur: "{{ state_attr('sensor.four_carnet', 'liste') or [] }}"
          deb: "{{ state_attr('sensor.four_carnet', 'debut') or '' }}"
          tmax: "{{ state_attr('sensor.four_carnet', 'tmax') | int(0) }}"
          t: "{{ states('sensor.four_temperature_actuelle_de_la_cavite_du_four') | int(0) }}"
          en_cours: "{{ states('input_text.four_recette_en_cours') }}"
          prog: "{{ states('input_text.four_dernier_programme') }}"
    sensor:
      - name: "Four carnet"
        unique_id: four_carnet
        icon: mdi:notebook-outline
        state: >-
          {{ (state_attr('sensor.four_carnet', 'liste') or []) | count }}
        attributes:
          debut: "{{ now().isoformat() if trigger.id == 'debut' else deb }}"
          tmax: >-
            {% if trigger.id == 'debut' %}{{ t }}
            {% elif trigger.id == 'temp' and is_state('sensor.four_etat', 'run') %}{{ [tmax, t] | max }}
            {% else %}{{ tmax }}{% endif %}
          liste: >-
            {% if trigger.id == 'fin' and deb != '' %}
              {% set m = ((now() - as_datetime(deb)).total_seconds() / 60) | round(0) | int %}
              {% set n = en_cours.split('|')[0] if en_cours not in ['', 'unknown', 'unavailable'] else '' %}
              {% if m >= 3 %}{{ (cur + [{'d': deb, 'n': n, 'p': prog if prog.startswith('cooking_oven_program_') else '', 'm': m, 't': [tmax, t] | max, 'fin': trigger.to_state.state}])[-20:] }}
              {% else %}{{ cur }}{% endif %}
            {% else %}{{ cur }}{% endif %}

automation four_plus:
  # --- Rappel « retournez à mi-cuisson » pour les recettes qui le demandent
  - id: four_mi_cuisson
    alias: "🍳 Four – Retourner à mi-cuisson"
    mode: restart
    triggers:
      - trigger: state
        entity_id: sensor.four_etat
        to: run
        for:
          seconds: 30
    conditions:
      - condition: template
        value_template: "{{ (states('input_text.four_recette_en_cours') ~ '||').split('|')[1] == '1' }}"
    actions:
      - variables:
          nom: "{{ states('input_text.four_recette_en_cours').split('|')[0] }}"
          minutes: "{{ (states('input_text.four_recette_en_cours') ~ '||0').split('|')[2] | int(0) }}"
      - delay:
          minutes: "{{ [ (minutes / 2) | round(0) | int - 1, 1 ] | max }}"
      - condition: state
        entity_id: sensor.four_etat
        state: run
      - action: notify.mobile_app_samsung_greg
        continue_on_error: true
        data:
          title: "↩️ Mi-cuisson"
          message: "Retournez « {{ nom }} » pour une cuisson uniforme."
          data:
            tag: four
            channel: Four
            importance: high
            priority: high
            ttl: 0

  # --- Fin de cuisson : compteur de nettoyage + oubli de la recette en cours
  - id: four_fin_suivi
    alias: "🍳 Four – Suivi fin de cuisson / nettoyage"
    mode: queued
    triggers:
      - trigger: state
        entity_id: sensor.four_etat
        from: run
        to: finished
        id: fin
      - trigger: state
        entity_id: sensor.four_etat
        to: inactive
        id: arret
    actions:
      - if:
          - condition: trigger
            id: fin
        then:
          - action: counter.increment
            continue_on_error: true
            target:
              entity_id: counter.four_cuissons_nettoyage
          - if:
              - condition: numeric_state
                entity_id: counter.four_cuissons_nettoyage
                above: 14
            then:
              - action: notify.mobile_app_samsung_greg
                continue_on_error: true
                data:
                  title: "🧽 Nettoyage du four"
                  message: "{{ states('counter.four_cuissons_nettoyage') }} cuissons depuis le dernier nettoyage : pensez à lancer un nettoyage (sur le four)."
                  data:
                    tag: four_nettoyage
                    channel: Four
      - delay:
          seconds: 15
      - action: input_text.set_value
        target:
          entity_id: input_text.four_recette_en_cours
        data:
          value: ""
