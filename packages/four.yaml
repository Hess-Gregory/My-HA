 min sous alu avant de trancher.~Grille niveau 2, lèchefrite dessous.","mdi:food-steak"],["Côte de bœuf (finition)","heating_mode_hot_air_grilling",220,12,1,1,"Saisissez à la poêle, finissez au four ; reposez 10 min.~Grille au niveau 3.","mdi:food-steak"],["Boulettes au four","heating_mode_hot_air",190,25,0,1,"Formez des boulettes régulières.~Plaque au niveau 2.","mdi:circle-multiple"],["Bœuf cuisson lente","heating_mode_slow_cook",85,240,0,0,"Saisissez la pièce avant ; cuisson longue et douce.~Plat au niveau 2.","mdi:pot-steam"],["Pain de viande","heating_mode_top_bottom_heating",180,55,0,0,"Moule à cake ; laissez reposer 10 min.~Moule au niveau 2.","mdi:food"]],"🐖 Porc":[["Rôti de porc (1 kg)","heating_mode_hot_air",180,75,0,0,"Moutarde, herbes ; arrosez à mi-cuisson.~Plat au niveau 2.","mdi:pig"],["Côtes de porc","heating_mode_hot_air_grilling",200,25,0,1,"Marinade ou huile et épices.~Grille au niveau 3, lèchefrite dessous.","mdi:pig"],["Travers de porc (ribs)","heating_mode_hot_air",160,90,0,0,"Couverts d'alu 60 min, puis sauce barbecue à découvert.~Plat au niveau 2.","mdi:pig"],["Filet mignon","heating_mode_hot_air",190,30,0,0,"Saisissez à la poêle avant ; reposez 5 min.~Plat au niveau 2.","mdi:pig"],["Saucisses de campagne (vapeur → gril)","steam_modes_steam",100,15,0,0,"Réservoir rempli ; piquez légèrement. Démarre directement.~Grille niveau 2, lèchefrite dessous.","mdi:sausage","heating_mode_hot_air_grilling",220,15],["Chipolatas / merguez","heating_mode_hot_air_grilling",220,18,0,1,"Espacées sur la grille.~Grille au niveau 3, lèchefrite dessous.","mdi:sausage"],["Jambon à l'os (réchauffer)","heating_mode_hot_air",160,30,0,0,"Couvert d'alu pour ne pas dessécher.~Plat au niveau 2.","mdi:pig"]],"🐑 Agneau & veau":[["Gigot d'agneau (1,5 kg)","heating_mode_hot_air",180,60,1,0,"Piqué d'ail, romarin ; reposez 10 min.~Grille niveau 2, lèchefrite dessous.","mdi:sheep"],["Épaule d'agneau confite","heating_mode_slow_cook",120,240,0,0,"Couverte, avec ail et un peu de bo