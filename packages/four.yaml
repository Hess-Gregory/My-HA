# [AUTO-VERSION] v0.2.0 | 01/10/2026 18:41 | four 2 etapes et reglages en cuisson, journal pollution, incendie cave, clim Eurom, telecommandes
# =====================================================================
# Four Siemens HS736G3B1 (Home Connect) – alertes, démarrage programmé,
# sécurité porte / absence, actions depuis la notification du téléphone.
# Scripts associés (scripts.yaml, éditables dans l'UI) :
#   script.four_preparer, script.four_demarrer,
#   script.four_fav_ajouter, script.four_fav_supprimer
# Doc : /config/packages/four.md
# =====================================================================

input_text:
  four_dernier_programme:
    name: "Four – Dernier programme lancé"
    icon: mdi:history
    max: 120
  four_recette_choisie:
    name: "Four – Recette choisie"
    icon: mdi:book-open-variant
    max: 120
  four_recette_en_cours:
    name: "Four – Recette en cours (nom|retourner|minutes)"
    icon: mdi:chef-hat
    max: 255

counter:
  four_cuissons_nettoyage:
    name: "Four – Cuissons depuis le dernier nettoyage"
    icon: mdi:spray-bottle
    step: 1

automation:
  # --- Le four affiche un message (réservoir d'eau, trappe, confirmation…) et fin de programme
  - id: four_alertes_etat
    alias: "🍳 Four – Action requise / C'est prêt"
    description: "Basé sur sensor.four_etat (les capteurs d'évènement Home Connect ne remontent pas sur ce four)."
    mode: queued
    triggers:
      - trigger: state
        entity_id: sensor.four_etat
        to: actionrequired
        id: action
      - trigger: state
        entity_id: sensor.four_etat
        to: finished
        id: fin
      - trigger: state
        entity_id: sensor.four_programme_termine
        to: present
        id: fin
    actions:
      - choose:
          - conditions:
              - condition: trigger
                id: action
            sequence:
              - action: notify.mobile_app_samsung_greg
                continue_on_error: true
                data:
                  title: "🙋 Le four demande une action"
                  message: "Regardez l'écran du four : remplir le réservoir d'eau, fermer la trappe ou confirmer une étape."
                  data:
                    tag: four
                    channel: Four
                    importance: high
                    priority: high
                    ttl: 0
              - action: persistent_notification.create
                data:
                  notification_id: four
                  title: "🙋 Le four demande une action"
                  message: "Regardez l'écran du four : réservoir d'eau, trappe ou confirmation."
          - conditions:
              - condition: trigger
                id: fin
            sequence:
              - action: notify.mobile_app_samsung_greg
                continue_on_error: true
                data:
                  title: "✅ C'est prêt"
                  message: "Le programme du four est terminé ({{ states('sensor.four_temperature_actuelle_de_la_cavite_du_four') }} °C)."
                  data:
                    tag: four
                    channel: Four
                    importance: high
                    priority: high
                    ttl: 0
                    actions:
                      - action: FOUR_PLUS10
                        title: "+10 min"
                      - action: FOUR_CHAUD
                        title: "Maintenir au chaud"
                      - action: FOUR_OFF
                        title: "Éteindre"
              - action: persistent_notification.create
                data:
                  notification_id: four
                  title: "✅ C'est prêt"
                  message: "Le programme du four est terminé."

  # --- Mémorise le dernier programme lancé (pour « +10 min » après la fin)
  - id: four_memo_programme
    alias: "🍳 Four – Mémoriser le programme en cours"
    mode: restart
    triggers:
      - trigger: state
        entity_id: select.four_programme_actif
    conditions:
      - condition: template
        value_template: "{{ trigger.to_state.state.startswith('cooking_oven_program_') }}"
    actions:
      - action: input_text.set_value
        target:
          entity_id: input_text.four_dernier_programme
        data:
          value: "{{ trigger.to_state.state }}"

  # --- Température atteinte
  - id: four_chaud
    alias: "🍳 Four – Préchauffage atteint"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: template
        value_template: >-
          {% set t = states('sensor.four_temperature_actuelle_de_la_cavite_du_four') | float(0) %}
          {% set c = states('number.cuisine_four_temperature_de_consigne') | float(0) %}
          {{ is_state('sensor.four_etat', 'run') and c > 50 and t >= c - 3 }}
      - trigger: state
        entity_id:
          - sensor.four_prechauffage_termine
          - sensor.four_prechauffage_normal_termine
        to: present
    conditions:
      - condition: template
        value_template: >-
          {{ this.attributes.last_triggered is none
             or (now() - this.attributes.last_triggered).total_seconds() > 1800 }}
    actions:
      - action: notify.mobile_app_samsung_greg
        continue_on_error: true
        data:
          title: "🔥 Le four est chaud"
          message: >-
            {% set n = states('input_text.four_recette_en_cours').split('|')[0] %}
            {{ states('sensor.four_temperature_actuelle_de_la_cavite_du_four') }} °C atteints : {{ 'enfournez maintenant « ' ~ n ~ ' ».' if n not in ['', 'unknown', 'unavailable'] else 'vous pouvez enfourner.' }}
          data:
            tag: four
            channel: Four
            importance: high
            priority: high
            ttl: 0
      - action: persistent_notification.create
        data:
          notification_id: four
          title: "🔥 Le four est chaud"
          message: "{{ states('sensor.four_temperature_actuelle_de_la_cavite_du_four') }} °C atteints."

  # --- Minuterie
  - id: four_reveil
    alias: "🍳 Four – Minuterie écoulée"
    mode: single
    triggers:
      - trigger: state
        entity_id: sensor.four_reveil_depasse
        to: present
    actions:
      - action: notify.mobile_app_samsung_greg
        continue_on_error: true
        data:
          title: "⏰ Minuterie du four"
          message: "La minuterie est écoulée."
          data:
            tag: four
            channel: Four
            importance: high
            priority: high
            ttl: 0

  # --- Boutons de la notification « C'est prêt »
  - id: four_notification_actions
    alias: "🍳 Four – Actions depuis la notification"
    mode: single
    triggers:
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: FOUR_PLUS10
        id: plus10
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: FOUR_CHAUD
        id: chaud
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: FOUR_OFF
        id: eteindre
    actions:
      - choose:
          - conditions:
              - condition: trigger
                id: plus10
            sequence:
              - action: script.four_preparer
                data:
                  program: >-
                    {% set p = states('input_text.four_dernier_programme') %}
                    {{ p if p.startswith('cooking_oven_program_') else states('select.four_programme_selectionne') }}
                  duree: 10
              - action: script.four_demarrer
          - conditions:
              - condition: trigger
                id: chaud
            sequence:
              - action: script.four_preparer
                data:
                  program: heating_mode_keep_warm
                  temperature: 70
              - action: script.four_demarrer
          - conditions:
              - condition: trigger
                id: eteindre
            sequence:
              - action: switch.turn_off
                target:
                  entity_id: switch.four_alimentation

  # --- Démarrer à l'heure choisie
  - id: four_demarrage_programme
    alias: "🍳 Four – Démarrage à l'heure choisie"
    mode: single
    triggers:
      - trigger: time
        at: input_datetime.four_demarrer_a
    conditions:
      - condition: state
        entity_id: input_boolean.four_demarrage_programme
        state: "on"
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.four_demarrage_programme
      - if:
          - condition: state
            entity_id: binary_sensor.four_demarrage_a_distance
            state: "on"
        then:
          - action: script.four_demarrer
          - action: notify.mobile_app_samsung_greg
            continue_on_error: true
            data:
              title: "▶️ Four démarré"
              message: "Le four a démarré à l'heure prévue."
              data:
                tag: four
                channel: Four
        else:
          - action: notify.mobile_app_samsung_greg
            continue_on_error: true
            data:
              title: "⚠️ Four non démarré"
              message: "Le démarrage à distance n'est pas autorisé sur le four : activez-le sur l'appareil."
              data:
                tag: four
                channel: Four
                importance: high
                priority: high

  # --- Porte ouverte alors que le four est chaud
  - id: four_porte_ouverte_chaud
    alias: "🍳 Four – Porte ouverte four chaud"
    mode: single
    triggers:
      - trigger: state
        entity_id: sensor.four_porte
        to: open
        for:
          minutes: 2
    conditions:
      - condition: numeric_state
        entity_id: sensor.four_temperature_actuelle_de_la_cavite_du_four
        above: 80
    actions:
      - action: notify.mobile_app_samsung_greg
        continue_on_error: true
        data:
          title: "🚪 Porte du four ouverte"
          message: "La porte est ouverte depuis 2 min et le four est à {{ states('sensor.four_temperature_actuelle_de_la_cavite_du_four') }} °C."
          data:
            tag: four_porte
            channel: Four
            importance: high
            priority: high
            ttl: 0

  # --- Plus personne à la maison : on éteint le four
  - id: four_absence
    alias: "🍳 Four – Éteindre si tout le monde est parti"
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: zone.home
        below: 1
        for:
          minutes: 5
    conditions:
      - condition: state
        entity_id: switch.four_alimentation
        state: "on"
    actions:
      - action: switch.turn_off
        target:
          entity_id: switch.four_alimentation
        continue_on_error: true
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.four_demarrage_programme
      - action: notify.mobile_app_samsung_greg
        continue_on_error: true
        data:
          title: "🛑 Four éteint"
          message: "Plus personne à la maison : le four a été éteint par sécurité."
          data:
            tag: four
            channel: Four
            importance: high
            priority: high

# --- Plat favori choisi (liste déroulante construite depuis input_text.four_favori_1…16)
input_number:
  four_favori_choisi:
    name: "Four – Favori choisi"
    icon: mdi:star
    min: 1
    max: 16
    step: 1
    mode: box

template:
  - select:
      - name: "Four – Plat favori"
        unique_id: four_plat_favori
        icon: mdi:star
        state: >-
          {% set i = states('input_number.four_favori_choisi') | int(1) %}
          {{ (states('input_text.four_favori_' ~ i) | default('')).split('|')[0] }}
        options: >-
          {% set ns = namespace(o=[]) %}
          {% for i in range(1, 17) %}
            {% set v = states('input_text.four_favori_' ~ i) %}
            {% if v not in ['', 'unknown', 'unavailable'] %}{% set ns.o = ns.o + [v.split('|')[0]] %}{% endif %}
          {% endfor %}
          {{ ns.o if ns.o else ['—'] }}
        select_option:
          - action: input_number.set_value
            target:
              entity_id: input_number.four_favori_choisi
            data:
              value: >-
                {% set ns = namespace(s=1) %}
                {% for i in range(1, 17) %}
                  {% if states('input_text.four_favori_' ~ i).split('|')[0] == option %}{% set ns.s = i %}{% endif %}
                {% endfor %}
                {{ ns.s }}

