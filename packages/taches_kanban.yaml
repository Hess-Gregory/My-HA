  # SANDRINE
  # ===========================================================================

  - resource: "https://api.todoist.com/api/v1/projects/6hJq6fXqpFc5ppCC/full"
    method: GET
    headers:
      Authorization: !secret todoist_api_token
    scan_interval: 300
    sensor:
      - name: "Kanban Sandrine Projet"
        unique_id: kanban_sandrine_projet
        value_template: "{{ value_json.project.name if value_json is defined and value_json.project is defined else 'indisponible' }}"
        json_attributes:
          - project
