  - resource: "https://api.todoist.com/api/v1/tasks?project_id=6hJq6fXqpFc5ppCC&limit=200"
    method: GET
    headers:
      Authorization: !secret todoist_api_token
    scan_interval: 300
    sensor:
      - name: "Kanban Sandrine"
        unique_id: kanban_sandrine
        value_template: "{{ value_json.results | length if value_json is defined and value_json.results is defined else 0 }}"
        json_attributes:
          - results
          - next_cursor

  # ===========================================================================
  # FAMILLE
  # ===========================================================================

  - resource: "https://api.todoist.com/api/v1/projects/6hW4vXG7V9GffH67/full"
    method: GET
    headers:
      Authorization: !secret todoist_api_token
    scan_interval: 300
    sensor:
      - name: "Kanban Famille Projet"
        unique_id: kanban_famille_projet
        value_template: "{{ value_json.project.name if value_json is defined and value_json.project is defined else 'indisponible' }}"
        json_attributes:
          - project
          - sections

  - resource: "https://api.todoist.com/api/v1/tasks?project_id=6hW4vXG7V9GffH67&limit=200"
    method: GET
    headers:
      Authorization: !secret todoist_api_token
    scan_interval: 300
    sensor:
      - name: "Kanban Famille"
        unique_id: kanban_famille
