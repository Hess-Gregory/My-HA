    headers:
      Authorization: !secret todoist_api_token
    scan_interval: 300
    sensor:
      - name: "Kanban Gregory Projet"
        unique_id: kanban_gregory_projet
        value_template: "{{ value_json.project.name if value_json is defined and value_json.project is defined else 'indisponible' }}"
        json_attributes:
          - project
          - sections

  - resource: "https://api.todoist.com/api/v1/tasks?project_id=6hJq6cQ4hX7Q8jQF&limit=200"
    method: GET
    headers:
      Authorization: !secret todoist_api_token
    scan_interval: 300
    sensor:
