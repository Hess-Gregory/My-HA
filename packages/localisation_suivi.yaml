# [AUTO-VERSION] v0.2.0 | 08/10/2026 18:13 | heure de depart et direction
# Localisation : période d'historique + actualisation des positions
input_select:
  localisation_auto:
    name: "Localisation – actualisation automatique"
    icon: mdi:timer-sync-outline
    options: ["Désactivée", "5 min", "10 min", "15 min", "30 min"]
    initial: "10 min"
  localisation_periode:
    name: "Localisation – période"
    icon: mdi:history
    options: ["5 min", "1 h", "6 h", "24 h", "7 jours"]

script:
  localisation_actualiser:
    alias: "📍 Localisation – actualiser les positions"
    icon: mdi:crosshairs-gps
    mode: single
    sequence:
      - parallel:
          - action: notify.mobile_app_samsung_greg
            continue_on_error: true
            data: { message: request_location_update }
          - action: notify.mobile_app_sandrine_smartphone
            continue_on_error: true
            data: { message: request_location_update }
          - action: notify.mobile_app_iphone
            continue_on_error: true
            data: { message: request_location_update }

# Suivi des déplacements : dernier lieu quitté, heure de départ, position précédente (direction)
template:
  - trigger:
      - trigger: state
        entity_id: [person.greg, person.sandrine, person.matteo]
        not_to: [unknown, unavailable]
    sensor:
      - name: "Localisation derniers lieux"
        unique_id: localisation_derniers_lieux
        icon: mdi:map-marker-path
        state: "{{ now().isoformat() }}"
        attributes:
          greg: "{%- set o = this.attributes.get('greg') if this.attributes.get('greg') is mapping else {} -%}{%- if trigger.entity_id == 'person.greg' -%}{%- set f = trigger.from_state -%}{%- set t = trigger.to_state -%}{%- set part = t.state == 'not_home' and f.state not in ['not_home', 'unknown', 'unavailable'] -%}{%- set bouge = f.attributes.latitude is defined and t.attributes.latitude is defined and (f.attributes.latitude != t.attributes.latitude or f.attributes.longitude != t.attributes.longitude) -%}{{ {'lieu': f.state if part else o.get('lieu', ''), 'depart': now().isoformat() if part else o.get('depart', ''), 'plat': f.attributes.latitude if bouge else o.get('plat'), 'plon': f.attributes.longitude if bouge else o.get('plon')} }}{%- else -%}{{ o }}{%- endif -%}"
          sandrine: "{%- set o = this.attributes.get('sandrine') if this.attributes.get('sandrine') is mapping else {} -%}{%- if trigger.entity_id == 'person.sandrine' -%}{%- set f = trigger.from_state -%}{%- set t = trigger.to_state -%}{%- set part = t.state == 'not_home' and f.state not in ['not_home', 'unknown', 'unavailable'] -%}{%- set bouge = f.attributes.latitude is defined and t.attributes.latitude is defined and (f.attributes.latitude != t.attributes.latitude or f.attributes.longitude != t.attributes.longitude) -%}{{ {'lieu': f.state if part else o.get('lieu', ''), 'depart': now().isoformat() if part else o.get('depart', ''), 'plat': f.attributes.latitude if bouge else o.get('plat'), 'plon': f.attributes.longitude if bouge else o.get('plon')} }}{%- else -%}{{ o }}{%- endif -%}"
          matteo: "{%- set o = this.attributes.get('matteo') if this.attributes.get('matteo') is mapping else {} -%}{%- if trigger.entity_id == 'person.matteo' -%}{%- set f = trigger.from_state -%}{%- set t = trigger.to_state -%}{%- set part = t.state == 'not_home' and f.state not in ['not_home', 'unknown', 'unavailable'] -%}{%- set bouge = f.attributes.latitude is defined and t.attributes.latitude is defined and (f.attributes.latitude != t.attributes.latitude or f.attributes.longitude != t.attributes.longitude) -%}{{ {'lieu': f.state if part else o.get('lieu', ''), 'depart': now().isoformat() if part else o.get('depart', ''), 'plat': f.attributes.latitude if bouge else o.get('plat'), 'plon': f.attributes.longitude if bouge else o.get('plon')} }}{%- else -%}{{ o }}{%- endif -%}"

automation:
  - id: localisation_actualisation_auto
    alias: "📍 Localisation : actualisation automatique des positions"
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: "/5"
    conditions:
      - condition: template
        value_template: >-
          {% set i = states('input_select.localisation_auto') | replace(' min', '') %}
          {{ i | is_number and now().minute % (i | int) == 0 }}
    actions:
      - action: script.localisation_actualiser
