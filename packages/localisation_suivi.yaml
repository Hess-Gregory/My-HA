# [AUTO-VERSION] v0.0.1 | 08/10/2026 18:04 | restauration du package localisation ecrase, ajouts dans localisation_suivi
# Localisation : période d'historique + actualisation des positions
input_select:
  localisation_periode:
    name: "Localisation – période"
    icon: mdi:history
    options: ["5 min", "1 h", "6 h", "24 h", "7 jours"]

script:
  localisation_actualiser:
    alias: "📍 Localisation – actualiser les positions"
    icon: mdi:crosshairs-gps
    mode: single
    sequence:
      - parallel:
          - action: notify.mobile_app_samsung_greg
            continue_on_error: true
            data: { message: request_location_update }
          - action: notify.mobile_app_sandrine_smartphone
            continue_on_error: true
            data: { message: request_location_update }
          - action: notify.mobile_app_iphone
            continue_on_error: true
            data: { message: request_location_update }

# Mémorise le dernier lieu quitté par chaque personne (pour « en déplacement entre X et Y »)
template:
  - trigger:
      - trigger: state
        entity_id: [person.greg, person.sandrine, person.matteo]
        not_to: [unknown, unavailable]
    sensor:
      - name: "Localisation derniers lieux"
        unique_id: localisation_derniers_lieux
        icon: mdi:map-marker-path
        state: "{{ now().isoformat() }}"
        attributes:
          greg: >-
            {% if trigger.entity_id == 'person.greg' and trigger.to_state.state == 'not_home' and trigger.from_state.state not in ['not_home','unknown','unavailable'] %}{{ trigger.from_state.state }}{% else %}{{ this.attributes.get('greg', '') }}{% endif %}
          sandrine: >-
            {% if trigger.entity_id == 'person.sandrine' and trigger.to_state.state == 'not_home' and trigger.from_state.state not in ['not_home','unknown','unavailable'] %}{{ trigger.from_state.state }}{% else %}{{ this.attributes.get('sandrine', '') }}{% endif %}
          matteo: >-
            {% if trigger.entity_id == 'person.matteo' and trigger.to_state.state == 'not_home' and trigger.from_state.state not in ['not_home','unknown','unavailable'] %}{{ trigger.from_state.state }}{% else %}{{ this.attributes.get('matteo', '') }}{% endif %}
