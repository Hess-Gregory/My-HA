template:
  - sensor:
      # ========================================================
      # VERSION HORAIRES PRO
      # ========================================================

      - name: "Horaires Pro Version"
        unique_id: horaires_pro_version
        icon: mdi:source-branch
        state: "2.4.0"
        attributes:
          version: "2.4.0"
          date: "2026-09-17"
          heure: "00:00"
          fuseau: "Europe/Brussels"
          affichage: "v2.4.0 · 17/09/2026"
          modification: "Panneau Détails & Édition complet (voir/modifier/supprimer une tâche, durée libre à la création) + libellés de type alignés entre blocs et formulaire"

      # ========================================================
      # NOMBRE TOTAL DE BLOCS
      # ========================================================

      - name: "Horaires Pro Nombre de Blocs"
        unique_id: horaires_pro_nombre_blocs
        icon: mdi:calendar-clock
        state: >-
          {{ state_attr('sensor.horaires_pro_taches', 'results')
             | default([], true)
             | length }}

      # ========================================================
      # GREGORY — TRAVAIL EFFECTIF
      # ========================================================

      - name: "Horaires Pro Heures Travail Gregory"
        unique_id: horaires_pro_heures_travail_gregory
        icon: mdi:clock-check-outline
        unit_of_measurement: "min"
        state: >-
          {% set blocs = state_attr('sensor.horaires_pro_blocs_gregory', 'blocs')
             | default([], true) %}

          {% set ns = namespace(total=0) %}

          {% for bloc in blocs %}
            {% if bloc.label != 'G_Heures_Supp_Prestees'
                  and bloc.label != 'G_Heures_Supp_Deduites' %}
              {% set ns.total = ns.total + (bloc.effective_minutes | int(0)) %}
            {% endif %}
          {% endfor %}

          {{ ns.total }}

        attributes:
          heures: >-
            {% set blocs = state_attr('sensor.horaires_pro_blocs_gregory', 'blocs')
               | default([], true) %}
            {% set ns = namespace(total=0) %}

            {% for bloc in blocs %}
              {% if bloc.label != 'G_Heures_Supp_Prestees'
                    and bloc.label != 'G_Heures_Supp_Deduites' %}
                {% set ns.total = ns.total + (bloc.effective_minutes | int(0)) %}
              {% endif %}
            {% endfor %}

            {{ (ns.total / 60) | round(2) }}

          affichage: >-
            {% set blocs = state_attr('sensor.horaires_pro_blocs_gregory', 'blocs')
               | default([], true) %}
            {% set ns = namespace(total=0) %}

            {% for bloc in blocs %}
              {% if bloc.label != 'G_Heures_Supp_Prestees'
                    and bloc.label != 'G_Heures_Supp_Deduites' %}
                {% set ns.total = ns.total + (bloc.effective_minutes | int(0)) %}
              {% endif %}
            {% endfor %}

            {{ (ns.total // 60) | int }}h{{ '%02d' | format(ns.total % 60) }}

      # ========================================================
      # GREGORY — SOLDE HEURES SUPPLÉMENTAIRES
      # ========================================================

      - name: "Horaires Pro Solde Heures Supplémentaires"
        unique_id: horaires_pro_solde_heures_supplementaires
        icon: mdi:clock-plus-outline
        unit_of_measurement: "min"
        state: >-
          {% set blocs = state_attr('sensor.horaires_pro_blocs_gregory', 'blocs')
             | default([], true) %}

          {% set ns = namespace(solde=0) %}

          {% for bloc in blocs %}
            {% if bloc.label == 'G_Heures_Supp_Prestees' %}
              {% set ns.solde = ns.solde + (bloc.duration_minutes | int(0)) %}
            {% elif bloc.label == 'G_Heures_Supp_Deduites' %}
              {% set ns.solde = ns.solde - (bloc.duration_minutes | int(0)) %}
            {% endif %}
          {% endfor %}

          {{ ns.solde }}

        attributes:
          heures: >-
            {% set blocs = state_attr('sensor.horaires_pro_blocs_gregory', 'blocs')
               | default([], true) %}
            {% set ns = namespace(solde=0) %}

            {% for bloc in blocs %}
              {% if bloc.label == 'G_Heures_Supp_Prestees' %}
                {% set ns.solde = ns.solde + (bloc.duration_minutes | int(0)) %}
              {% elif bloc.label == 'G_Heures_Supp_Deduites' %}
                {% set ns.solde = ns.solde - (bloc.duration_minutes | int(0)) %}
              {% endif %}
            {% endfor %}

            {{ (ns.solde / 60) | round(2) }}

          affichage: >-
            {% set blocs = state_attr('sensor.horaires_pro_blocs_gregory', 'blocs')
               | default([], true) %}
            {% set ns = namespace(solde=0) %}

            {% for bloc in blocs %}
              {% if bloc.label == 'G_Heures_Supp_Prestees' %}
                {% set ns.solde = ns.solde + (bloc.duration_minutes | int(0)) %}
              {% elif bloc.label == 'G_Heures_Supp_Deduites' %}
                {% set ns.solde = ns.solde - (bloc.duration_minutes | int(0)) %}
              {% endif %}
            {% endfor %}

            {% set minutes = ns.solde %}
            {% set signe = '+' if minutes > 0 else '-' if minutes < 0 else '' %}
            {% set absolu = minutes | abs %}

            {{ signe }}{{ (absolu // 60) | int }}h{{ '%02d' | format(absolu % 60) }}

      # ========================================================
      # GREGORY — ONVA
      # ========================================================

      - name: "Horaires Pro ONVA Gregory"
        unique_id: horaires_pro_onva_gregory
        icon: mdi:beach
        unit_of_measurement: "blocs"
        state: >-
          {% set blocs = state_attr('sensor.horaires_pro_blocs_gregory', 'blocs')
             | default([], true) %}

          {{ blocs
             | selectattr('label', 'equalto', 'G_Vac_ONVA')
             | list
             | length }}

        attributes:
          utilise: >-
            {% set blocs = state_attr('sensor.horaires_pro_blocs_gregory', 'blocs')
               | default([], true) %}

            {{ blocs
               | selectattr('label', 'equalto', 'G_Vac_ONVA')
               | list
               | length }}

      # ========================================================
      # GREGORY — ADV MENSUELS
      # ========================================================

      - name: "Horaires Pro ADV Mensuels Gregory"
        unique_id: horaires_pro_adv_mensuels_gregory
        icon: mdi:calendar-check
        unit_of_measurement: "jours"
        state: >-
          {% set blocs = state_attr('sensor.horaires_pro_blocs_gregory', 'blocs')
             | default([], true) %}

          {{ blocs
             | selectattr('label', 'equalto', 'G_ADV_Mois')
             | list
             | length }}

      # ========================================================
      # GREGORY — ADV SAMEDI
      # ========================================================

      - name: "Horaires Pro ADV Samedi Gregory"
        unique_id: horaires_pro_adv_samedi_gregory
        icon: mdi:calendar-week
        unit_of_measurement: "jours"
        state: >-
          {% set blocs = state_attr('sensor.horaires_pro_blocs_gregory', 'blocs')
             | default([], true) %}

          {{ blocs
             | selectattr('label', 'equalto', 'G_ADV_Samedi')
             | list
             | length }}

      # ========================================================
      # GREGORY — ADV 13E MOIS
      # ========================================================

      - name: "Horaires Pro ADV 13eme Mois Gregory"
        unique_id: horaires_pro_adv_13eme_mois_gregory
        icon: mdi:calendar-star
        unit_of_measurement: "jours"
        state: >-
          {% set blocs = state_attr('sensor.horaires_pro_blocs_gregory', 'blocs')
             | default([], true) %}

          {{ blocs
             | selectattr('label', 'equalto', 'G_ADV_13eme_mois')
             | list
             | length }}

      # ========================================================
      # SANDRINE — TRAVAIL EFFECTIF
      # ========================================================

      - name: "Horaires Pro Heures Travail Sandrine"
        unique_id: horaires_pro_heures_travail_sandrine
        icon: mdi:clock-check-outline
        unit_of_measurement: "min"
        state: >-
          {% set blocs = state_attr('sensor.horaires_pro_blocs_sandrine', 'blocs')
             | default([], true) %}

          {% set ns = namespace(total=0) %}

          {% for bloc in blocs %}
            {% set ns.total = ns.total + (bloc.effective_minutes | int(0)) %}
          {% endfor %}

          {{ ns.total }}

        attributes:
          heures: >-
            {% set blocs = state_attr('sensor.horaires_pro_blocs_sandrine', 'blocs')
               | default([], true) %}
            {% set ns = namespace(total=0) %}

            {% for bloc in blocs %}
              {% set ns.total = ns.total + (bloc.effective_minutes | int(0)) %}
            {% endfor %}

            {{ (ns.total / 60) | round(2) }}

          affichage: >-
            {% set blocs = state_attr('sensor.horaires_pro_blocs_sandrine', 'blocs')
               | default([], true) %}
            {% set ns = namespace(total=0) %}

            {% for bloc in blocs %}
              {% set ns.total = ns.total + (bloc.effective_minutes | int(0)) %}
            {% endfor %}

            {{ (ns.total // 60) | int }}h{{ '%02d' | format(ns.total % 60) }}

      # ========================================================
      # SANDRINE — CSU
      # ========================================================

      - name: "Horaires Pro CSU Sandrine"
        unique_id: horaires_pro_csu_sandrine
        icon: mdi:clock-minus-outline
        unit_of_measurement: "min"
        state: >-
          {% set annee = now().year %}
          {% set plafond_heures = 56 if annee <= 2026 else 64 %}
          {% set plafond_minutes = plafond_heures * 60 %}
          {% set blocs = state_attr('sensor.horaires_pro_blocs_sandrine', 'blocs')
             | default([], true) %}
          {% set ns = namespace(utilise=0) %}

          {% for bloc in blocs %}
            {% if bloc.label == 'S_CSU'
                  and bloc.date
                  and bloc.date[:4] == (annee | string) %}
              {% set ns.utilise = ns.utilise + (bloc.duration_minutes | int(0)) %}
            {% endif %}
          {% endfor %}

          {{ [plafond_minutes - ns.utilise, 0] | max }}

        attributes:
          annee: "{{ now().year }}"

          plafond_heures: >-
            {{ 56 if now().year <= 2026 else 64 }}

          plafond_minutes: >-
            {{ (56 if now().year <= 2026 else 64) * 60 }}

          initial: >-
            {{ (56 if now().year <= 2026 else 64) * 60 }}

          utilise: >-
            {% set annee = now().year %}
            {% set blocs = state_attr('sensor.horaires_pro_blocs_sandrine', 'blocs')
