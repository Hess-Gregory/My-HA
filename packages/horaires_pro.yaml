# ============================================================
# HORAIRES PRO — Todoist
# ============================================================
# Système indépendant du Kanban familial
#
# VERSION
# ------------------------------------------------------------
# Version : 2.4.0
# Date    : 2026-09-17
# Heure   : (à ajuster à l'heure réelle de déploiement)
# Fuseau  : Europe/Brussels
#
# MODIFICATIONS — VERSION 2.4.0
# ------------------------------------------------------------
# - Alignement des libellés "nom" des blocs (Blocs Gregory / Blocs
#   Sandrine, ci-dessous) sur les libellés du formulaire d'édition
#   (horaires_pro_editeur.yaml) : 'ADV' -> 'ADV mensuel',
#   'Heures supplémentaires' -> 'Heures supplémentaires prestées',
#   'Récupération heures supplémentaires' -> 'Heures supplémentaires
#   déduites'. Nécessaire pour que le bouton "Modifier" du nouveau
#   panneau Détails & Édition puisse pré-remplir correctement le
#   menu déroulant du type (sinon l'option n'existait pas et la
#   sélection échouait silencieusement).
# - Voir horaires_pro_editeur.yaml pour le panneau complet
#   Créer / Modifier / Supprimer avec détail structuré et coloré.
#
# MODIFICATIONS — VERSION 2.3.1
# ------------------------------------------------------------
# - RETOUR EN ARRIÈRE sur l'approche "2 calendriers Global" de la
#   v2.3.0 : le bloc `calendar: - platform: todoist` (ci-dessous)
#   échoue entièrement au démarrage de HA avec :
#     "Error while setting up todoist platform for calendar:
#      403 Client Error: Forbidden for url:
#      https://api.todoist.com/api/v1/projects"
#   -> confirmé dans les logs HA après redémarrage : AUCUN calendrier
#      de ce bloc ne se crée (ni les nouveaux HP*-Global, ni les ~40
#      calendriers par type déjà présents avant). Cause indépendante
#      du token (les capteurs REST plus bas, qui interrogent des
#      ressources précises par ID, fonctionnent avec le même secret) :
#      le blocage touche spécifiquement l'appel qui liste TOUS les
#      projets Todoist (GET /api/v1/projects), nécessaire même pour
#      résoudre "Horaires Pro" par son nom dans include_projects.
#   -> Cause exacte non confirmée (bug possible côté bibliothèque
#      todoist_api_python / API Todoist, ou restriction spécifique à
#      cet appel) — non réparable depuis la config YAML seule.
# - Les blocs custom_projects ci-dessous (HP Gregory/Sandrine -
#   Global + les ~40 par type) sont CONSERVÉS tels quels dans ce
#   fichier (inertes, sans effet néfaste) au cas où le 403 se
#   résolve plus tard (mise à jour HA, correctif upstream...) — pas
#   besoin de les retaper si ça se débloque un jour.
# - Le correctif réel pour l'inversion de couleurs Gregory/Sandrine
#   est appliqué UNIQUEMENT côté dashboard (family-calendar-card),
#   pas ici : retour à calendar.horaires_pro (qui fonctionne, lui,
#   car issu de l'intégration Todoist moderne) avec un regex `filter`
#   corrigé. Voir dashboard-calendrier.yaml pour le détail.
#
# MODIFICATIONS — VERSION 2.3.0 (abandonnée, voir 2.3.1)
# ------------------------------------------------------------
# - Tentative d'ajout de 2 calendriers agrégés "Global" (un par
#   personne) via custom_projects, pour contourner la collision
#   this._calByEntity de family-calendar-card. Non fonctionnelle :
#   voir raison ci-dessus (403 sur le bloc calendar:platform:todoist).
#
# MODIFICATIONS — VERSION 2.2.0
# ------------------------------------------------------------
# - Passage de S_Recup_Heures_48h à S_CSU
# - Plafond CSU de 56 h en 2026
# - Plafond CSU de 64 h à partir du 01/01/2027
# - Réinitialisation automatique du calcul chaque 1er janvier
# - Ajout du versioning exposé à Home Assistant
# - Nouveau sensor : sensor.horaires_pro_version
# - Informations exposées : version, date, heure, affichage
# - Conservation du fonctionnement Todoist / Horaires Pro
# ============================================================

rest:
  - resource: "https://api.todoist.com/api/v1/projects/6hWVvMpjWrXvrCRm"
    method: GET
    headers:
      Authorization: !secret todoist_api_token
    scan_interval: 300
    sensor:
      - name: "Horaires Pro Projet"
        unique_id: horaires_pro_projet
        value_template: "{{ value_json.name }}"
        json_attributes:
          - id
          - name
          - color
          - view_style

  - resource: "https://api.todoist.com/api/v1/tasks?project_id=6hWVvMpjWrXvrCRm&limit=200"
    method: GET
    headers:
      Authorization: !secret todoist_api_token
    scan_interval: 300
    sensor:
      - name: "Horaires Pro Taches"
        unique_id: horaires_pro_taches
        value_template: "{{ value_json.results | length }}"
        json_attributes:
          - results
          - next_cursor

# ============================================================
# TODOIST — CALENDRIERS HORAIRES PRO
# ============================================================
# Ces calendriers sont des vues filtrées de Todoist.
# Ils ne créent ni ne modifient aucune tâche.
#
# 1 calendrier = 1 type de bloc (pour le détail fin).
# + 2 calendriers "Global" (1 par personne, tous types confondus)
#   ajoutés en v2.3.0 pour l'affichage côte à côte dans
#   family-calendar-card, sans collision d'entité.
#
# Todoist reste la source de vérité.
# ============================================================

calendar:
  - platform: todoist
    token: !secret todoist_api_token
    custom_projects:
      # ========================================================
      # GREGORY — GLOBAL (NOUVEAU v2.3.0)
      # ========================================================
      # Un seul calendrier agrégeant TOUS les labels G_*.
      # custom_projects.labels fonctionne en OU (une tâche est
      # incluse dès qu'elle a AU MOINS UN des labels listés) —
      # vérifié dans le code de l'intégration Todoist de HA.
      # A utiliser dans family-calendar-card à la place de
      # calendar.horaires_pro + filter regex.

      - name: "HP Gregory - Global"
        include_projects:
          - "Horaires Pro"
        labels:
          - G_Jour_Normal
          - G_Journee_Reduite
          - G_Heures_Supp_Prestees
          - G_Heures_Supp_Deduites
